이 반환</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"집계\">집계<a class=\"anchor\" href=\"#/reference/endpoints@집계\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>호스트 / 접두사</th><th>건수</th></tr></thead><tbody><tr><td><code>api.chzzk.naver.com</code> — <code>/service</code></td><td>43</td></tr><tr><td><code>api.chzzk.naver.com</code> — <code>/polling</code></td><td>2</td></tr><tr><td><code>api.chzzk.naver.com</code> — <code>/commercial</code></td><td>6</td></tr><tr><td><code>api.chzzk.naver.com</code> — <code>/manage</code>. 인증 필요</td><td>27 + <strong>미확보 20</strong></td></tr><tr><td><code>comm-api.game.naver.com/nng_main</code></td><td>8</td></tr><tr><td><code>apis.naver.com/nng_main/nng_comment_api</code></td><td>2</td></tr><tr><td><code>creatorhub-api.naver.com</code> — 응답 봉투 B형</td><td>4</td></tr><tr><td><code>apis.naver.com/neonplayer</code></td><td>1</td></tr><tr><td>WebSocket</td><td>2</td></tr><tr><td><strong>합계</strong></td><td><strong>95 + 20 = 115</strong></td></tr></tbody></table></div>", "toc": [{"level": 2, "id": "apichzzknavercom--service-43", "text": "api.chzzk.naver.com — /service (43)"}, {"level": 2, "id": "apichzzknavercom--polling-2", "text": "api.chzzk.naver.com — /polling (2)"}, {"level": 2, "id": "apichzzknavercom--commercial-6", "text": "api.chzzk.naver.com — /commercial (6)"}, {"level": 2, "id": "apichzzknavercom--manage-인증-필요-27", "text": "api.chzzk.naver.com — /manage. 인증 필요 (27)"}, {"level": 2, "id": "comm-apigamenavercomnng_main-8", "text": "comm-api.game.naver.com/nng_main (8)"}, {"level": 2, "id": "apisnavercomnng_mainnng_comment_api-2", "text": "apis.naver.com/nng_main/nng_comment_api (2)"}, {"level": 2, "id": "creatorhub-apinavercom--응답-봉투-b형-4", "text": "creatorhub-api.naver.com — 응답 봉투 B형 (4)"}, {"level": 2, "id": "apisnavercomneonplayer-1", "text": "apis.naver.com/neonplayer (1)"}, {"level": 2, "id": "websocket-2", "text": "WebSocket (2)"}, {"level": 2, "id": "집계", "text": "집계"}]}, "reference/enums": {"title": "Enum 레퍼런스", "html": "<h1 id=\"enum-레퍼런스\">Enum 레퍼런스<a class=\"anchor\" href=\"#/reference/enums@enum-레퍼런스\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>요청 파라미터와 응답 필드에 사용되는 값의 목록입니다.<br>관측된 값만 수록하며, 존재가 추정되나 캡처되지 않은 값은 미확인으로 표기합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>관련 문서</td><td><a href=\"#/reference/endpoints\" data-nav>엔드포인트 전체 목록</a> · <a href=\"#/core/conventions@식별자\" data-nav>식별자</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"콘텐츠\">콘텐츠<a class=\"anchor\" href=\"#/reference/enums@콘텐츠\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th></tr></thead><tbody><tr><td>categoryType</td><td><code>GAME</code> · <code>SPORTS</code> · <code>ETC</code></td></tr><tr><td>status (라이브)</td><td><code>OPEN</code> · <code>CLOSE</code></td></tr><tr><td>videoType</td><td><code>REPLAY</code> · <code>UPLOAD</code></td></tr><tr><td>vodStatus</td><td><code>ABR_HLS</code></td></tr><tr><td>mediaType</td><td><code>SHORT_FORM</code></td></tr><tr><td>cardType</td><td><code>CONTENT</code></td></tr><tr><td>mediaScaleType</td><td><code>CROP</code></td></tr><tr><td>화질 트랙</td><td><code>144p</code> · <code>360p</code> · <code>480p</code> · <code>720p</code> · <code>1080p</code> · <code>alow.stream</code></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"채팅\">채팅<a class=\"anchor\" href=\"#/reference/enums@채팅\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th></tr></thead><tbody><tr><td>chatAvailableGroup</td><td><code>ALL</code> · <code>FOLLOWER</code> · <code>MANAGER</code> · <code>SUBSCRIBER</code></td></tr><tr><td>chatAvailableCondition</td><td><code>NONE</code> · <code>REAL_NAME</code></td></tr><tr><td>messageTypeCode</td><td><code>1</code> TEXT · <code>2</code> IMAGE · <code>3</code> STICKER · <code>4</code> VIDEO · <code>5</code> RICH · <code>10</code> DONATION · <code>11</code> SUBSCRIPTION · <code>30</code> SYSTEM_MESSAGE</td></tr><tr><td>messageStatusType</td><td><code>NORMAL</code></td></tr><tr><td>chatType</td><td><code>STREAMING</code></td></tr><tr><td>CONNECT auth</td><td><code>SEND</code>. <code>READ</code> 는 미확인</td></tr><tr><td>CONNECT ver</td><td><code>3</code>. 공개 라이브러리에 알려진 <code>2</code> 는 구버전</td></tr></tbody></table></div>\n<h3 id=\"cmd-코드\">cmd 코드<a class=\"anchor\" href=\"#/reference/enums@cmd-코드\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>수신에 사용되는 코드입니다. 송신 코드 <code>3101 SEND_CHAT</code> 은 이 문서의 범위 밖입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>cmd</th><th>이름</th></tr></thead><tbody><tr><td>0 / 10000</td><td>PING / PONG</td></tr><tr><td>100 / 10100</td><td>CONNECT / CONNECTED</td></tr><tr><td>5101 / 15101</td><td>REQUEST_RECENT_CHAT / RECENT_CHAT</td></tr><tr><td>93101</td><td>CHAT</td></tr><tr><td>93102</td><td>DONATION</td></tr><tr><td>93006</td><td>EVENT</td></tr><tr><td>94005 / 94006 / 94008</td><td>KICK / BLOCK / BLIND</td></tr><tr><td>94010 / 94015</td><td>NOTICE / PENALTY</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"사용자--권한\">사용자 · 권한<a class=\"anchor\" href=\"#/reference/enums@사용자--권한\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th></tr></thead><tbody><tr><td>userRole</td><td><code>USER</code> · <code>STREAMER</code>. <code>MANAGER</code> 는 미확인</td></tr><tr><td>userRoleCode</td><td><code>common_user</code>. <code>streamer</code> 와 <code>manager</code> 는 미확인</td></tr><tr><td>userAdultStatus</td><td><code>AGE_RESTRICTION</code> · <code>null</code></td></tr><tr><td>restrictReleaseState</td><td><code>NONE</code>. 그 외 값은 미확인</td></tr><tr><td>streamerCurrentGrade</td><td><code>GRADE_3</code></td></tr></tbody></table></div>\n<h3 id=\"permissions\">permissions<a class=\"anchor\" href=\"#/reference/enums@permissions\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>스트리머 본인일 때 반환되는 권한 값입니다.</p>\n<p><code>VIDEO_DELETE</code> · <code>VIDEO_HIDE</code> · <code>LIVE_CREATE</code> · <code>CHANNEL_MANAGE</code> · <code>CHAT_MANAGE</code> · <code>CHAT_BLIND</code> · <code>SETTLEMENT_MANAGE</code> · <code>PAID_WATCH_PARTY_SOURCE_PLAY</code></p>\n<hr>\n<h2 id=\"댓글\">댓글<a class=\"anchor\" href=\"#/reference/enums@댓글\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th></tr></thead><tbody><tr><td>objectType</td><td><code>STREAMING_VIDEO</code> · <code>CHANNEL_POST</code> · <code>CLIP</code></td></tr><tr><td>commentType</td><td><code>COMMENT</code> · <code>REPLY</code></td></tr><tr><td>orderType</td><td><code>POPULAR</code> · <code>DESC</code> · <code>ASC</code></td></tr><tr><td>pagingType</td><td><code>PAGE</code></td></tr><tr><td>attachType</td><td><code>PHOTO</code> · <code>STICKER</code></td></tr></tbody></table></div>\n<p><code>objectType</code> 마다 <code>objectId</code> 의 형식이 다릅니다. (<a href=\"#/modules/comment@objecttype\" data-nav>objectType 참조</a>)</p>\n<hr>\n<h2 id=\"클립\">클립<a class=\"anchor\" href=\"#/reference/enums@클립\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th><th>사용처</th></tr></thead><tbody><tr><td>orderType</td><td><code>RECENT</code>. <code>POPULAR</code> 는 미확인</td><td>공개 API</td></tr><tr><td>filterType</td><td><code>ALL</code>. 그 외 값은 미확인</td><td>공개 API</td></tr><tr><td>dateFilter</td><td><code>ALL</code></td><td>스튜디오</td></tr><tr><td>orderFilter</td><td><code>LATEST</code></td><td>스튜디오</td></tr><tr><td>optionalProperties</td><td><code>COMMENT</code> · <code>PRIVATE_USER_BLOCK</code> · <code>PENALTY</code> · <code>MAKER_CHANNEL</code> · <code>OWNER_CHANNEL</code></td><td>반복 파라미터</td></tr><tr><td>seedType</td><td><code>SPECIFIC</code></td><td>Creator Hub</td></tr><tr><td>serviceType</td><td><code>CHZZK</code></td><td>Creator Hub</td></tr><tr><td>recType</td><td><code>CHZZK</code></td><td>Creator Hub</td></tr><tr><td>panelType</td><td><code>sdk_chzzk</code></td><td>Creator Hub</td></tr><tr><td>deviceType</td><td><code>html5_mo</code></td><td>Creator Hub</td></tr><tr><td>extraLinks.type</td><td><code>TEXT</code> · <code>GENRE</code></td><td>Creator Hub</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"채널--기타\">채널 · 기타<a class=\"anchor\" href=\"#/reference/enums@채널--기타\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>값</th></tr></thead><tbody><tr><td>sortType (팔로잉)</td><td><code>FOLLOW</code>. 그 외 값은 미확인</td></tr><tr><td>sortType (구독자)</td><td><code>RECENT</code></td></tr><tr><td>tvAppViewingPolicyType</td><td><code>ALLOWED</code></td></tr><tr><td>catalogType (상점)</td><td>미확인</td></tr><tr><td>serviceId (Creator Hub)</td><td><code>2113</code>. 치지직 클립 고정값으로 보이나 미확인</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"알림-세션-타입\">알림 세션 타입<a class=\"anchor\" href=\"#/reference/enums@알림-세션-타입\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><code>donation@</code> · <code>subscription@</code> · <code>gift@</code> · <code>partydonation@</code> · <code>mission@</code> · <code>newsfeed@</code> · <code>video@</code> · <code>studio@</code> · <code>streamershop@</code></p>\n<p>(<a href=\"#/modules/notification@이벤트-세션-9종\" data-nav>이벤트 세션 9종 참조</a>)</p>\n<hr>\n<h2 id=\"제외된-enum\">제외된 Enum<a class=\"anchor\" href=\"#/reference/enums@제외된-enum\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>읽기 전용 범위 밖이라 수록하지 않은 값입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>사유</th></tr></thead><tbody><tr><td>watchEventType (<code>WATCH_STARTED</code> 등)</td><td><code>watch-event</code> 가 제외됨 (<a href=\"#/reference/deprecated\" data-nav>제외된 API 참조</a>)</td></tr></tbody></table></div>", "toc": [{"level": 2, "id": "콘텐츠", "text": "콘텐츠"}, {"level": 2, "id": "채팅", "text": "채팅"}, {"level": 3, "id": "cmd-코드", "text": "cmd 코드"}, {"level": 2, "id": "사용자--권한", "text": "사용자 · 권한"}, {"level": 3, "id": "permissions", "text": "permissions"}, {"level": 2, "id": "댓글", "text": "댓글"}, {"level": 2, "id": "클립", "text": "클립"}, {"level": 2, "id": "채널--기타", "text": "채널 · 기타"}, {"level": 2, "id": "알림-세션-타입", "text": "알림 세션 타입"}, {"level": 2, "id": "제외된-enum", "text": "제외된 Enum"}]}, "_work/step1-triage": {"title": "STEP 1 — 중복 / 못 쓰는 API 분류 결과", "html": "<h1 id=\"step-1--중복--못-쓰는-api-분류-결과\">STEP 1 — 중복 / 못 쓰는 API 분류 결과<a class=\"anchor\" href=\"#/_work/step1-triage@step-1--중복--못-쓰는-api-분류-결과\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>원본: <code>D:\\test\\CHZZK_UNOFFICIAL_API.md</code> (1120줄) <strong>최초 작성:</strong> 2026-07-29 <strong>갱신:</strong> 2026-07-29 — 클립 HAR 1,056건 + 스튜디오 HAR 315건 + 댓글 HAR 2회 분석 반영</p>\n<p>판정 규칙(사용자 지시):</p>\n<ol><li><strong>GET 전용</strong> — POST/PUT/DELETE는 전량 버림 ← 최우선, 아래 규칙보다 우선함</li><li>대체 가능하면 버림 / 대체 불가면 남김</li></ol>\n<hr>\n<h2 id=\"0-전역-규칙--get-only\">0. 전역 규칙 — GET only<a class=\"anchor\" href=\"#/_work/step1-triage@0-전역-규칙--get-only\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><strong>이 문서는 읽기 전용 API만 다룹니다.</strong> 상태를 바꾸는 요청은 대체재 유무와 무관하게 전부 제외합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>결과</th><th>내용</th></tr></thead><tbody><tr><td>제외</td><td>서버 상태를 바꾸는 <code>POST</code> · <code>PUT</code> · <code>DELETE</code> 전량 (12건)</td></tr><tr><td>유지</td><td><code>GET</code> + WebSocket <strong>수신</strong> + <strong>조회용 POST 1건</strong>(<code>clips/detail-bulk</code>)</td></tr><tr><td>부수 효과</td><td>스트림 키·채널 설정 변경 사고, 시청자 수 조작(<code>watch-event</code>) <strong>원천 차단</strong></td></tr></tbody></table></div>\n<blockquote><p>방금 있었던 스트림 키 노출 건을 감안하면, 읽기 전용으로 못 박는 편이 문서 자체의 위험도를 크게 낮춥니다.</p></blockquote>\n<p><strong>WebSocket 처리:</strong> 핸드셰이크가 HTTP GET 업그레이드이고 소비가 수신이므로 <strong>유지</strong>합니다. 단 채팅 <strong>송신</strong> <code>cmd 3101 SEND_CHAT</code>은 쓰기이므로 cmd 표에서 제외합니다 (수신 cmd는 전부 유지).</p>\n<h3 id=\"조회용-post-예외--1건-사용자-판단으로-유지\">조회용 POST 예외 — 1건 (사용자 판단으로 유지)<a class=\"anchor\" href=\"#/_work/step1-triage@조회용-post-예외--1건-사용자-판단으로-유지\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>엔드포인트</th><th>성격</th><th>유지 근거</th></tr></thead><tbody><tr><td><code><span class=\"method m-post\">POST</span> /service/v1/clips/detail-bulk</code></td><td><strong>메서드만 POST, 실제는 조회.</strong> 본문에 <code>clipUIDList[]</code>를 담아야 해서 GET이 아닐 뿐</td><td>유일한 GET 대체재 <code><span class=\"method m-get\">GET</span> /service/v1/clips/{clipUID}/detail</code>는 1건씩 → 클립 N개면 요청 N배. 캡처 규모(1,056건) 기준 약 10배</td></tr></tbody></table></div>\n<blockquote><p>정확히는 규칙이 <strong>&quot;GET 전용&quot;이 아니라 &quot;읽기 전용&quot;</strong>입니다. 판정 기준은 메서드가 아니라 <strong>서버 상태를 바꾸는가</strong>입니다. <code>detail-bulk</code>는 조회이므로 유지, <code>watch-event</code>(집계 적재)·<code>live-status</code>(로그 적재)는 POST이자 쓰기이므로 제외. STEP 3 문서에는 이 엔드포인트에 <strong>&quot;조회용 POST — 예외&quot;</strong> 배지를 답니다.</p></blockquote>\n<hr>\n<h2 id=\"01-갱신-요약\">0.1 갱신 요약<a class=\"anchor\" href=\"#/_work/step1-triage@01-갱신-요약\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>항목</th><th>최초</th><th>2차</th><th><strong>읽기 전용</strong></th></tr></thead><tbody><tr><td>총 엔드포인트</td><td>89</td><td>약 115</td><td><strong>116</strong> (STEP 2 배치 기준 확정)</td></tr><tr><td>중복 (정본 지정 필요)</td><td>9건</td><td>12건</td><td>12건</td></tr><tr><td>버림</td><td>4건</td><td>11건</td><td><strong>23건</strong> (+12)</td></tr><tr><td>남김</td><td>26건</td><td>18건</td><td><strong>6건</strong></td></tr><tr><td>판정 보류</td><td>4건</td><td>0건</td><td>0건</td></tr><tr><td>🆕 신규 미해결</td><td>—</td><td>2건</td><td>2건</td></tr></tbody></table></div>\n<blockquote><p><strong>총계 정정:</strong> 최초 89건은 §8 클립 3건(<code>clips/{clipUID}/detail</code>, <code>detail-bulk</code>, <code>upload/enable</code>)을 빠뜨린 수치였습니다. STEP 2에서 전 엔드포인트를 모듈에 배치하며 재집계한 <strong>116건</strong>(이름 확인 94 + Manage 미확보 22)이 확정치입니다.</p></blockquote>\n<p><strong>가장 큰 변화 2가지</strong></p>\n<ol><li><strong>§12 채팅 절이 통째로 오류였습니다.</strong> &quot;채팅 시스템이 2개로 갈렸다&quot;는 전제가 틀렸고(신 소켓은 채팅이 아니라 개인 알림), &quot;서버번호 공식이 깨졌다&quot;도 틀렸습니다(애초에 cid에서 서버를 유도하지 않음).</li><li><strong>§15의 대표 결론 &quot;시계열 데이터가 아예 없습니다 — 가장 큰 벽&quot;이 뒤집혔습니다.</strong> <code>manage/v1/.../stats/*</code>가 존재합니다 (본인 채널 한정).</li></ol>\n<hr>\n<h2 id=\"문서에-반드시-반영할-보안-항목\">문서에 반드시 반영할 보안 항목<a class=\"anchor\" href=\"#/_work/step1-triage@문서에-반드시-반영할-보안-항목\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>기존 §주의사항의 노출 금지 목록에 <strong><code>streamKey</code> / <code>streamUrl</code>을 추가</strong>해야 합니다.</p>\n<div class=\"code\"><pre><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{channelId}/streaming-info\n→ &quot;streamKey&quot;: &quot;&lt;32자&gt;&quot;, &quot;streamUrl&quot;: &quot;rtmp://global-rtmp.lip2.navercorp.com:8080/relay&quot;</code></pre></div>\n<blockquote><p><strong>크롬 sanitized HAR 내보내기는 응답 본문을 지우지 않습니다.</strong> 쿠키·헤더만 제거합니다. 이 경고문을 문서에 넣어야 같은 사고가 재발하지 않습니다.</p></blockquote>\n<p>기존 목록: <code>liveTokenList</code> · <code>extraToken</code> · Socket.IO <code>auth</code> · 스트림 키 → 갱신: <code>liveTokenList</code> · <code>extraToken</code> · <code>accTkn</code> · Socket.IO <code>auth</code> · <strong><code>streamKey</code></strong> · <strong><code>streamUrl</code></strong></p>\n<hr>\n<h2 id=\"a-중복--정본-1곳-지정-나머지는-링크로-대체\">A. 중복 — 정본 1곳 지정, 나머지는 링크로 대체<a class=\"anchor\" href=\"#/_work/step1-triage@a-중복--정본-1곳-지정-나머지는-링크로-대체\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"a-1-절이-달라서-흩어진-중복-12건\">A-1. 절이 달라서 흩어진 중복 (12건)<a class=\"anchor\" href=\"#/_work/step1-triage@a-1-절이-달라서-흩어진-중복-12건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>엔드포인트</th><th>현재 위치</th><th>정본(STEP 2 기준)</th></tr></thead><tbody><tr><td>1</td><td><code><span class=\"method m-get\">GET</span> /polling/v3.1/channels/{id}/live-status</code></td><td>§6.2 · §7 · §15 (3곳)</td><td><code>modules/live.md</code></td></tr><tr><td>2</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/clips</code></td><td>§6.1 표 · §8 상세</td><td><code>modules/clip.md</code></td></tr><tr><td>3</td><td><code><span class=\"method m-get\">GET</span> /api/v5.0/clipviewer/card</code></td><td>§11 표 · §16 전체 파라미터</td><td><code>modules/clip.md</code></td></tr><tr><td>4</td><td><code><span class=\"method m-get\">GET</span> /service/v3/videos/{videoNo}</code></td><td>§6.4 · §15 표 3행</td><td><code>modules/video.md</code></td></tr><tr><td>5</td><td><code><span class=\"method m-get\">GET</span> /service/v1/videos/{videoNo}/chats</code></td><td>§6.4 · §15 · §12.5 팁 (3곳)</td><td><code>modules/video.md</code></td></tr><tr><td>6</td><td>VOD 재생 매니페스트</td><td>§1 Base URL 표 · §6.4</td><td><code>modules/video.md</code></td></tr><tr><td>7</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/data?fields=</code></td><td>§6.1 · §15 2행</td><td><code>modules/channel.md</code></td></tr><tr><td>8</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}</code></td><td>§6.1 표 · §15 표</td><td><code>modules/channel.md</code></td></tr><tr><td>9</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/videos</code></td><td>§6.1 표 · §15 표</td><td><code>modules/channel.md</code></td></tr><tr><td><strong>10</strong> 🆕</td><td><strong><code><span class=\"method m-get\">GET</span> /service/v1/personal/session-url</code></strong></td><td>§6.7 &quot;기타&quot; 표 1행 · §12.3 &quot;<code>auth</code> 토큰 발급 경로 &quot;</td><td><code>modules/notification.md</code></td></tr><tr><td><strong>11</strong> 🆕</td><td>manage 통계 ↔ §15 폴링 수집 서술</td><td>§13(미기재) · §15 &quot;직접 쌓는 수밖에&quot;</td><td><code>reference/analytics.md</code> (본인/타 채널 분기)</td></tr><tr><td><strong>12</strong> 🆕</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/streams</code> ↔ <code>/streaming-info</code></td><td>§13 표</td><td><code>modules/manage.md</code> (실사용 = <code>streaming-info</code>)</td></tr></tbody></table></div>\n<blockquote><p><strong>#10이 가장 뼈아픈 중복입니다.</strong> §6.7 &quot;기타&quot; 표에 무심하게 한 줄 있던 <code>personal/session-url</code>이, §12.3에서 &quot;다음 캡처 과제&quot;로 찾던 바로 그 경로였습니다. 문서 양쪽 끝에 떨어져 있어서 연결이 안 됐습니다. <strong>모듈화가 왜 필요한지 보여주는 직접 사례</strong>라 STEP 3 README에 남길 만합니다.</p></blockquote>\n<h3 id=\"a-2-중복-아님--유지-표--바로-아래-상세-패턴\">A-2. 중복 아님 — 유지 (표 + 바로 아래 상세 패턴)<a class=\"anchor\" href=\"#/_work/step1-triage@a-2-중복-아님--유지-표--바로-아래-상세-패턴\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>my-info</code> · <code>channels/followings</code> · <code>topics/HOME/.../main</code> · <code>categories/live</code></p>\n<h3 id=\"a-3-중복-아님--동명이경-구분-명시-필요-2건--5건\">A-3. 중복 아님 — 동명이경, 구분 명시 필요 (2건 → <strong>5건</strong>)<a class=\"anchor\" href=\"#/_work/step1-triage@a-3-중복-아님--동명이경-구분-명시-필요-2건--5건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>service (공개)</th><th>manage (스튜디오)</th></tr></thead><tbody><tr><td><code>chat-rules</code></td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/chat-rules</code></td><td><code>GET/PUT /manage/v1/channels/{id}/chat-rules</code></td></tr><tr><td><code>videos</code></td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/videos</code></td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/videos</code></td></tr><tr><td><strong><code>clips</code></strong> 🆕</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/clips</code></td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/clips</code></td></tr><tr><td><strong><code>followers</code></strong> 🆕</td><td>(없음 — <code>followerCount</code>만)</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/followers</code></td></tr><tr><td><strong><code>live-setting</code></strong> 🆕</td><td>(없음)</td><td><code>/live-setting/{normal|chat|chat-mode|chat-condition}</code></td></tr></tbody></table></div>\n<h3 id=\"a-4-이름--기능-4--함정-인덱스-readme로-승격\">A-4. 이름 ≠ 기능 (§4) — 함정 인덱스, README로 승격<a class=\"anchor\" href=\"#/_work/step1-triage@a-4-이름--기능-4--함정-인덱스-readme로-승격\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code><span class=\"method m-post\">POST</span> /service/live-status</code> · <code><span class=\"method m-get\">GET</span> /polling/live-detail</code> · <code><span class=\"method m-get\">GET</span> /polling/v3.1/.../live-status</code> · <code><span class=\"method m-get\">GET</span> /service/v3.3/.../live-detail</code> 🆕 추가: <strong><code><span class=\"method m-get\">GET</span> /service/v1/personal/session-url</code></strong> — &quot;personal&quot;이라는 이름 때문에 알림 소켓 발급 경로임을 놓치기 쉬움</p>\n<hr>\n<h2 id=\"b-버림--24건\">B. 버림 — 24건<a class=\"anchor\" href=\"#/_work/step1-triage@b-버림--24건\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"b-0--get-only-규칙-위반--13건\">B-0. 🆕 GET only 규칙 위반 — 13건<a class=\"anchor\" href=\"#/_work/step1-triage@b-0--get-only-규칙-위반--13건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>메서드가 <code>GET</code>이 아니라는 이유만으로 버립니다. 대체재 유무를 따지지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>엔드포인트</th><th>Method</th><th>이전 판정</th><th>비고</th></tr></thead><tbody><tr><td>12</td><td><code>/polling/v1/watch-event/live</code></td><td>POST</td><td>남김</td><td>애초에 호출 금지였음</td></tr><tr><td>13</td><td><code>/polling/v1/watch-event/video</code></td><td>POST</td><td>남김</td><td>〃</td></tr><tr><td>14</td><td><code>/polling/v1/watch-event/clip</code></td><td>POST</td><td>남김</td><td>〃</td></tr><tr><td>15</td><td><code>/manage/v1/channels/{id}/live-setting/*</code></td><td>PUT</td><td>남김</td><td>GET은 유지</td></tr><tr><td>16</td><td><code>/manage/v1/channels/{id}/chats/prohibit-words</code></td><td>POST</td><td>남김</td><td>GET은 유지</td></tr><tr><td>17</td><td><code>/manage/v1/channels/{id}/chats/prohibit-words/{no}</code></td><td>DELETE·PUT</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr><tr><td>18</td><td><code>/manage/v1/channels/{id}/restrict-users</code></td><td>POST</td><td>남김</td><td>GET은 유지</td></tr><tr><td>19</td><td><code>/manage/v1/channels/{id}/restrict-users/{targetId}</code></td><td>DELETE</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr><tr><td>20</td><td><code>/manage/v1/channels/{id}/restrict-users/{targetId}/validate</code></td><td>POST</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr><tr><td>21</td><td><code>/manage/v1/channels/{id}/temporary-restrict-users</code></td><td>POST</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr><tr><td>22</td><td><code>/manage/v1/channels/{id}/restrict-release-requests/{no}/reject</code></td><td>POST</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr><tr><td>23</td><td><code>/manage/v1/channels/{id}/streaming-roles[/{targetId}]</code></td><td>PUT·DELETE</td><td>남김</td><td>GET은 유지 / <code>{targetId}</code> 경로 삭제</td></tr><tr><td>24</td><td><code>/manage/v1/channels/{id}/donations/mission/{approve,reject}</code></td><td>POST</td><td>남김</td><td><strong>경로 자체 삭제</strong></td></tr></tbody></table></div>\n<blockquote><p><code><span class=\"method m-post\">POST</span> /service/v1/clips/detail-bulk</code>는 <strong>조회용 POST라 예외로 유지</strong>합니다 (§0 참조).</p></blockquote>\n<p><strong>경로 자체가 사라지는 것 8개</strong> (쓰기 전용): <code>prohibit-words/{no}</code> · <code>restrict-users/{targetId}</code> · <code>validate</code> · <code>temporary-restrict-users</code> · <code>reject</code> · <code>mission/approve</code> · <code>mission/reject</code> · <code>streaming-roles/{targetId}</code></p>\n<blockquote><p>이 8개는 애초에 <strong>라이브러리 소스 기준 기재</strong>였고 스튜디오 실측 47개(전부 GET)에도 없었습니다. 즉 GET only 규칙으로 문서에서 사라지는 실측 경로는 <strong>0개</strong>입니다 — 검증된 것은 하나도 잃지 않습니다.</p></blockquote>\n<p><strong>§12.4 cmd 표에서 제외:</strong> <code>3101 SEND_CHAT</code> (송신). 수신 cmd(<code>93101</code> <code>93102</code> <code>93006</code> <code>94005</code> <code>94006</code> <code>94008</code> <code>94010</code> <code>94015</code>)와 <code>0</code>/<code>100</code>/<code>5101</code> 계열은 유지.</p>\n<h3 id=\"b-1-구버전불필요-기존-4건-유지\">B-1. 구버전·불필요 (기존 4건, 유지)<a class=\"anchor\" href=\"#/_work/step1-triage@b-1-구버전불필요-기존-4건-유지\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>버리는 것</th><th>대체재</th><th>남길 흔적</th></tr></thead><tbody><tr><td><code><span class=\"method m-post\">POST</span> /service/live-status</code> (텔레메트리)</td><td><code>polling/v3.1/.../live-status</code></td><td>함정 표 1행. 요청 본문 JSON 블록 삭제</td></tr><tr><td><code>live-detail</code> v1/v2</td><td><strong>v3.3</strong></td><td>마이그레이션 1줄</td></tr><tr><td><code>donations/missions</code> v1</td><td><strong>v2</strong></td><td>마이그레이션 1줄</td></tr><tr><td><code>profile-card</code></td><td><code>/profile</code> + <code>streamingChannelId</code></td><td>마이그레이션 1줄</td></tr></tbody></table></div>\n<h3 id=\"b-2--사실-오류-서술--전면-삭제재작성-7건\">B-2. 🆕 사실 오류 서술 — 전면 삭제·재작성 (7건)<a class=\"anchor\" href=\"#/_work/step1-triage@b-2--사실-오류-서술--전면-삭제재작성-7건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>기존에 &quot;남김&quot;으로 분류했던 것 중 <strong>틀린 내용으로 밝혀져 버리는 것들</strong>입니다. 대체재는 &quot;정정된 사실&quot; 그 자체입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>버리는 서술</th><th>왜 틀렸나</th><th>대체</th></tr></thead><tbody><tr><td>5</td><td><strong>§12.1 &quot;채팅 시스템이 2개로 갈렸습니다&quot;</strong> 비교표 전체</td><td><code>ssio{N}</code>은 채팅이 아니라 <strong>개인 알림 채널</strong>(<code>nng@glive</code>). WS 프레임 8개가 전부 핸드셰이크·하트비트, 채팅 페이로드 0건</td><td>채팅은 1종뿐 → §12 재작성 + 알림은 <code>notification.md</code>로 분리</td></tr><tr><td>6</td><td><strong>§12.2 &quot;서버 번호 공식이 깨졌습니다&quot;</strong> 절 전체</td><td>modulus가 바뀐 게 아니라 <strong>cid에서 서버를 유도한다는 전제 자체가 무효</strong>. 동일 cid <code>N2dc9q</code>가 <code>kr-ss24</code>·<code>kr-ss35</code> 양쪽 접속 성공(<code>retCode 0</code>)</td><td>&quot;풀 내 아무 서버나 접속&quot; 1줄</td></tr><tr><td>7</td><td>§12.2 &quot;다음 캡처 최우선 과제&quot; 액션 아이템</td><td>해결됨</td><td>삭제</td></tr><tr><td>8</td><td><strong>§12.4 CONNECT <code>ver: &quot;2&quot;</code></strong></td><td>실제 <strong><code>ver: &quot;3&quot;</code></strong>, <code>bdy</code> 확장(<code>libVer</code> <code>windowId</code> <code>timezone</code> <code>devName</code> 등). 응답 <code>cmd:10100</code>의 <code>bdy.sid</code>를 이후 전 요청에 포함</td><td>v3 바디 전문으로 교체</td></tr><tr><td>9</td><td><strong>§9 대댓글 추정 경로 <code>.../replies</code></strong></td><td>실제는 <strong><code>replyComments</code></strong></td><td>확정 경로로 교체, 제거</td></tr><tr><td>10</td><td><strong>§15 &quot;#1 시계열 데이터가 아예 없습니다 — 가장 큰 벽&quot;</strong></td><td><code>manage/v1/.../stats/{lives,videos,recent-live}</code> 존재</td><td><strong>본인 채널 = stats API / 타 채널 = 폴링</strong>으로 분기 재작성</td></tr><tr><td>11</td><td>§15 &quot;#2 <code>accumulateCount</code> — live-detail과 대조하세요&quot; 액션</td><td>양쪽 다 <code>0</code>. <strong>필드 자체가 무효</strong></td><td>&quot;누적은 VOD <code>livePv</code> 사용&quot; 결론으로 교체</td></tr></tbody></table></div>\n<blockquote><p><strong>§15 &quot;#3 스트리머 인증이 필요한 것들 — 어떤 방법으로도 접근 불가&quot;는 절반만 유지됩니다.</strong> 본인 채널은 <code>stats/*</code>로 접근 가능해졌습니다. <strong>타 채널 분석에는 폴링이 여전히 유일</strong>하다는 부분만 남깁니다.</p></blockquote>\n<h3 id=\"b-3--마커-제거-보류-4건-전건-해결\">B-3. 🆕 마커 제거 (보류 4건 전건 해결)<a class=\"anchor\" href=\"#/_work/step1-triage@b-3--마커-제거-보류-4건-전건-해결\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>위치</th><th>이전</th><th>확정</th></tr></thead><tbody><tr><td>§6.1 <code>data?fields</code> 표</td><td><code>description</code></td><td><strong>유효</strong> — 응답에 <code>description</code> 반환</td></tr><tr><td>§9 objectType 표</td><td>클립</td><td><strong><code>CLIP</code></strong>, <code>objectId</code> = <strong><code>clipUID</code></strong>(10자)</td></tr><tr><td>§9 대댓글</td><td><code>replies</code></td><td><strong><code>replyComments</code></strong>, <code>offset</code>만 (limit 없음)</td></tr><tr><td>§15 #2</td><td><code>accumulateCount</code> 대조 필요</td><td><strong>무효 필드</strong> 확정</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"c-남김--6건\">C. 남김 — 6건<a class=\"anchor\" href=\"#/_work/step1-triage@c-남김--6건\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"c-1-채팅--1건----판정-변경\">C-1. 채팅 — 1건 · 💀 → 판정 변경<a class=\"anchor\" href=\"#/_work/step1-triage@c-1-채팅--1건----판정-변경\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>wss://kr-ss{N}.chat.naver.com/chat</code> — <strong>접속 가능.</strong> 서버번호는 풀 내 임의. 대체 불가(실시간 채팅 유일 경로) + 핸드셰이크가 HTTP GET 업그레이드 → 유지. <strong>수신 전용으로 문서화합니다.</strong> 송신(<code>cmd 3101</code>)은 §B-0에서 제외.</p>\n<p>잔여 경미 미검증: 유효 서버번호 범위 · <code>auth:&quot;READ&quot;</code>로 <code>uid</code> 없이 접속 가능 여부 · <code>libVer</code>/<code>windowId</code> 필수 여부</p>\n<h3 id=\"c-2-manage-쓰기-계열--9건--b-0으로-이동-get-only\"><del>C-2. Manage 쓰기 계열 — 9건</del> → <strong>§B-0으로 이동 (GET only)</strong><a class=\"anchor\" href=\"#/_work/step1-triage@c-2-manage-쓰기-계열--9건--b-0으로-이동-get-only\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<h3 id=\"c-3-get-미포착--2건\">C-3. GET 미포착 — 2건<a class=\"anchor\" href=\"#/_work/step1-triage@c-3-get-미포착--2건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>/auto-complete/categories?keyword=</code> (카테고리 검색창 타이핑) · <code>/channels/{id}/users/{targetId}/chat-activity-count</code> (시청자 클릭)</p>\n<h3 id=\"c-4--신규-미해결--2건\">C-4. 🆕 신규 미해결 — 2건<a class=\"anchor\" href=\"#/_work/step1-triage@c-4--신규-미해결--2건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>항목</th><th>막힌 지점</th></tr></thead><tbody><tr><td>N-1</td><td><code>manage/v1/channels/{id}/stats/{lives,videos,recent-live}</code></td><td>스키마 일부만 확보(<code>summaryVideoStat</code>). <code>liveStatList[]</code>·<code>videoStatList[]</code> 빈 배열, <code>summaryLiveStat</code>·<code>recent-live</code> <code>null</code> → <strong>일별 배열 항목 구조 미상</strong></td></tr><tr><td>N-2</td><td><code>manage/v1/alerts/{sessionIOChannelId}/session-url</code> + 이벤트 세션 9종</td><td>응답 <code>url</code>·<code>app</code> 공백. 각 채널 페이로드 구조 전량 미확인</td></tr></tbody></table></div>\n<p>이벤트 세션 9종: <code>donation@</code> <code>subscription@</code> <code>newsfeed@</code> <code>video@</code> <code>mission@</code> <code>gift@</code> <code>partydonation@</code> <code>studio@</code> <code>streamershop@</code></p>\n<h3 id=\"c-5-조사-대상-아님--1건-4건--1건\">C-5. 조사 대상 아님 — 1건 (4건 → 1건)<a class=\"anchor\" href=\"#/_work/step1-triage@c-5-조사-대상-아님--1건-4건--1건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code><span class=\"method m-get\">GET</span> /polling/live-detail?entityId=&amp;abTestNoList=</code> 이름 함정 근거로만 보존 (진짜 상세는 <code><span class=\"method m-get\">GET</span> /service/v3.3/.../live-detail</code>)</p>\n<blockquote><p><code>watch-event</code> 3건은 GET only 규칙으로 §B-0에서 제외됐습니다. 호출 금지 경고문도 함께 삭제 — 문서에 없는 API를 경고할 이유가 없습니다.</p></blockquote>\n<hr>\n<h2 id=\"d--신규-반영-대상\">D. 🆕 신규 반영 대상<a class=\"anchor\" href=\"#/_work/step1-triage@d--신규-반영-대상\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"d-1-manage-경로-정정--문서-기재가-실제와-다름\">D-1. Manage 경로 정정 — 문서 기재가 실제와 다름<a class=\"anchor\" href=\"#/_work/step1-triage@d-1-manage-경로-정정--문서-기재가-실제와-다름\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>문서 기재</th><th>실제</th></tr></thead><tbody><tr><td><code>/channels/{id}/streams</code></td><td>유효하나 실사용은 <strong><code>/streaming-info</code></strong></td></tr><tr><td><code>/channels/{id}/live-setting</code></td><td><strong>4개로 분리</strong> — <code>/normal</code> <code>/chat</code> <code>/chat-mode</code> <code>/chat-condition</code></td></tr><tr><td>(없음)</td><td><strong><code>manage/v2/channels/{id}/center-status</code></strong> — v2 존재</td></tr><tr><td>(없음)</td><td><code>/my-role</code> <code>/my-status</code> <code>/stats/*</code> <code>/streaming-info</code> <code>/clips</code> <code>/clips/make-clips</code> <code>/news-feeds</code> <code>/party/summary</code> <code>/alerts/{id}/session-url</code> 등</td></tr></tbody></table></div>\n<h3 id=\"d-2-enum-추가-14\">D-2. Enum 추가 (§14)<a class=\"anchor\" href=\"#/_work/step1-triage@d-2-enum-추가-14\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Enum</th><th>추가 값</th></tr></thead><tbody><tr><td><code>orderType</code> (댓글)</td><td><code>POPULAR</code> · <code>DESC</code> · <strong><code>ASC</code></strong></td></tr><tr><td><code>commentType</code></td><td><code>COMMENT</code> · <strong><code>REPLY</code></strong></td></tr><tr><td><code>userRole</code></td><td><code>USER</code> · <strong><code>STREAMER</code></strong> (확정, 제거)</td></tr><tr><td><code>permissions</code> 🆕</td><td><code>VIDEO_DELETE</code> <code>VIDEO_HIDE</code> <code>LIVE_CREATE</code> <code>CHANNEL_MANAGE</code> <code>CHAT_MANAGE</code> <code>CHAT_BLIND</code> <code>SETTLEMENT_MANAGE</code> <code>PAID_WATCH_PARTY_SOURCE_PLAY</code></td></tr><tr><td><code>dateFilter</code> / <code>orderFilter</code> (클립) 🆕</td><td><code>ALL</code> / <code>LATEST</code></td></tr><tr><td><code>sortType</code> (구독자) 🆕</td><td><code>RECENT</code></td></tr><tr><td><code>streamerCurrentGrade</code> 🆕</td><td><code>GRADE_3</code></td></tr></tbody></table></div>\n<h3 id=\"d-3-응답이-비어-항목-구조-미확인인-manage-get--11건\">D-3. 응답이 비어 항목 구조 미확인인 Manage GET — 11건<a class=\"anchor\" href=\"#/_work/step1-triage@d-3-응답이-비어-항목-구조-미확인인-manage-get--11건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>clips</code> · <code>clips/make-clips</code> · <code>followers</code> · <code>news-feeds</code> · <code>party/summary</code> · <code>restrict-release-requests</code> · <code>restrict-users</code> · <code>stats/lives</code> · <code>stats/videos</code> · <code>subscribers</code> · <code>videos</code></p>\n<blockquote><p>경로·인증은 확정. <strong>응답 스키마만 미상</strong>이므로 &quot;경로 확정 / 스키마 &quot;로 표기하고 남깁니다.</p></blockquote>\n<h3 id=\"d-4-신규-경미\">D-4. 신규 (경미)<a class=\"anchor\" href=\"#/_work/step1-triage@d-4-신규-경미\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<ul><li>댓글 응답 최상위에 <code>totalCount</code>와 <code>commentCount</code>가 <strong>병존</strong>하는 이유 미확인</li><li><code>concurrentUserCount</code>가 <code>live-status</code>(1926)와 <code>live-detail</code>(4866)에서 크게 다름 — 캡처 시점 차이 추정이나 <strong>애널리틱스에서는 한쪽으로 통일 필요</strong></li></ul>\n<hr>\n<h2 id=\"e-step-2에-미치는-영향\">E. STEP 2에 미치는 영향<a class=\"anchor\" href=\"#/_work/step1-triage@e-step-2에-미치는-영향\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>변경</th><th>내용</th></tr></thead><tbody><tr><td>🆕 모듈 추가</td><td><strong><code>modules/notification.md</code></strong> — <code>personal/session-url</code> + <code>alerts/{id}/session-url</code> + 이벤트 세션 9종. §12에서 분리</td></tr><tr><td>🆕 모듈 추가</td><td><strong><code>modules/stats.md</code></strong> — <code>manage/v1/.../stats/*</code>. manage에 섞기엔 가치가 커서 독립</td></tr><tr><td>대폭 확장</td><td><code>modules/manage.md</code> — 20 → 47경로</td></tr><tr><td>전면 재작성</td><td><code>reference/analytics.md</code> — <strong>본인 채널(stats API) / 타 채널(폴링)</strong> 2트랙</td></tr><tr><td>대폭 축소</td><td><code>modules/chat.md</code> — §12.1·12.2 삭제, ver 3으로 교체, <strong>수신 전용</strong></td></tr><tr><td>🆕 대폭 축소</td><td><code>modules/manage.md</code> — 쓰기 계열 제거로 <strong>읽기 전용 스튜디오 조회</strong> 모듈이 됨</td></tr><tr><td>🆕 삭제</td><td><code>watch-event</code> 절 (§7 하위) 통째로 제거</td></tr><tr><td>🆕 README</td><td>상단에 <strong>&quot;이 문서는 GET 전용&quot;</strong> 명시 — 범위를 먼저 못 박아야 읽는 사람이 헷갈리지 않음</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"f-step-3-진행에-필요한-것\">F. STEP 3 진행에 필요한 것<a class=\"anchor\" href=\"#/_work/step1-triage@f-step-3-진행에-필요한-것\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>문서를 쓰려면 아래가 필요합니다. 없으면 해당 부분만 &quot;경로 확정 / 스키마 미상&quot;으로 남깁니다.</p>\n<ul><li>[ ] <strong>Manage 실측 47개 GET 경로 전체 목록</strong> — 현재 이름을 확인한 것은 25개뿐입니다</li><li>[ ] <code>summaryVideoStat</code> 외 <code>stats/*</code> 응답 전문 (빈 배열이어도 봉투 구조 필요)</li><li>[ ] <code>manage/v2/channels/{id}/center-status</code> 응답 예시</li><li>[ ] <code>streaming-info</code> 응답에서 <strong><code>streamKey</code>·<code>streamUrl</code> 제거한</strong> 나머지 필드 구조</li></ul>", "toc": [{"level": 2, "id": "0-전역-규칙--get-only", "text": "0. 전역 규칙 — GET only"}, {"level": 3, "id": "조회용-post-예외--1건-사용자-판단으로-유지", "text": "조회용 POST 예외 — 1건 (사용자 판단으로 유지)"}, {"level": 2, "id": "01-갱신-요약", "text": "0.1 갱신 요약"}, {"level": 2, "id": "문서에-반드시-반영할-보안-항목", "text": "문서에 반드시 반영할 보안 항목"}, {"level": 2, "id": "a-중복--정본-1곳-지정-나머지는-링크로-대체", "text": "A. 중복 — 정본 1곳 지정, 나머지는 링크로 대체"}, {"level": 3, "id": "a-1-절이-달라서-흩어진-중복-12건", "text": "A-1. 절이 달라서 흩어진 중복 (12건)"}, {"level": 3, "id": "a-2-중복-아님--유지-표--바로-아래-상세-패턴", "text": "A-2. 중복 아님 — 유지 (표 + 바로 아래 상세 패턴)"}, {"level": 3, "id": "a-3-중복-아님--동명이경-구분-명시-필요-2건--5건", "text": "A-3. 중복 아님 — 동명이경, 구분 명시 필요 (2건 → 5건)"}, {"level": 3, "id": "a-4-이름--기능-4--함정-인덱스-readme로-승격", "text": "A-4. 이름 ≠ 기능 (§4) — 함정 인덱스, README로 승격"}, {"level": 2, "id": "b-버림--24건", "text": "B. 버림 — 24건"}, {"level": 3, "id": "b-0--get-only-규칙-위반--13건", "text": "B-0. 🆕 GET only 규칙 위반 — 13건"}, {"level": 3, "id": "b-1-구버전불필요-기존-4건-유지", "text": "B-1. 구버전·불필요 (기존 4건, 유지)"}, {"level": 3, "id": "b-2--사실-오류-서술--전면-삭제재작성-7건", "text": "B-2. 🆕 사실 오류 서술 — 전면 삭제·재작성 (7건)"}, {"level": 3, "id": "b-3--마커-제거-보류-4건-전건-해결", "text": "B-3. 🆕 마커 제거 (보류 4건 전건 해결)"}, {"level": 2, "id": "c-남김--6건", "text": "C. 남김 — 6건"}, {"level": 3, "id": "c-1-채팅--1건----판정-변경", "text": "C-1. 채팅 — 1건 · 💀 → 판정 변경"}, {"level": 3, "id": "c-2-manage-쓰기-계열--9건--b-0으로-이동-get-only", "text": "C-2. Manage 쓰기 계열 — 9건 → §B-0으로 이동 (GET only)"}, {"level": 3, "id": "c-3-get-미포착--2건", "text": "C-3. GET 미포착 — 2건"}, {"level": 3, "id": "c-4--신규-미해결--2건", "text": "C-4. 🆕 신규 미해결 — 2건"}, {"level": 3, "id": "c-5-조사-대상-아님--1건-4건--1건", "text": "C-5. 조사 대상 아님 — 1건 (4건 → 1건)"}, {"level": 2, "id": "d--신규-반영-대상", "text": "D. 🆕 신규 반영 대상"}, {"level": 3, "id": "d-1-manage-경로-정정--문서-기재가-실제와-다름", "text": "D-1. Manage 경로 정정 — 문서 기재가 실제와 다름"}, {"level": 3, "id": "d-2-enum-추가-14", "text": "D-2. Enum 추가 (§14)"}, {"level": 3, "id": "d-3-응답이-비어-항목-구조-미확인인-manage-get--11건", "text": "D-3. 응답이 비어 항목 구조 미확인인 Manage GET — 11건"}, {"level": 3, "id": "d-4-신규-경미", "text": "D-4. 신규 (경미)"}, {"level": 2, "id": "e-step-2에-미치는-영향", "text": "E. STEP 2에 미치는 영향"}, {"level": 2, "id": "f-step-3-진행에-필요한-것", "text": "F. STEP 3 진행에 필요한 것"}]}, "_work/step2-modules": {"title": "STEP 2 — 모듈 경계 설계", "html": "<h1 id=\"step-2--모듈-경계-설계\">STEP 2 — 모듈 경계 설계<a class=\"anchor\" href=\"#/_work/step2-modules@step-2--모듈-경계-설계\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>전제: STEP 1(<a href=\"#/_work/step1-triage\" data-nav>step1-triage.md</a>) 분류 결과 반영 대상: <del>116건 (이름 확인 94 + Manage 미확보 22)</del> → <strong>115건</strong> (이름 확인 95 + Manage 미확보 20) 규칙: <strong>읽기 전용</strong> — 서버 상태를 바꾸는 요청은 문서에 싣지 않음</p>\n<blockquote><p><strong>집계 정정 (STEP 3):</strong> 설계 시점의 116건은 Manage 배분을 잘못 센 값이었습니다. 모듈별 실측: manage.md 23 + stats.md 3 + notification.md 1 = <strong>47</strong> (사용자 제공 실측치와 일치). 따라서 manage.md는 44가 아니라 <strong>43</strong>(이름 확인 23 / 미확보 20), 총계는 <strong>115건</strong>입니다.</p></blockquote>\n<hr>\n<h2 id=\"1-파일-트리\">1. 파일 트리<a class=\"anchor\" href=\"#/_work/step2-modules@1-파일-트리\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<blockquote><p><strong>STEP 3 실행 시 변경 3가지</strong></p>\n<ol><li>원본 <code>CHZZK_UNOFFICIAL_API.md</code>는 인덱스로 축소했다가 <strong>삭제</strong>했습니다. 고유 내용이 구 절 번호 매핑표뿐이라 이전이 끝난 뒤엔 쓸모가 없었습니다.</li><li><strong><code>CLAUDE.md</code>를 루트에 추가</strong>했습니다. Claude Code가 자동 로드하는 진입점이 필요했습니다.</li><li><strong><code>reference/endpoints.md</code>를 추가</strong>했습니다. 12개 모듈을 뒤지지 않고 경로를 찾을 평면 인덱스가 없었습니다.</li></ol></blockquote>\n<div class=\"code\"><pre><code>D:\\test\\\n├─ CLAUDE.md                      에이전트 진입점 · 금지 값 · 통념 정정표   🆕\n└─ docs\\\n   ├─ README.md                  인덱스 · 모듈 맵 · 이름 함정 · 빠른 시작\n   ├─ core\\\n   │   ├─ base-urls.md           호스트 7종\n   │   ├─ headers.md             필수 헤더 · deviceId · CORS\n   │   ├─ conventions.md         응답 봉투 3형 · 페이지네이션 3종 · 문자열 JSON · 식별자\n   │   └─ auth.md                쿠키 · 권한 3단계\n   ├─ modules\\\n   │   ├─ channel.md       (15)  채널 조회 · data?fields · my-info · 팔로잉\n   │   ├─ live.md           (5)  라이브 상세/상태 · 폴링\n   │   ├─ video.md          (3)  VOD 상세 · 다시보기 채팅 · 재생 매니페스트\n   │   ├─ clip.md           (6)  클립 목록/상세/벌크 · 원본 영상 매핑\n   │   ├─ comment.md        (4)  댓글 · 대댓글 · 스티커\n   │   ├─ chat.md           (3)  실시간 채팅 (수신 전용)\n   │   ├─ notification.md   (4)  개인 알림 소켓 · 이벤트 세션 9종      🆕\n   │   ├─ discovery.md     (11)  홈 · 카테고리 · 배너 · 검색\n   │   ├─ commerce.md      (12)  후원 · 미션 · 상점 · 광고 · 유료상품\n   │   ├─ user.md           (6)  사용자 상태 · 차단 · 배지 · 닉네임\n   │   ├─ manage.md        (43)  스튜디오 조회 (읽기 전용)             \n   │   └─ stats.md          (3)  채널 통계                          🆕\n   ├─ reference\\\n   │   ├─ endpoints.md    (115)  전체 평면 인덱스 — 검색용             🆕\n   │   ├─ enums.md               Enum 전량\n   │   ├─ deprecated.md          버림 23건 + 사실 오류 정정 이력\n   │   └─ analytics.md           본인 채널 / 타 채널 2트랙 레시피\n   └─ _work\\\n       ├─ step1-triage.md        중복·제외 분류 근거\n       └─ step2-modules.md       이 문서</code></pre></div>\n<p><strong>총 22개 파일</strong> (CLAUDE.md 1 + README 1 + core 4 + modules 12 + reference 4) ※ <code>_work/</code> 2개는 작업 노트라 집계에서 제외. 원본 인덱스는 삭제됨.</p>\n<hr>\n<h2 id=\"2-엔드포인트--모듈-배치표\">2. 엔드포인트 → 모듈 배치표<a class=\"anchor\" href=\"#/_work/step2-modules@2-엔드포인트--모듈-배치표\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"core--엔드포인트-없음-규약만\"><code>core/</code> — 엔드포인트 없음 (규약만)<a class=\"anchor\" href=\"#/_work/step2-modules@core--엔드포인트-없음-규약만\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<h3 id=\"moduleschannelmd--15\"><code>modules/channel.md</code> — 15<a class=\"anchor\" href=\"#/_work/step2-modules@moduleschannelmd--15\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>인증</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}</code></td><td></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/data?fields=</code> <strong>정본</strong></td><td></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1.1/channels/{channelId}/my-info</code></td><td></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/videos</code> <strong>정본</strong></td><td></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/chat-rules</code></td><td></td></tr><tr><td><code><span c /search/lounges</code> · <code>v2/search/lounges/auto-complete</code> · <code>v1/lounge/loungeEvent/chzzk</code></p>\n<h3 id=\"modulescommercemd--12\"><code>modules/commerce.md</code> — 12<a class=\"anchor\" href=\"#/_work/step2-modules@modulescommercemd--12\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>donations/chat-setting</code> · <code>donations/video-setting</code> · <code>donations/mission-setting</code> · <code>v2/.../donations/missions</code> · <code>commercial/v1/streamer-shop/{id}/products</code> · <code>streamer-shop/{id}/notifiable</code> · <code>commercial/v1/channels/{id}/donation-campaigns</code> · <code>cheat-key/status</code> · <code>cheat-key/promotion-status</code> · <code>offerwall/total-reward</code> · <code>service/v1/paid-product/init</code> · <code>service/v1/ad/display-status</code></p>\n<h3 id=\"modulesusermd--6\"><code>modules/user.md</code> — 6<a class=\"anchor\" href=\"#/_work/step2-modules@modulesusermd--6\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code><span class=\"method m-get\">GET</span> /v1/user/getUserStatus</code> · <code><span class=\"method m-get\">GET</span> /v1/privateUserBlocks/allUserIdHash</code> · <code><span class=\"method m-get\">GET</span> /service/v1/personal/personal-data?fields=</code> · <code><span class=\"method m-get\">GET</span> /service/v2/nickname/color/codes</code> · <code><span class=\"method m-get\">GET</span> /service/v1/badge-awards/unread</code> · <code><span class=\"method m-get\">GET</span> /service/v1/badges/assets/last-updated?badgeType=</code></p>\n<h3 id=\"modulesmanagemd--44-실측-47--stats-3\"><code>modules/manage.md</code> — 44 (실측 47 − stats 3)<a class=\"anchor\" href=\"#/_work/step2-modules@modulesmanagemd--44-실측-47--stats-3\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><strong>이름 확인 22 / 미확보 22</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>확인된 경로</th><th>상태</th></tr></thead><tbody><tr><td><code>/channels/{id}/streaming-info</code></td><td><code>streamKey</code>·<code>streamUrl</code> 포함</td></tr><tr><td><code>/channels/{id}/streams</code></td><td>실사용은 <code>streaming-info</code></td></tr><tr><td><code>/channels/{id}/live-setting/normal</code> <code>/chat</code> <code>/chat-mode</code> <code>/chat-condition</code></td><td>(4)</td></tr><tr><td><code>/channels/{id}/my-role</code> · <code>/my-status</code></td><td>(2)</td></tr><tr><td><code>/channels/{id}/chat-rules</code></td><td></td></tr><tr><td><code>/channels/{id}/chats/prohibit-words</code></td><td></td></tr><tr><td><code>/channels/{id}/restrict-users</code> · <code>/restrict-release-requests</code></td><td>경로 / 스키마 빈 응답</td></tr><tr><td><code>/channels/{id}/streaming-roles</code></td><td></td></tr><tr><td><code>/channels/{id}/followers</code> · <code>/subscribers</code> · <code>/videos</code> · <code>/clips</code> · <code>/clips/make-clips</code> · <code>/news-feeds</code> · <code>/party/summary</code></td><td>경로 / 스키마 빈 응답</td></tr><tr><td><code>/auto-complete/categories?keyword=</code></td><td>미포착</td></tr><tr><td><code>/channels/{id}/users/{targetId}/chat-activity-count</code></td><td>미포착</td></tr><tr><td><code>manage/v2/channels/{id}/center-status</code></td><td><strong>v2</strong></td></tr></tbody></table></div>\n<blockquote><p>미확보 22개는 <strong><code>## 미수록 경로</code> 절</strong>을 만들어 자리를 비워둡니다. 목록 받는 즉시 채웁니다.</p></blockquote>\n<h3 id=\"modulesstatsmd---3\"><code>modules/stats.md</code> 🆕 — 3<a class=\"anchor\" href=\"#/_work/step2-modules@modulesstatsmd---3\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>상태</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/stats/lives?from=&amp;to=</code></td><td>경로 / <code>liveStatList[]</code> 빈 배열</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/stats/videos?from=&amp;to=</code></td><td>경로 / <code>summaryVideoStat</code> 확보</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/stats/recent-live</code></td><td>경로 / <code>null</code></td></tr></tbody></table></div>\n<p><code>manage.md</code>에서 분리하는 이유: <strong>§15의 핵심 결론을 뒤집은 엔드포인트</strong>라 44개 목록에 묻히면 안 됨.</p>\n<hr>\n<h2 id=\"3-모듈-문서-템플릿\">3. 모듈 문서 템플릿<a class=\"anchor\" href=\"#/_work/step2-modules@3-모듈-문서-템플릿\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>모든 <code>modules/*.md</code>가 동일한 뼈대를 따릅니다.</p>\n<div class=\"code\"><span class=\"code-lang\">markdown</span><pre><code class=\"lang-markdown\"># {모듈명}\n\n&gt; 한 줄 요약\n\n**Base:** `{host}` · **인증:** {불필요 | 쿠키 | 채널 권한}\n**관련:** [channel](../modules/channel.md) · [live](../modules/live.md)\n\n## 엔드포인트 요약\n\n| 상태 | Method | 경로 | 설명 |\n|---|---|---|---|\n\n## {엔드포인트명}\n\n​```\nGET /path/{param}?query=\n​```\n\n**요청 파라미터**\n| 이름 | 필수 | 값 | 설명 |\n\n**응답 주요 필드**\n| 필드 | 타입 | 설명 |\n\n**주의** — 함정이 있을 때만\n\n&lt;details&gt;&lt;summary&gt;Response 예시&lt;/summary&gt;\n​```json\n​```\n&lt;/details&gt;\n\n## 미수록 / 미검증</code></pre></div>\n<p><strong>규칙</strong></p>\n<ul><li>요약표 → 상세 순서 고정 (기존 문서의 좋은 패턴 유지)</li><li>응답 예시는 <strong>항상 <code>&lt;details&gt;</code> 안에</strong> — 스크롤 지옥 방지</li><li>값이 확인된 필드만 표에, 추정은 달아 별도 행</li></ul>\n<hr>\n<h2 id=\"4-상태-마커-규약\">4. 상태 마커 규약<a class=\"anchor\" href=\"#/_work/step2-modules@4-상태-마커-규약\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>기존 3종()이 &quot;경로 확인&quot;과 &quot;스키마 확인&quot;을 구분 못 해서 혼선이 있었습니다. 5종으로 분리합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>마커</th><th>의미</th></tr></thead><tbody><tr><td>실측</td><td>경로 + 파라미터 + 응답 전부 실측</td></tr><tr><td>스키마 미상</td><td><strong>경로·인증 확정 / 응답 스키마 미상</strong> (빈 배열·null로 관측)</td></tr><tr><td>경로만 확인</td><td>경로만 확인, 파라미터 미검증</td></tr><tr><td>추정</td><td>추정</td></tr><tr><td>조회용 POST</td><td>조회용 POST 예외 (<code>clips/detail-bulk</code> 전용)</td></tr></tbody></table></div>\n<p>부가 배지: 인증 필요 · 민감정보 포함 · 애널리틱스 핵심</p>\n<blockquote><p>가 새로 필요한 이유: Manage 11건이 &quot;경로는 확실한데 채널에 데이터가 없어 응답이 비었다&quot; 상태입니다. 도 도 정확하지 않습니다.</p></blockquote>\n<hr>\n<h2 id=\"5-링크-규약\">5. 링크 규약<a class=\"anchor\" href=\"#/_work/step2-modules@5-링크-규약\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>대상</th><th>표기</th></tr></thead><tbody><tr><td>모듈 간</td><td><code>[live-status](../modules/live.md#라이브-상태-조회)</code> — 상대경로</td></tr><tr><td>중복 정본</td><td>요약표 행에 <code>→ [clip.md](../modules/clip.md#채널-클립-목록-조회)</code> 만 두고 본문 서술 없음</td></tr><tr><td>core 참조</td><td><code>[응답 봉투](../core/conventions.md#응답-봉투)</code></td></tr></tbody></table></div>\n<p><strong>기존 <code>§6.4</code> 같은 번호 참조는 전량 제거합니다.</strong> 절 번호가 바뀌면 즉시 깨지는 참조라 이번 재편의 주요 정리 대상입니다.</p>\n<blockquote><p><strong>STEP 3에서 추가된 규칙:</strong> 제목 맨 앞에 이모지를 두지 않습니다. <code>## streaming-info</code>의 앵커가 <code>#-streaming-info</code>가 되어 링크가 깨졌습니다 (5건 발생). 이모지는 제목 뒤에 붙이거나 본문으로 내립니다. 렌더러마다 처리가 달라 앞에 두면 불안정합니다.</p></blockquote>\n<hr>\n<h2 id=\"6-readmemd-구성\">6. README.md 구성<a class=\"anchor\" href=\"#/_work/step2-modules@6-readmemd-구성\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<ol><li><strong>이 문서는 읽기 전용 API만 다룹니다</strong> — 범위를 최상단에 못 박음</li><li>보안 — <code>streamKey</code>/<code>streamUrl</code>/<code>accTkn</code>/<code>liveTokenList</code> 노출 금지 + <strong>크롬 sanitized HAR은 응답 본문을 안 지움</strong></li><li><strong>이름 함정 표</strong> (구 §4 + <code>personal/session-url</code> 추가) ← 제일 먼저 읽어야 할 것</li><li>모듈 맵 (12개 링크 + 한 줄 설명 + 엔드포인트 수)</li><li>빠른 시작 (헤더 → 채널 조회 → 라이브 상태)</li><li>목적별 진입점: &quot;시청자 수 추적하려면&quot; / &quot;채팅 로그 받으려면&quot; / &quot;내 채널 통계 보려면&quot;</li></ol>\n<blockquote><p>4번 모듈 맵에 <strong><code>personal/session-url</code> 사례</strong>를 각주로 남깁니다. &quot;기타&quot; 표에 묻혀 있던 한 줄이 다른 절의 미해결 과제였던 건이라, 모듈화의 근거로 실물이 있는 편이 낫습니다.</p></blockquote>\n<hr>\n<h2 id=\"7-reference-구성\">7. reference/ 구성<a class=\"anchor\" href=\"#/_work/step2-modules@7-reference-구성\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>파일</th><th>내용</th></tr></thead><tbody><tr><td><code>endpoints.md</code> 🆕</td><td><strong>115건 평면 인덱스.</strong> 호스트·접두사별 표 + 모듈 링크. 경로 검색 전용</td></tr><tr><td><code>enums.md</code></td><td>기존 전량 + 신규 7종(<code>ASC</code> <code>REPLY</code> <code>STREAMER</code> <code>permissions</code> 8값 <code>dateFilter</code> <code>orderFilter</code> <code>sortType</code> <code>streamerCurrentGrade</code>)</td></tr><tr><td><code>deprecated.md</code></td><td>버림 23건. <strong>왜 버렸는지</strong>와 대체재를 표로. 사실 오류 7건은 &quot;이렇게 알려져 있었으나 실제는 —&quot; 형식</td></tr><tr><td><code>analytics.md</code></td><td><strong>2트랙 재작성</strong> — ① 본인 채널: <code>stats/*</code> ② 타 채널: 공개 지표 + 폴링. 구 §15의 &quot;시계열 없음&quot; 결론 정정 명시</td></tr></tbody></table></div>\n<blockquote><p><code>endpoints.md</code>는 설계 시점에 없었습니다. 모듈화로 개별 문서는 짧아졌지만 <strong>&quot;이런 엔드포인트가 있나?&quot;에 답하려면 12개 파일을 뒤져야 하는</strong> 역효과가 생겨서 STEP 3에서 추가했습니다.</p></blockquote>\n<hr>\n<h2 id=\"8-결정-사항-요약\">8. 결정 사항 요약<a class=\"anchor\" href=\"#/_work/step2-modules@8-결정-사항-요약\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>결정</th><th>근거</th></tr></thead><tbody><tr><td>1</td><td>12개 기능 모듈 + core 4 + reference 4</td><td>모듈당 3~15건, 최대 manage 43</td></tr><tr><td>2</td><td><code>notification.md</code> 신설</td><td><code>ssio{N}</code>이 채팅이 아님이 밝혀져 §12에서 분리</td></tr><tr><td>3</td><td><code>stats.md</code> 독립</td><td>manage 43개에 묻히면 안 되는 항목</td></tr><tr><td>4</td><td><code>donation</code> → <code>commerce</code>로 확장</td><td>후원·상점·광고·유료상품이 전부 상업 기능</td></tr><tr><td>5</td><td>상태 마커 3종 → 5종</td><td>&quot;경로 확정 / 스키마 미상&quot;을 표현할 수단이 없었음</td></tr><tr><td>6</td><td>절 번호 참조 전량 → 상대경로 링크</td><td>재편마다 깨지는 참조 제거</td></tr><tr><td><del>7</del></td><td><del>원본 파일은 인덱스로 축소</del> → <strong>삭제</strong></td><td>매핑표 외 고유 내용이 없었음. 이전 완료 후 가치 소멸</td></tr><tr><td>8 🆕</td><td><code>CLAUDE.md</code> 루트 추가</td><td><code>docs/</code>는 자동 로드되지 않음. 에이전트 진입점 + 통념 정정표 필요</td></tr><tr><td>9 🆕</td><td><code>endpoints.md</code> 추가</td><td>모듈화의 역효과(경로 검색 비용) 상쇄</td></tr><tr><td>10 🆕</td><td>제목 앞 이모지 금지</td><td>앵커가 <code>#-제목</code>이 되어 링크 5건 깨짐</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"9-step-3-결과\">9. STEP 3 결과<a class=\"anchor\" href=\"#/_work/step2-modules@9-step-3-결과\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><strong>완료.</strong> 22개 파일 생성, 내부 링크 346개 전량 검증 통과 (깨진 파일 0 · 앵커 0).</p>\n<h3 id=\"미해결로-남긴-것\">미해결로 남긴 것<a class=\"anchor\" href=\"#/_work/step2-modules@미해결로-남긴-것\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>설계 시점에 &quot;없으면 로 표기하고 자리만 만들어둔다&quot;고 한 항목들입니다. 그대로 적용됐습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>항목</th><th>현재 상태</th></tr></thead><tbody><tr><td>Manage 실측 47개 전체 목록</td><td><strong>20개 미확보</strong> → <code>manage.md</code>의 <code>## 미수록 경로</code> 절에 표 형식 주석으로 자리 확보</td></tr><tr><td><code>stats/*</code> 응답 전문</td><td>— <code>summaryVideoStat</code> 필드만 확보, 배열 항목 구조 미상</td></tr><tr><td><code>manage/v2/.../center-status</code> 응답</td><td>경로만, 응답 예시 없음</td></tr><tr><td><code>streaming-info</code> 나머지 필드</td><td>— 키 2개 외 구조 미확보</td></tr></tbody></table></div>\n<p>해결 방법은 저장소의 <code>CLAUDE.md</code> 「미해결」 절에 정리했습니다.</p>", "toc": [{"level": 2, "id": "1-파일-트리", "text": "1. 파일 트리"}, {"level": 2, "id": "2-엔드포인트--모듈-배치표", "text": "2. 엔드포인트 → 모듈 배치표"}, {"level": 3, "id": "core--엔드포인트-없음-규약만", "text": "core/ — 엔드포인트 없음 (규약만)"}, {"level": 3, "id": "moduleschannelmd--15", "text": "modules/channel.md — 15"}, {"level": 3, "id": "moduleslivemd--5", "text": "modules/live.md — 5"}, {"level": 3, "id": "modulesvideomd--3", "text": "modules/video.md — 3"}, {"level": 3, "id": "modulesclipmd--6", "text": "modules/clip.md — 6"}, {"level": 3, "id": "modulescommentmd--4", "text": "modules/comment.md — 4"}, {"level": 3, "id": "moduleschatmd--3--수신-전용", "text": "modules/chat.md — 3 · 수신 전용"}, {"level": 3, "id": "modulesnotificationmd---4", "text": "modules/notification.md 🆕 — 4"}, {"level": 3, "id": "modulesdiscoverymd--11", "text": "modules/discovery.md — 11"}, {"level": 3, "id": "modulescommercemd--12", "text": "modules/commerce.md — 12"}, {"level": 3, "id": "modulesusermd--6", "text": "modules/user.md — 6"}, {"level": 3, "id": "modulesmanagemd--44-실측-47--stats-3", "text": "modules/manage.md — 44 (실측 47 − stats 3)"}, {"level": 3, "id": "modulesstatsmd---3", "text": "modules/stats.md 🆕 — 3"}, {"level": 2, "id": "3-모듈-문서-템플릿", "text": "3. 모듈 문서 템플릿"}, {"level": 2, "id": "4-상태-마커-규약", "text": "4. 상태 마커 규약"}, {"level": 2, "id": "5-링크-규약", "text": "5. 링크 규약"}, {"level": 2, "id": "6-readmemd-구성", "text": "6. README.md 구성"}, {"level": 2, "id": "7-reference-구성", "text": "7. reference/ 구성"}, {"level": 2, "id": "8-결정-사항-요약", "text": "8. 결정 사항 요약"}, {"level": 2, "id": "9-step-3-결과", "text": "9. STEP 3 결과"}, {"level": 3, "id": "미해결로-남긴-것", "text": "미해결로 남긴 것"}]}}, INDEX=[{"p": "README", "t": "치지직(CHZZK) 비공식 API 문서", "h": ["빠른 시작", "오류 처리", "요청 제한", "민감 정보", "이름과 기능이 다른 엔드포인트", "문서 구성", "목적별 진입점", "상태 표기", "주의 사항", "참고", "문서에 기여하기"], "b": " 치지직(CHZZK) 비공식 API 문서 # 네이버 치지직 웹 프론트엔드가 사용하는 내부 API를 캡처하여 정리한 비공식 문서입니다. 공식 문서가 아니며, 네이버는 이 API들의 하위 호환성을 보장하지 않습니다. 상업적 서비스를 개발하는 경우 치지직 개발자센터 의 공식 API를 사용합니다. 수록 엔드포인트 115건. 이름 확인 95건 + 미확보 20건 ( 전체 목록 ) 캡처 기준일 2026-07-25 (클립·웹) · 2026-07-29 (스튜디오·댓글) 범위 읽기 전용. GET , WebSocket 수신, 조회용 POST 1건 인증 공개 조회는 불필요. 일부 API만 쿠키 필요 ( 인증 참조 ) 응답 봉투 3형이 혼재하며 성공 조건이 다릅니다 ( 응답 봉투 참조 ) 서버 상태를 변경하는 요청( POST , PUT , DELETE )은 수록하지 않았습니다. 방송 설정 변경, 제재 관리, 금지어 편집, 시청 이벤트 전송 등이 해당합니다. 제외 목록과 사유는 제외된 API 에 있습니다. 빠른 시작 # 인증 없이 호출할 수 있습니다. 다만 커스텀 헤더가 없으면 상당수의 API가 실패합니다. ( 필수 헤더 참조 ) python import requests BASE = &quot;https://api.chzzk.naver.com&quot; HEADERS = { &quot;Accept&quot;: &quot;application/json&quot;, &quot;User-Agent&quot;: &quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36&quot;, &quot;Origin&quot;: &quot;https://chzzk.naver.com&quot;, &quot;Referer&quot;: &quot;https://chzzk.naver.com/&quot;, &quot;front-client-platform-type&quot;: &quot;PC&quot;, &quot;front-client-product-type&quot;: &quot;web&quot;, &quot;deviceId&quot;: &quot;00000000-0000-4000-8000-000000000000&quot;, # UUID v4 하나를 고정해 사용 } cid = &quot;&lt;32자 channelId&gt;&quot; # 채널 기본 정보 ch = requests.get(f&quot;{BASE}/service/v1/channels/{cid}&quot;, headers=HEADERS).json() print(ch[&quot;content&quot;][&quot;channelName&quot;], ch[&quot;content&quot;][&quot;followerCount&quot;]) # 라이브 상태 st = requests.get( f&quot;{BASE}/polling/v3.1/channels/{cid}/live-status&quot;, params={&quot;includePlayerRecommendContent&quot;: &quot;false&quot;}, headers=HEADERS, ).json() print(st[&quot;content&quot;][&quot;status&quot;], st[&quot;content&quot;][&quot;concurrentUserCount&quot;]) 오류 처리 # HTTP 상태 코드가 200이어도 실패일 수 있습니다. 응답 봉투 안의 코드로 판정합니다. 호스트마다 봉투 형태와 성공 조건이 다릅니다. 봉투 호스트 성공 조건 실패 시 A형 api.chzzk.naver.com · comm-api · nng_comment_api code == 200 message 에 사유 B형 creatorhub-api.naver.com header.code == 0 header.message 에 사유 XML apis.naver.com/neonplayer 봉투 없음 (DASH MPD) — python def unwrap(resp): j = resp.json() if &quot;content&quot; in j: # A형 if j.get(&quot;code&quot;) != 200: raise RuntimeError(f&#x27;code={j.get(&quot;code&quot;)} {j.get(&quot;message&quot;)}&#x27;) return j[&quot;content&quot;] if &quot;body&quot; in j: # B형 if j.get(&quot;header&quot;, {}).get(&quot;code&quot;) != 0: raise RuntimeError(j[&quot;header&quot;].get(&quot;message&quot;)) return j[&quot;body&quot;] raise RuntimeError(&quot;unknown envelope&quot;) 봉투가 성공을 반환하면서 내용이 비어 있는 경우가 있습니다. 상황 판정 방법 존재하지 않는 채널 code: 200 이면서 channelId 가 null ( 참조 ) 데이터가 없는 스튜디오 통계 빈 배열 또는 null ( 참조 ) 쿠키 만료 HTTP 401이 아니라 loggedIn: false ( 참조 ) 전체 규약은 응답 봉투 에 있습니다. 요청 제한 # 공식적으로 문서화된 rate limit은 없습니다. 아래는 관측값과 안전 마진을 기준으로 한 권장 사항입니다. 상황 권장 방송 중 라이브 폴링 응답의 livePollingStatusJson.callPeriodMilliSecond 를 따름. 관측값 10000ms 대량 수집 (클립·VOD·채팅) 요청 사이에 간격을 둠. 배치 작업이라도 몰아서 호출하면 IP 차단 위험 재시도 429 와 5xx 에만 지수 백오프. 나머지 4xx 는 재시도해도 결과가 같음 권장 주기보다 자주 호출하면 IP 차단이나 계정 보호조치로 이어질 수 있습니다. 클립 뷰어 카드 조회 는 벌크 조회가 없어 클립 한 개당 한 번씩 호출해야 하므로 특히 주의가 필요합니다. 민감 정보 # 아래 값은 공유하거나 저장소에 커밋해서는 안 됩니다. 값 출처 위험 streamKey · streamUrl 스트리밍 정보 조회 제3자가 해당 채널로 송출 가능 accTkn 액세스 토큰 발급 채팅 계정 도용 liveTokenList 라이브  hex VOD 재생용 식별자 clipUID 10자 영숫자 클립 식별자 (예: L0gvjE67xM ) userIdHash 32자 hex 사용자 해시 sessionIOChannelId {type}@{...} 알림 이벤트 세션 식별자 헷갈리는 3쌍 # channelId 와 userIdHash 두 값 모두 32자 hex로 형식이 같습니다. 스트리머 본인은 두 값이 동일합니다. videoNo 와 videoId 식별자 사용처 videoNo (Int) VOD 상세, 다시보기 채팅, 댓글 videoId (36자) 재생 매니페스트, Creator Hub seedMediaId clipUID 와 클립의 videoId 클립도 두 식별자를 함께 가집니다. 댓글 조회는 clipUID 를, Creator Hub 카드 조회는 videoId 를 사용합니다. ( Clip 참조 · Comment 참조 ) 관련 문서 # Base URL · 필수 요청 헤더 · 인증 "}, {"p": "core/headers", "t": "필수 요청 헤더", "h": ["커스텀 헤더", "deviceId", "scene", "CORS 프리플라이트", "인증이 필요한 요청", "관련 문서"], "b": " 필수 요청 헤더 # 치지직 API는 웹 클라이언트가 붙이는 커스텀 헤더를 요구합니다. 이 헤더가 없으면 상당수의 엔드포인트가 실패합니다. 공개 라이브러리 문서에는 대부분 기재되어 있지 않은 부분입니다. 적용 범위 모든 HTTP 요청 필수 커스텀 헤더 front-client-platform-type · front-client-product-type · deviceId 관련 문서 Base URL · 공통 규칙 · 인증 http Accept: application/json User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ... Origin: https://chzzk.naver.com Referer: https://chzzk.naver.com/ front-client-platform-type: PC front-client-product-type: web deviceId: &lt;UUID v4. 클라이언트가 생성하여 재사용&gt; 커스텀 헤더 # Header required Value Description front-client-platform-type * PC . MOBILE 은 미확인 플랫폼 구분 front-client-product-type * web . app 은 미확인 제품 구분 deviceId * UUID v4 클라이언트가 생성하는 기기 식별자. 서버 발급이 아님 scene optional 숫자 (25, 51, 73 등) 화면 식별자. 통계용이며 생략해도 동작 deviceId # 서버가 발급하는 값이 아니라 클라이언트가 생성하는 값입니다. 웹 클라이언트는 UUID v4를 만들어 localStorage에 저장하고 계속 재사용합니다. python import uuid DEVICE_ID = str(uuid.uuid4()) # 한 번 생성하여 저장 후 재사용 요청마다 새로 생성하면 서버에서는 새 기기가 계속 접속하는 것으로 관측됩니다. 한 번 생성한 값을 고정하여 사용합니다. scene # 생략할 수 있습니다. 웹 클라이언트가 화면별 통계를 위해 붙이는 값이며 조회 결과에 영향을 주지 않습니다. CORS 프리플라이트 # 커스텀 헤더 때문에 브라우저에서 호출하면 본 요청 전에 OPTIONS 요청이 먼저 발생합니다. 서버 사이드에서 호출하는 경우 프리플라이트가 발생하지 않으므로 본 요청만 보내면 됩니다. 캡처한 HAR에 OPTIONS 가 다수 보이는 것은 이 때문이며, 실제 조회는 그 뒤의 GET 요청입니다. 인증이 필요한 요청 # 쿠키를 추가로 전달합니다. ( 인증 참조 ) http Cookie: NID_AUT=&lt;value&gt;; NID_SES=&lt;value&gt; 관련 문서 # Base URL · 공통 규칙 · 인증 "}, {"p": "modules/channel", "t": "Channel", "h": ["엔드포인트", "manage 와 겹치는 경로", "채널 기본 정보 조회", "채널 부가 데이터 조회", "내 정보 조회", "VOD 목록 조회", "팔로잉 목록 조회", "부가 엔드포인트", "관련 문서"], "b": " Channel # 채널 API로 채널 기본 정보, 채널 부가 데이터, 내 상태, 팔로잉 목록을 조회할 수 있습니다. 대부분 인증이 필요하지 않으며, my-info 와 followings 3건만 로그인이 필요합니다. 인증 없이 얻을 수 있는 채널 지표가 모여 있어 타 채널 분석의 출발점이 됩니다. Base URL https://api.chzzk.naver.com 응답 봉투 A형. code == 200 ( 참조 ) 관련 문서 Live · Video · Clip · Manage 엔드포인트 # 상태 HTTP Request Description 실측 GET /service/v1/channels/{channelId} 채널 기본 정보 조회 실측 GET /service/v1/channels/{channelId}/data 채널 부가 데이터 조회 실측 · 인증 필요 GET /service/v1.1/channels/{channelId}/my-info 내 정보 조회 실측 GET /service/v1/channels/{channelId}/videos VOD 목록 조회 실측 · 인증 필요 GET /service/v1/channels/followings 팔로잉 목록 조회 실측 · 인증 필요 GET /service/v1/channels/followings/live 팔로잉 목록 조회 실측 GET /service/v1/channels/{channelId}/chat-rules 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/announcements 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/live-schedule 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/live-recommended 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/follow 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/cafe-connection 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/achievement-badges 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/party-donation-info 부가 엔드포인트 실측 GET /service/v1/channels/{channelId}/log-power/prediction 부가 엔드포인트 클립 목록은 이 모듈이 아니라 클립 API에 있습니다. ( 채널 클립 목록 조회 ) manage 와 겹치는 경로 # 같은 이름의 경로가 공개 API와 스튜디오 API에 각각 존재하며 반환 범위가 다릅니다. 경로 이 모듈 Manage chat-rules GET /service/v1/channels/{id}/chat-rules GET /manage/v1/channels/{id}/chat-rules videos GET /service/v1/channels/{id}/videos . 공개분만 GET /manage/v1/channels/{id}/videos . 비공개 포함 clips GET /service/v1/channels/{id}/clips GET /manage/v1/channels/{id}/clips followers 없음. followerCount 숫자만 제공 GET /manage/v1/channels/{id}/followers . 목록 제공 채널 기본 정보 조회 # 채널의 기본 정보를 조회할 수 있습니다. HTTP Request Description GET /service/v1/channels/{channelId} 채널 기본 정보 조회 Request Param Field Type required Description channelId String * 조회할 채널 식별자 Response Body Field Type Description channelId String 채널 식별자 channelName String 채널 이름 channelImageUrl String 채널 이미지 URL channelDescription String 채널 소개 followerCount Int 채널의 팔로워 수 openLive Boolean 방송 중 여부 verifiedMark Boolean 채널 인증 마크 여부 activatedChannelBadgeIds String[] 활성화된 채널 배지 식별자 목록 오류 존재하지 않는 채널을 요청해도 code 는 200으로 반환됩니다. 내용만 비어서 옵니다. json { &quot;channelId&quot;: null, &quot;channelName&quot;: &quot;(알 수 없음)&quot;, &quot;followerCount&quot;: 0 } 봉투만으로는 실패를 구분할 수 없으므로 channelId 가 null 인지 확인해야 합니다. 팔로워 수의 추이는 이 API에서 제공하지 않습니다. 타 채널은 이 엔드포인트를 주기적으로 호출해 직접 축적해야 합니다. ( 트랙 B 참조 ) 본인 채널은 Stats 에서 조회할 수 있습니다. 채널 부가 데이터 조회 # 채널 개설일, 누적 방송시간, 소셜 링크 등의 부가 데이터를 조회할 수 있습니다. 인증 없이 누적 지표를 얻을 수 있는 몇 안 되는 API입니다. HTTP Request Description GET /service/v1/channels/{channelId}/data 채널 부가 데이터 조회 Request Param Field Type required Description channelId String * 조회할 채널 식별자 fields String * 조회할 항목. 콤마로 구분하며 요청한 항목만 반환 fields 에 사용할 수 있는 값입니다. 값 반환 내용 channelHistory 개설일( firstLiveDate )과 누적 방송시간( totalLiveHours ) description 채널 소개 socialLinks 소셜 링크 목록 topExposedVideos 상단 고정 영상 또는 진행 중인 라이브 banners 채널 배너 donationRankingsExposure 후원 랭킹 공개 여부 achievementBadgeExposure 업적 배지 공개 여부 logPowerActive 로그파워 사용 여부 logPowerRankingExposure 로그파워 랭킹 공개 여부 missionDonationChannelHomeExposure 미션 후원 홈 노출 여부 Response Body Field Type Description channelHistory Object 채널 이력 channelHistory.firstLiveDate String 첫 방송 일시. 채널 개설 시점 channelHistory.totalLiveHours Int 누적 방송시간. 단위는 시간 socialLinks Object[] 소셜 링크 목록 socialLinks.title String 링크 이름 socialLinks.landingUrl String 링크 URL activatedAchievementBadgeIds String[] 활성화된 업적 배지. 요청하지 않아도 항상 반환 응답 예시 — fields=channelHistory,socialLinks json { &quot;code&quot;: 200, &quot;content&quot;: { &quot;socialLinks&quot;: [ { &quot;title&quot;: &quot;X&quot;, &quot;landingUrl&quot;: &quot;https://x.com/...&quot; }, { &quot;title&quot;: &quot;YouTube&quot;, &quot;landingUrl&quot;: &quot;https://www.youtube.com/channel/...&quot; } ], &quot;c ot;, &quot;emojis&quot;: {} } extraToken 은 민감 정보입니다. 공유하지 않습니다. profile # json { &quot;userIdHash&quot;: &quot;&lt;hash&gt;&quot;, &quot;nickname&quot;: &quot;&lt;nick&gt;&quot;, &quot;profileImageUrl&quot;: &quot;&quot;, &quot;userRoleCode&quot;: &quot;common_user&quot;, &quot;badge&quot;: null, &quot;title&quot;: null, &quot;verifiedMark&quot;: false, &quot;activityBadges&quot;: [] } 시스템 메시지는 userIdHash 가 SYSTEM_MESSAGE 리터럴이고 profile 이 &quot;{}&quot; 로 옵니다. python import json profile = json.loads(msg[&quot;profile&quot;]) if msg[&quot;profile&quot;] != &quot;{}&quot; else None 프로필 조회 # 채팅 참여자의 프로필을 조회할 수 있습니다. 이 API를 호출하려면 로그인이 필요합니다. 경로가 profile-card 가 아니라 profile 이며 streamingChannelId 파라미터가 추가로 필요합니다. ( 정정된 사실 참조 ) HTTP Request Description GET https://comm-api.game.naver.com/nng_main/v1/chats/{chatChannelId}/users/{userIdHash}/profile 프로필 조회 Request Param Field Type required Description chatChannelId String * 채팅방 식별자 userIdHash String * 조회할 사용자 해시 chatType String * STREAMING streamingChannelId String * 채널 식별자. 누락하면 실패 개인정보 # 채팅 응답에는 다른 이용자의 닉네임과 userIdHash 가 포함됩니다. 수집·보관 시 개인정보 취급에 유의합니다. 관련 문서 # Live · Video · Notification · Enum 레퍼런스 · 엔드포인트 목록 "}, {"p": "modules/clip", "t": "Clip", "h": ["엔드포인트", "클립 객체", "채널 클립 목록 조회", "클립 상세 조회", "클립 벌크 조회", "업로드 가능 여부 조회", "클립 뷰어 카드 조회", "extraLinks", "원본 상태에 따른 링크 형태", "방송 진행 중일 때의 근사", "매니페스트의 시간값", "확인되지 않은 사항", "클립 뷰어 피드 조회", "관련 문서"], "b": " Clip # 클립 API로 채널의 클립 목록, 클립 상세 정보, 원본 영상 매핑 정보를 조회할 수 있습니다. 클립 API는 인증이 필요하지 않습니다. 클립 뷰어 API 2건은 CREATOR 호스트( https://creatorhub-api.naver.com )를 사용하며 응답 봉투가 다릅니다. ( 응답 봉투 참조 ) 엔드포인트 # 상태 HTTP Request Description 실측 GET /service/v1/channels/{channelId}/clips 채널 클립 목록 조회 실측 GET /service/v1/clips/{clipUID}/detail 클립 상세 조회 조회용 POST POST /service/v1/clips/detail-bulk 클립 벌크 조회 실측 GET /service/v1/clips/upload/enable 업로드 가능 여부 조회 실측 GET /api/v5.0/clipviewer/card 클립 뷰어 카드 조회 실측 GET /api/v5.0/clipviewer/cards 클립 뷰어 피드 조회 클립에 달린 댓글은 댓글 API로 조회합니다. objectType 은 CLIP , objectId 는 clipUID 입니다 ng 카테고리 표시명 categoryType String 카테고리 분류 (예: GAME ) tags String[] 방송 태그 openDate String 방송 시작 일시. YYYY-MM-DD HH:mm:ss closeDate String 방송 종료 일시. 방송 중이면 null chatChannelId String 채팅방 식별자 ( Chat 참조 ) chatActive Boolean 채팅 활성 여부 chatAvailableGroup String 채팅 참여 가능 그룹 chatDonationRankingExposure Boolean 후원 랭킹 노출 여부 livePollingStatusJson String 폴링 주기 정보. 문자열로 감싸진 JSON ( 참조 ) liveTokenList String[] 민감 정보. 외부에 공유하지 않습니다 adult Boolean 성인 제한 여부 userAdultStatus String 성인 인증 상태 skipPreRollAd Boolean 프리롤 광고 스킵 여부 clipActive Boolean 클립 생성 허용 여부 timeMachineActive Boolean 타임머신 허용 여부 응답 예시 json { &quot;code&quot;: 200, &quot;content&quot;: { &quot;liveTitle&quot;: &quot;...&quot;, &quot;status&quot;: &quot;OPEN&quot;, &quot;concurrentUserCount&quot;: 1926, &quot;accumulateCount&quot;: 0, &quot;cvExposure&quot;: true, &quot;paidPromotion&quot;: false, &quot;adult&quot;: false, &quot;krOnlyViewing&quot;: false, &quot;abroadCountry&quot;: false, &quot;openDate&quot;: &quot;2026-07-24 19:31:33&quot;, &quot;closeDate&quot;: null, &quot;clipActive&quot;: true, &quot;timeMachineActive&quot;: true, &quot;chatChannelId&quot;: &quot;N2dcLY&quot;, &quot;tags&quot;: [&quot;넥슨커넥트&quot;, &quot;메이플&quot;, &quot;...&quot;], &quot;categoryType&quot;: &quot;GAME&quot;, &quot;liveCategory&quot;: &quot;MapleStory&quot;, &quot;liveCategoryValue&quot;: &quot;메이플스토리&quot;, &quot;livePollingStatusJson&quot;: &quot;{...}&quot;, &quot;faultStatus&quot;: null, &quot;liveConnecting&quot;: false, &quot;skipPreRollAd&quot;: false, &quot;userAdultStatus&quot;: &quot;AGE_RESTRICTION&quot;, &quot;blindType&quot;: null, &quot;chatActive&quot;: true, &quot;chatAvailableGroup&quot;: &quot;ALL&quot;, &quot;chatAvailableCondition&quot;: &quot;NONE&quot;, &quot;minFollowerMinute&quot;: 0, &quot;allowSubscriberInFollowerMode&quot;: true, &quot;chatSlowModeSec&quot;: 0, &quot;chatEmojiMode&quot;: false, &quot;chatDonationRankingExposure&quot;: true, &quot;dropsCampaignNo&quot;: null, &quot;liveTokenList&quot;: [&quot;&lt;ba es/stats", "t": "Stats", "h": ["엔드포인트", "방송별 통계 조회", "VOD별 통계 조회", "최근 방송 통계 조회", "미확인 — 일별 배열 항목 구조", "본인 채널 한정", "관련 문서"], "b": " Stats # 통계 API로 본인 채널의 방송별 통계와 VOD별 통계를 조회할 수 있습니다. 이 API를 호출하려면 본인 채널 권한이 필요합니다. 타 채널의 통계는 조회할 수 없습니다. Base URL https://api.chzzk.naver.com/manage/v1 응답 봉투 A형. code == 200 ( 참조 ) 관련 문서 Manage · 채널 애널리틱스 치지직 API에는 시계열 데이터가 없어 직접 폴링해서 축적해야 한다고 알려져 있으나, 이는 타 채널에 한한 이야기입니다. 본인 채널은 이 API로 과거 통계를 조회할 수 있습니다. 폴링 수집은 타 채널을 분석할 때만 필요합니다. ( 채널 애널리틱스 참조 ) 엔드포인트 # 상태 HTTP Request Description 스키마 미상 GET /channels/{channelId}/stats/lives 방송별 통계 조회 스키마 미상 GET /channels/{channelId}/stats/videos VOD별 통계 조회 스키마 미상 GET /channels/{channelId}/stats/recent-live 최근 방송 통계 조회 경로, 인증, 파라미터는 확정됐으나 배열 항목의 구조는 확인되지 않았습니다. ( 아래 참조 ) 방송별 통계 조회 # 기간 내 방송별 통계를 조회할 수 있습니다. HTTP Request Description GET /channels/{channelId}/stats/lives 방송별 통계 조회 Request Param Field Type required Description channelId String * 본인 채널 식별자 from String * 조회 시작일. YYYY-MM-DD to String * 조회 종료일. YYYY-MM-DD Response Body Field Type Description liveStatList Object[] 방송별 통계 목록. 항목 구조 미확인 summaryLiveStat Object 요약. 스키마 미확인 VOD별 통계 조회 # 기간 내 VOD별 통계를 조회할 수 있습니다. 이 모듈에서 요약 스키마가 확정된 유일한 API입니다. HTTP Request Description GET /channels/{channelId}/stats/videos VOD별 통계 조회 Request Param 방송별 통계 조회 와 같습니다. Response Body Field Type Description videoStatList Object[] VOD별 통계 목록. 항목 구조 미확인 summaryVideoStat Object 요약. 필드 의미 확정 summaryVideoStat Field Type Description pv Int 조회수 uv Int 순 방문자 수 avgCv Int 평균 동시 시청자 수 peakCv Int 최고 동시 시청자 수 totalKeepWatchingTime Int 총 시청 지속시간 avgKeepWatchingTime Int 평균 시청 지속시간 avgKeepWatchingRate Number 평균 시청 유지율 duration Int 길이 date String 날짜 avgCv , peakCv , avgKeepWatchingRate 는 공개 API로는 얻을 수 없는 값입니다. 공개 API의 concurrentUserCount 는 특정 시점의 스냅샷이고 livePv 는 누적 조회수이므로 대체할 수 없습니다. 최근 방송 통계 조회 # 가장 최근 방송의 통계를 조회할 수 있습니다. HTTP Request Description GET /channels/{channelId}/stats/recent-live 최근 방송 통계 조회 요청 파라미터가 없습니다. 캡처에서 응답 전체가 null 로 관측됐습니다. 미확인 — 일별 배열 항목 구조 # 캡처한 채널에 방송 이력이 없어 배열이 모두 비어 r/vodplay/v3/playback/{videoId} 재생 매니페스트 조회 videoNo 와 videoId 는 용도가 다릅니다. ( 식별자 참조 ) VOD 객체 # VOD 상세 조회 가 반환하는 객체입니다. Field Type Description videoNo Int VOD 번호. 댓글과 채팅 API가 사용 videoId String 재생용 식별자. 36자 videoTitle String VOD 제목 videoType String REPLAY 또는 UPLOAD duration Int 길이. 단위는 초 livePv Int 생방송 당시 시청자 수 readCount Int VOD 조회수. livePv 와 다른 값 liveOpenDate String 원래 방송이 시작된 일시 publishDate String VOD가 게시된 일시. liveOpenDate 와 다름 publishDateAt Int 게시 일시. epoch ms inKey String 재생 매니페스트의 key 파라미터. 민감 정보 radioModeInKey String 라디오 모드용 재생 키 prevVideo Object 이전 VOD 요약 nextVideo Object 다음 VOD 요약. VOD 체인 에 사용 videoChatChannelId String 다시보기 채팅용 채팅방 식별자 videoChatEnabled Boolean 다시보기 채팅 제공 여부 chapterActive Boolean 챕터 사용 여부 chapters Object[] 챕터 목록. 빈 배열 사례만 관측 watchTimeline Int 시청 위치. 단위는 초. 용도 미확인 vodStatus String ABR_HLS categoryType String 카테고리 분류 ( Enum 참조 ) videoCategory String 카테고리 코드 channel Object channelId , channelName , verifiedMark streamerShopCatalogTagActive Boolean 상품 태그 여부 ( 스트리머 상점 조회 참조 ) exposure · adult · blindType 노출 제한 정보 응답에 재생 키 inKey 가 포함됩니다. 원본을 보관하는 것은 무방하나 로그나 화면에 출력하지 않습니다. livePv 와 readCount # 두 값은 모집단이 다릅니다. Field 의미 livePv 생방송 당시 시청자 수 readCount VOD 조회수 서로 다른 지표이므로 합산하면 의미가 없습니다. liveOpenDate 와 publishDate # publishDate 는 VOD가 게시된 시각이며 방송 시작보다 늦습니다. 캡처에서는 18:30에 시작한 방송의 VOD가 19:06에 게시됐습니다. 방송 구간을 계산할 때는 liveOpenDate 를 사용합니다. VOD 상세 조회 # VOD 하나의 상세 정보를 조회할 수 있습니다. 경로 버전이 v3 입니다. HTTP Request Description GET /service/v3/videos/{videoNo} VOD 상세 조회 Request Param Field Type required Description videoNo Int * 조회할 VOD 번호 dt String optional 빈 값으로 전달. 용도 미확인 Response Body content 가 VOD 객체 입니다. 응답 예시 json { &quot;code&quot;: 200, &quot;content&quot;: { &quot;videoNo&quot;: 14350160, &quot;videoId&quot;: &quot;89FC02148E88ADA8667456C6A3282113CD28&quot;, &quot;videoTitle&quot;: &quot;...&quot;, &quot;videoType&quot;: &quot;REPLAY&quot;, &quot;publishDate&quot;: &quot;2026-07-24 19:06:56&quot;, &quot;publishDateAt&quot;: 1784887616367, &quot;thumbnailImageUrl&quot;: &quot;...&quot;, &quot;trailerUrl&quot;: null, &quot;duration&quot;: 2111, &quot;readCount&quot;: 324, &quot;livePv&quot;: 9806, &quot;categoryType&quot;: &quot;ETC&quot;, &quot;videoCategory&quot;: &quot;talk&quot;, &quot;videoCategoryValue&quot;: &quot;talk&quot;, &quot;exposure&quot;: true, &quot;adult&quot;: false, &quot;clipActive&quot;: true, &quot;commentActive&quot;: true, &quot;tags&quot;: [&quot;...&quot;], &quot;channel&quot;: { &quot;channelId&quot;: &quot;...&quot;, &quot;channelName&quot;: &quot;...&quot;, &quot;verifiedMark&quot;: true, &quot;activatedChannelBadgeIds&quot;: [] }, &quot;blindType&quot;: null, &quot;watchTimeline&quot;: 24, &quot;paidProductId&quot;: null, &quot;tvAppViewingPolicyType&quot;: &quot;ALLOWED&quot;, &quot;liveOpenDate&quot;: &quot;2026-07-24 18:30:47&quot;, &quot;chapterActive&quot;: false, &quot;chapters&quot;: [], &quot;inKey&quot;: &quot;&lt;재생 키&gt;&quot;, &quot;radioModeInKey&quot;: &quot;&lt;라디오모드 키&gt;&quot;, &quot;previewUrl&quot;: &quot;...&quot;, &quot;vodStatus&quot;: &quot;ABR_HLS&quot;, &quot;liveRewindPlaybackJson&quot;: null, &quot;encryptionType&quot;: null, &quot;prevVideo&quot;: null, &quot;nextVideo&quot;: { &quot;videoNo&quot;: 14324879, &quot;videoId&quot;: &quot;...&quot;, &quot;videoTitle&quot;: &quot;...&quot;, &quot;videoType&quot;: &quot;REPLAY&quot;, &quot;publishDate&quot;: &quot;...&quot;, &quot;thumbnailImageUrl&quot;: &quot;...&quot;, &quot;trailerUrl&quot;: &quot;...&quot; }, &quot;videoChatEnabled&quot;: true, &quot;videoChatChannelId&quot;: &quot;&lt;chatChannelId&gt;&quot;, &quot;paidProduct&quot;: null, &quot;membershipBenefitType&quot;: null, &quot;adParameter&quot;: {...}, &quot;dab&quot;: {...}, &quot;streamerShopCatalogTagActive&quot;: false, &quot;aiCaptionActive&quot;: false, &quot;paidPromotion&quot;: false, &quot;userAdultStatus&quot;: null } } VOD 체인 # nextVideo.videoNo 를 따라가면 채널의 전체 VOD를 순회할 수 있습니다. VOD 목록 조회 의 페이지네이션보다 누락이 적습니다. python def walk_vods(start_video_no, headers): no = start_video_no while no: v = unwrap(requests.get(f&quot;{BASE}/service/v3/videos/{no}&quot;, headers=headers)) yield v nxt = v.get(&quot;nextVideo&quot;) no = nxt[&quot;videoNo&quot;] if nxt else None 응답에 고리가 있으면 순회가 끝나지 않습니다. 방문한 videoNo 를 기록해 중복을 확인하는 편이 안전합니다. 다시보기 채팅 조회 # VOD에 남은 채팅 로그를 조회할 수 있습니다. WebSocket이나 토큰 발급 없이 HTTP만으로 전량 수집할 수 있습니다. 실시간 수신이 필요한 경우에만 Chat 을 사용합니다. HTTP Request Description GET /service/v1/videos/{videoNo}/chats 다시보기 채팅 조회 Request Param Field Type required Description videoNo Int * 조회할 VOD 번호 playerMessageTime Int * 재생 위치. 단위는 밀리초. 첫 요청은 0 previousVideoChatSize Int * 함께 반환할 이전 채팅 개수. 50 확인 Response Body Field Type Description nextPlayerMessageTime Int 다음 요청에 사용할 playerMessageTime videoChats Object[] 채팅 메시지 목록 previousVideoChats Object[] 이전 채팅 목록 videoChats Field Type Description playerMessageTime Int 재생 위치. 단위는 밀리초 messageTime Int 실제 발생 시각. epoch ms content String 채팅 내용 messageTypeCode Int 메시지 종류. 1 TEXT, 10 DONATION, 11 SUBSCRIPTION, 30 SYSTEM ( Enum 참조 ) messageStatusType String 메시지 상태. NORMAL 등 userIdHash String 작성자 해시. 시스템 메시지는 SYSTEM_MESSAGE 리터럴 chatChannelId String 채팅방 식별자 extras String 문자열로 감싸진 JSON ( 참조 ) profile String 문자열로 감싸진 JSON. 시스템 메시지면 &quot;{}&quot; json { &quot;content&quot;: { &quot;nextPlayerMessageTime&quot;: 124168, &quot;previousVideoChats&quot;: [], &quot;videoChats&quot;: [{ &quot;chatChannelId&quot;: &quot;N2dboT&quot;, &quot;messageTime&quot;: 1784885547666, &quot;playerMessageTime&quot;: 96666, &quot;userIdHash&quot;: &quot;&lt;hash&gt;&quot;, &quot;content&quot;: &quot;채팅 내용&quot;, &"}, {"p": "reference/analytics", "t": "채널 애널리틱스", "h": ["트랙 A — 본인 채널", "얻을 수 있는 지표", "함께 사용하는 API", "현재 한계", "트랙 B — 타 채널", "인증 없이 얻을 수 있는 지표", "시계열 축적", "VOD 전수 수집", "수집 시 주의할 필드", "accumulateCount 는 항상 0입니다", "concurrentUserCount 가 API마다 다릅니다", "livePv 와 readCount 는 다른 값입니다", "타 채널에서 얻을 수 없는 지표", "수집 시 주의"], "b": " 채널 애널리틱스 # 채널 지표를 수집하는 방법을 정리한 문서입니다. 본인 채널인지 타 채널인지에 따라 사용할 수 있는 API가 완전히 달라집니다. 본인 채널은 API가 과거 데이터를 제공하고, ms={&quot;includePlayerRecommendContent&quot;: &quot;false&quot;}, headers=headers)) if c[&quot;status&quot;] != &quot;OPEN&quot;: return sink(time.time(), c[&quot;concurrentUserCount&quot;]) time.sleep(json.loads(c[&quot;livePollingStatusJson&quot;])[&quot;callPeriodMilliSecond&quot;] / 1000) VOD 전수 수집 # nextVideo.videoNo 를 따라가면 채널의 모든 VOD를 순회할 수 있습니다. 목록 API의 페이지네이션보다 누락이 적습니다. ( VOD 체인 참조 ) 수집 시 주의할 필드 # accumulateCount 는 항상 0입니다 # live-status 와 live-detail 양쪽 모두 0으로 관측됐습니다. 필드 자체가 채워지지 않습니다. 필요한 값 대체 방송 종료 후 누적 시청자 VOD의 livePv 방송 중 누적 시청자 concurrentUserCount 를 직접 집계 concurrentUserCount 가 API마다 다릅니다 # 엔드포인트 관측값 polling/v3.1/.../live-status 1926 service/v3.3/.../live-detail 4866 캡처 시점 차이일 가능성이 있으나 확인되지 않았습니다. 시계열로 축적할 때는 한쪽 API로 통일합니다. 폴링 비용이 낮은 live-status 를 권장합니다. livePv 와 readCount 는 다른 값입니다 # Field 의미 livePv 생방송 당시 시청자 수 readCount VOD 다시보기 조회수 모집단이 다르므로 합산하거나 혼용하지 않습니다. 타 채널에서 얻을 수 없는 지표 # 아래 지표는 스튜디오 전용이며 타 채널에서는 어떤 방법으로도 조회할 수 없습니다. 시청 지속시간, 유입 경로, 시청자 연령과 성별, 팔로워 증감 상세, 정산과 수익입니다. 타 채널 분석은 위에 정리한 공개 지표와 자체 폴링이 한계입니다. 수집 시 주의 # 댓글과 채팅 응답에는 다른 이용자의 닉네임과 userIdHash 가 포함됩니다. 개인정보 취급에 유의합니다. 요청 사이에 간격을 둡니다. 과도한 폴링은 IP 차단으로 이어집니다. 스튜디오를 캡처하는 경우 streaming-info 의 스트림 키가 응답에 포함됩니다. ( 스트리밍 정보 조회 참조 ) "}, {"p": "reference/deprecated", "t": "제외된 API · 정정된 사실", "h": ["읽기 전용 규칙으로 제외된 것", "시청 이벤트 — 3건", "스튜디오 쓰기 — 9건", "채팅 송신 — 1건", "예외 — 조회용 POST 1건", "구버전 · 경로 변경", "잘못 알려져 있던 사실", "1. POST /service/live-status 는 라이브 상태 API가 아닙니다", "2. GET /polling/live-detail 은 라이브 상세가 아닙니다", "3. 채팅 시스템은 하나입니다", "4. 채팅 서버 번호 공식은 전제가 다릅니다", "5. 채팅 CONNECT 의 ver 은 3입니다", "6. 본인 채널은 시계열 데이터를 조회할 수 있습니다", "7. 대댓글 경로는 replyComments 입니다", "무효 필드", "강등된 항목"], "b": " 제외된 API · 정정된 사실 # 이 문서에 수록하지 않은 API와, 기존 라이브러리나 구 문서에 잘못 알려져 있던 사실을 정리합니다. 다른 자료를 보고 온 경우 특정 API가 없는 이유를 여기에서 확인할 수 있습니다. 관련 문서 엔드포인트 전체 목록 · 문서 규약 분류 건수 읽기 전용 규칙으로 제외 12 구버전 · 경로 변경 4 잘못 알려져 있던 사실 7 읽기 전용 규칙으로 제외된 것 # 이 문서는 서버 상태를 변경하는 요청을 수록하지 않습니다. 그 결과 스트림 키나 채널 설정 변경 사고, 시청자 수 조작 경로가 문서에 포함되지 않습니다. 시청 이벤트 — 3건 # 경로 사유 POST /p
