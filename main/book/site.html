ssageTypeCode</td><td>Int</td><td>메시지 종류. <a href=\"#/modules/chat@messagetypecode\" data-nav>아래 표</a> 참조</td></tr><tr><td>extras</td><td>String</td><td>문자열로 감싸진 JSON (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</td></tr><tr><td>profile</td><td>String</td><td>문자열로 감싸진 JSON. 시스템 메시지면 <code>&quot;{}&quot;</code></td></tr></tbody></table></div>\n<h3 id=\"messagetypecode\">messageTypeCode<a class=\"anchor\" href=\"#/modules/chat@messagetypecode\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>값</th><th>의미</th></tr></thead><tbody><tr><td>1</td><td>TEXT</td></tr><tr><td>2</td><td>IMAGE</td></tr><tr><td>3</td><td>STICKER</td></tr><tr><td>4</td><td>VIDEO</td></tr><tr><td>5</td><td>RICH</td></tr><tr><td>10</td><td>DONATION</td></tr><tr><td>11</td><td>SUBSCRIPTION</td></tr><tr><td>30</td><td>SYSTEM_MESSAGE</td></tr></tbody></table></div>\n<h3 id=\"extras\">extras<a class=\"anchor\" href=\"#/modules/chat@extras\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;chatType&quot;: &quot;STREAMING&quot;, &quot;osType&quot;: &quot;PC&quot;, &quot;extraToken&quot;: &quot;&lt;token&gt;&quot;,\n  &quot;streamingChannelId&quot;: &quot;&lt;channelId&gt;&quot;, &quot;emojis&quot;: {} }</code></pre></div>\n<p><code>extraToken</code> 은 민감 정보입니다. 공유하지 않습니다.</p>\n<h3 id=\"profile\">profile<a class=\"anchor\" href=\"#/modules/chat@profile\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;userIdHash&quot;: &quot;&lt;hash&gt;&quot;, &quot;nickname&quot;: &quot;&lt;nick&gt;&quot;, &quot;profileImageUrl&quot;: &quot;&quot;,\n  &quot;userRoleCode&quot;: &quot;common_user&quot;, &quot;badge&quot;: null, &quot;title&quot;: null,\n  &quot;verifiedMark&quot;: false, &quot;activityBadges&quot;: [] }</code></pre></div>\n<p>시스템 메시지는 <code>userIdHash</code> 가 <code>SYSTEM_MESSAGE</code> 리터럴이고 <code>profile</code> 이 <code>&quot;{}&quot;</code> 로 옵니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import json\nprofile = json.loads(msg[&quot;profile&quot;]) if msg[&quot;profile&quot;] != &quot;{}&quot; else None</code></pre></div>\n<hr>\n<h2 id=\"프로필-조회\">프로필 조회<a class=\"anchor\" href=\"#/modules/chat@프로필-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채팅 참여자의 프로필을 조회할 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<p>경로가 <code>profile-card</code> 가 아니라 <code>profile</code> 이며 <code>streamingChannelId</code> 파라미터가 추가로 필요합니다. (<a href=\"#/reference/deprecated\" data-nav>정정된 사실 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/chats/{chatChannelId}/users/{userIdHash}/profile</strong></td><td>프로필 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>chatChannelId</td><td>String</td><td>*</td><td>채팅방 식별자</td></tr><tr><td>userIdHash</td><td>String</td><td>*</td><td>조회할 사용자 해시</td></tr><tr><td>chatType</td><td>String</td><td>*</td><td><code>STREAMING</code></td></tr><tr><td>streamingChannelId</td><td>String</td><td>*</td><td>채널 식별자. 누락하면 실패</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"개인정보\">개인정보<a class=\"anchor\" href=\"#/modules/chat@개인정보\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채팅 응답에는 다른 이용자의 닉네임과 <code>userIdHash</code> 가 포함됩니다. 수집·보관 시 개인정보 취급에 유의합니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/chat@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/notification\" data-nav>Notification</a> · <a href=\"#/reference/enums\" data-nav>Enum 레퍼런스</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "접속-절차", "text": "접속 절차"}, {"level": 2, "id": "액세스-토큰-발급", "text": "액세스 토큰 발급"}, {"level": 2, "id": "websocket-연결", "text": "WebSocket 연결"}, {"level": 3, "id": "서버-번호는-클라이언트가-정하지-않습니다", "text": "서버 번호는 클라이언트가 정하지 않습니다"}, {"level": 3, "id": "connect-프레임", "text": "CONNECT 프레임"}, {"level": 3, "id": "cmd-코드", "text": "cmd 코드"}, {"level": 2, "id": "메시지-객체", "text": "메시지 객체"}, {"level": 3, "id": "messagetypecode", "text": "messageTypeCode"}, {"level": 3, "id": "extras", "text": "extras"}, {"level": 3, "id": "profile", "text": "profile"}, {"level": 2, "id": "프로필-조회", "text": "프로필 조회"}, {"level": 2, "id": "개인정보", "text": "개인정보"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/clip": {"title": "Clip", "html": "<h1 id=\"clip\">Clip<a class=\"anchor\" href=\"#/modules/clip@clip\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>클립 API로 채널의 클립 목록, 클립 상세 정보, 원본 영상 매핑 정보를 조회할 수 있습니다.<br>클립 API는 인증이 필요하지 않습니다.<br>클립 뷰어 API 2건은 <code>CREATOR</code> 호스트(<code>https://creatorhub-api.naver.com</code>)를 사용하며 응답 봉투가 다릅니다. (<a href=\"#/core/conventions@응답-봉투\" data-nav>응답 봉투 참조</a>)</p>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/clip@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/clips</strong></td><td><a href=\"#/modules/clip@채널-클립-목록-조회\" data-nav>채널 클립 목록 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/clips/{clipUID}/detail</strong></td><td><a href=\"#/modules/clip@클립-상세-조회\" data-nav>클립 상세 조회</a></td></tr><tr><td>조회용 POST</td><td><strong>POST /service/v1/clips/detail-bulk</strong></td><td><a href=\"#/modules/clip@클립-벌크-조회\" data-nav>클립 벌크 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/clips/upload/enable</strong></td><td><a href=\"#/modules/clip@업로드-가능-여부-조회\" data-nav>업로드 가능 여부 조회</a></td></tr><tr><td>실측</td><td><strong>GET /api/v5.0/clipviewer/card</strong></td><td><a href=\"#/modules/clip@클립-뷰어-카드-조회\" data-nav>클립 뷰어 카드 조회</a></td></tr><tr><td>실측</td><td><strong>GET /api/v5.0/clipviewer/cards</strong></td><td><a href=\"#/modules/clip@클립-뷰어-피드-조회\" data-nav>클립 뷰어 피드 조회</a></td></tr></tbody></table></div>\n<p>클립에 달린 댓글은 댓글 API로 조회합니다. <code>objectType</code> 은 <code>CLIP</code>, <code>objectId</code> 는 <code>clipUID</code> 입니다. (<a href=\"#/modules/comment@objecttype\" data-nav>댓글 API 참조</a>)</p>\n<hr>\n<h2 id=\"클립-객체\">클립 객체<a class=\"anchor\" href=\"#/modules/clip@클립-객체\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>목록 조회, 상세 조회, 벌크 조회가 공통으로 반환하는 객체입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>clipUID</td><td>String</td><td>클립 식별자. 10자 (예: <code>L0gvjE67xM</code>)</td></tr><tr><td>videoId</td><td>String</td><td>클립 영상 에셋 식별자. 36자</td></tr><tr><td>clipTitle</td><td>String</td><td>클립 제목</td></tr><tr><td>ownerChannelId</td><td>String</td><td>원본 방송 채널 식별자</td></tr><tr><td>ownerChannel</td><td>Object</td><td>원본 방송 채널 정보. <code>optionalProperties</code> 로 요청한 경우에만 반환</td></tr><tr><td>makerChannel</td><td>Object</td><td>클립을 만든 채널 정보. <code>optionalProperties</code> 로 요청한 경우에만 반환</td></tr><tr><td>thumbnailImageUrl</td><td>String</td><td>썸네일 이미지 URL</td></tr><tr><td>categoryType</td><td>String</td><td>카테고리 분류 (예: <code>GAME</code>)</td></tr><tr><td>clipCategory</td><td>String</td><td>카테고리 코드 (예: <code>Hollow_Knight</code>)</td></tr><tr><td>duration</td><td>Int</td><td>클립 길이. 단위는 초</td></tr><tr><td>adult</td><td>Boolean</td><td>성인 제한 여부</td></tr><tr><td>createdDate</td><td>String</td><td>클립 저장 일시. <code>YYYY-MM-DD HH:mm:ss</code>, KST 이며 시간대 표기가 없음</td></tr><tr><td>readCount</td><td>Int</td><td>조회수</td></tr><tr><td>recId</td><td>String</td><td>추천 맥락. 문자열로 감싸진 JSON (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</td></tr><tr><td>blindType</td><td>String</td><td>블라인드 사유</td></tr><tr><td>privateUserBlock</td><td>Boolean</td><td>차단 여부</td></tr></tbody></table></div>\n<p>한 클립은 <code>clipUID</code> 와 <code>videoId</code> 를 모두 가지며 용도가 다릅니다. 댓글 조회, 상세 조회, 벌크 조회는 <code>clipUID</code> 를 사용하고, 클립 뷰어 카드 조회의 <code>seedMediaId</code> 는 <code>videoId</code> 를 사용합니다. <code>seedMediaId</code> 에 <code>clipUID</code> 를 넣었을 때의 동작은 확인되지 않았습니다.</p>\n<hr>\n<h2 id=\"채널-클립-목록-조회\">채널 클립 목록 조회<a class=\"anchor\" href=\"#/modules/clip@채널-클립-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>한 채널의 클립 목록을 조회할 수 있습니다.<br>커서 방식으로 페이징하며, 정렬 기준 필드인 <code>clipUID</code> 가 커서 역할을 합니다. (<a href=\"#/core/conventions@커서-방식이-특이합니다\" data-nav>페이지네이션 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/{channelId}/clips</strong></td><td>채널 클립 목록 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>filterType</td><td>String</td><td>*</td><td>필터. <code>ALL</code> 확인. 그 외 값은 미확인</td></tr><tr><td>orderType</td><td>String</td><td>*</td><td>정렬. <code>RECENT</code> 확인. <code>POPULAR</code> 는 미확인</td></tr><tr><td>size</td><td>Int</td><td>*</td><td>조회할 클립 개수. 50 확인</td></tr><tr><td>clipUID</td><td>String</td><td>*</td><td>커서. 첫 요청은 빈 값</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>size</td><td>Int</td><td>요청한 페이지 크기</td></tr><tr><td>data</td><td>Object[]</td><td><a href=\"#/modules/clip@클립-객체\" data-nav>클립 객체</a> 목록</td></tr><tr><td>page</td><td>Object</td><td>페이지 정보</td></tr><tr><td>page.next</td><td>Object</td><td>다음 커서. <code>{ &quot;clipUID&quot;: &quot;...&quot; }</code> 형태이며 마지막 페이지면 <code>null</code></td></tr><tr><td>page.prev</td><td>Object</td><td>이전 커서</td></tr></tbody></table></div>\n<details><summary>응답 예시</summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;size&quot;: 50,\n    &quot;page&quot;: { &quot;next&quot;: { &quot;clipUID&quot;: &quot;PXHD1Pg1jT&quot; }, &quot;prev&quot;: null },\n    &quot;data&quot;: [{\n      &quot;clipUID&quot;: &quot;L0gvjE67xM&quot;,\n      &quot;videoId&quot;: &quot;4C6BC202B403BF62556C9DB99EB76A0D53A0&quot;,\n      &quot;clipTitle&quot;: &quot;...&quot;,\n      &quot;ownerChannelId&quot;: &quot;&lt;channelId&gt;&quot;,\n      &quot;ownerChannel&quot;: null,\n      &quot;thumbnailImageUrl&quot;: &quot;...&quot;,\n      &quot;categoryType&quot;: &quot;GAME&quot;, &quot;clipCategory&quot;: &quot;Hollow_Knight&quot;,\n      &quot;duration&quot;: 100, &quot;adult&quot;: false,\n      &quot;createdDate&quot;: &quot;2026-07-25 00:43:22&quot;,\n      &quot;recId&quot;: &quot;{...}&quot;,\n      &quot;readCount&quot;: 10, &quot;blindType&quot;: null, &quot;privateUserBlock&quot;: false\n    }]\n  }\n}</code></pre></div>\n</details>\n<p><strong>예제</strong></p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def iter_clips(channel_id):\n    params = {&quot;filterType&quot;: &quot;ALL&quot;, &quot;orderType&quot;: &quot;RECENT&quot;, &quot;size&quot;: 50, &quot;clipUID&quot;: &quot;&quot;}\n    while True:\n        content = unwrap(requests.get(\n            f&quot;{BASE}/service/v1/channels/{channel_id}/clips&quot;,\n            params=params, headers=HEADERS))\n        yield from content[&quot;data&quot;]\n\n        nxt = (content.get(&quot;page&quot;) or {}).get(&quot;next&quot;)\n        if not nxt or not nxt.get(&quot;clipUID&quot;):\n            return\n        params.update(nxt)</code></pre></div>\n<hr>\n<h2 id=\"클립-상세-조회\">클립 상세 조회<a class=\"anchor\" href=\"#/modules/clip@클립-상세-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>클립 하나의 상세 정보를 조회할 수 있습니다.<br>여러 건을 조회할 때는 <a href=\"#/modules/clip@클립-벌크-조회\" data-nav>클립 벌크 조회</a>를 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/clips/{clipUID}/detail</strong></td><td>클립 상세 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>clipUID</td><td>String</td><td>*</td><td>조회할 클립 식별자</td></tr><tr><td>optionalProperties</td><td>String</td><td>optional</td><td>함께 반환할 부가 정보. 콤마 구분이 아니라 반복 파라미터로 전달. <code>COMMENT</code> · <code>PRIVATE_USER_BLOCK</code> · <code>PENALTY</code> · <code>MAKER_CHANNEL</code> · <code>OWNER_CHANNEL</code></td></tr></tbody></table></div>\n<div class=\"code\"><pre><code>?optionalProperties=COMMENT&amp;optionalProperties=MAKER_CHANNEL&amp;optionalProperties=OWNER_CHANNEL</code></pre></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>content</td><td>Object</td><td><a href=\"#/modules/clip@클립-객체\" data-nav>클립 객체</a></td></tr><tr><td>content.optionalProperty</td><td>Object</td><td>요청한 항목만 채워져 반환</td></tr></tbody></table></div>\n<p><code>makerChannel</code> 은 클립을 만든 채널이고 <code>ownerChannel</code> 은 원본 방송 채널입니다. 두 값은 서로 다를 수 있습니다.</p>\n<hr>\n<h2 id=\"클립-벌크-조회\">클립 벌크 조회<a class=\"anchor\" href=\"#/modules/clip@클립-벌크-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>여러 클립의 메타 정보를 한 번에 조회할 수 있습니다.<br>메서드는 <code>POST</code> 이지만 서버 상태를 변경하지 않는 조회 API 입니다. 요청 본문에 식별자 목록을 담아야 하므로 <code>GET</code> 을 쓰지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>POST /service/v1/clips/detail-bulk</strong></td><td>클립 벌크 조회</td></tr></tbody></table></div>\n<p><strong>Request Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>clipUIDList</td><td>String[]</td><td>*</td><td>조회할 클립 식별자 목록. 한 번에 10개 확인</td></tr><tr><td>optionalProperties</td><td>String[]</td><td>optional</td><td><a href=\"#/modules/clip@클립-상세-조회\" data-nav>클립 상세 조회</a>와 같은 값. 배열로 전달</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;clipUIDList&quot;: [&quot;IqtvsrPt0w&quot;, &quot;CVfAnkGunH&quot;, &quot;...&quot;],\n  &quot;optionalProperties&quot;: [&quot;COMMENT&quot;, &quot;PRIVATE_USER_BLOCK&quot;, &quot;PENALTY&quot;, &quot;MAKER_CHANNEL&quot;, &quot;OWNER_CHANNEL&quot;]\n}</code></pre></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>metaMap</td><td>Object</td><td><code>clipUID</code> 를 키로 하는 <a href=\"#/modules/clip@클립-객체\" data-nav>클립 객체</a> 맵</td></tr></tbody></table></div>\n<p>배열이 아니라 맵으로 반환되므로 요청 순서는 보존되지 않습니다. 존재하지 않는 <code>clipUID</code> 를 함께 요청했을 때의 동작은 확인되지 않았으며, <code>metaMap</code> 에서 누락되는 것으로 보입니다.</p>\n<hr>\n<h2 id=\"업로드-가능-여부-조회\">업로드 가능 여부 조회<a class=\"anchor\" href=\"#/modules/clip@업로드-가능-여부-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>클립 업로드 기능의 사용 가능 여부를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/clips/upload/enable</strong></td><td>업로드 가능 여부 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다. 응답은 boolean 플래그 하나로 관측됐으며 전체 스키마는 확인되지 않았습니다.</p>\n<hr>\n<h2 id=\"클립-뷰어-카드-조회\">클립 뷰어 카드 조회<a class=\"anchor\" href=\"#/modules/clip@클립-뷰어-카드-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>클립이 원본 방송의 어느 지점에서 잘렸는지 조회할 수 있습니다.<br>원본 영상 번호와 시작 위치를 제공하는 유일한 API 입니다.<br>이 API는 <code>https://creatorhub-api.naver.com</code> 을 사용하며, 응답 봉투가 <code>header.code == 0</code> 을 성공으로 씁니다. (<a href=\"#/core/conventions@b형--creator-hub-계열\" data-nav>응답 봉투 참조</a>)</p>\n<p>벌크 조회가 없어 클립 한 개당 한 번씩 호출해야 합니다. 대량 수집 시에는 메타 정보를 <a href=\"#/modules/clip@클립-벌크-조회\" data-nav>클립 벌크 조회</a>로 묶고 이 API만 개별 호출합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /api/v5.0/clipviewer/card</strong></td><td>클립 뷰어 카드 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>seedMediaId</td><td>String</td><td>*</td><td>클립의 <code>videoId</code>. 36자이며 <code>clipUID</code> 와 다름</td></tr><tr><td>seedType</td><td>String</td><td>*</td><td><code>SPECIFIC</code></td></tr><tr><td>serviceType</td><td>String</td><td>*</td><td><code>CHZZK</code></td></tr><tr><td>mediaType</td><td>String</td><td>*</td><td><code>SHORT_FORM</code></td></tr><tr><td>recType</td><td>String</td><td>*</td><td><code>CHZZK</code></td></tr><tr><td>panelType</td><td>String</td><td>*</td><td><code>sdk_chzzk</code></td></tr><tr><td>deviceType</td><td>String</td><td>*</td><td><code>html5_mo</code></td></tr><tr><td>referer</td><td>String</td><td>*</td><td><code>https://chzzk.naver.com/clips/{clipUID}</code>. URL 인코딩하여 전달</td></tr><tr><td>userInteraction</td><td>String</td><td>*</td><td><code>true</code></td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>card</td><td>Object</td><td>카드 정보</td></tr><tr><td>card.content</td><td>Object</td><td>카드 본문</td></tr><tr><td>card.content.extraLinks</td><td>Object[]</td><td><a href=\"#/modules/clip@extralinks\" data-nav>extraLinks</a> 목록</td></tr><tr><td>card.content.contentId</td><td>String</td><td><code>clipUID</code></td></tr><tr><td>card.content.mediaId</td><td>String</td><td>클립 영상 에셋 <code>videoId</code></td></tr><tr><td>card.content.count</td><td>Int</td><td>재생 수</td></tr><tr><td>card.content.category</td><td>Object</td><td><code>{ &quot;parent&quot;: &quot;GAME&quot;, &quot;child&quot;: &quot;PCGAMES&quot; }</code></td></tr><tr><td>card.content.mediaScaleType</td><td>String</td><td><code>CROP</code></td></tr><tr><td>card.content.serviceId</td><td>Int</td><td><code>2113</code>. 치지직 클립 고정값으로 보이나 확인되지 않음</td></tr><tr><td>card.content.liveBadge</td><td>Object</td><td>방송 중일 때의 라이브 링크</td></tr></tbody></table></div>\n<h3 id=\"extralinks\">extraLinks<a class=\"anchor\" href=\"#/modules/clip@extralinks\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>type</td><td>String</td><td>링크 종류. <code>TEXT</code> 는 원본 영상 링크, <code>GENRE</code> 는 카테고리 클립 목록 링크</td></tr><tr><td>title</td><td>String</td><td>원본 방송 제목</td></tr><tr><td>link</td><td>String</td><td>원본 영상 링크. 형태는 <a href=\"#/modules/clip@원본-상태에-따른-링크-형태\" data-nav>원본 상태에 따라 달라짐</a></td></tr><tr><td>appLink</td><td>String</td><td>앱 딥링크 (<code>navergameapp://</code>)</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;type&quot;: &quot;TEXT&quot;,\n  &quot;title&quot;: &quot;[스텔라이브 롤] 메리 크리스마스 이브&quot;,\n  &quot;link&quot;:    &quot;https://chzzk.naver.com/video/4970352?currentTime=7946&quot;,\n  &quot;appLink&quot;: &quot;navergameapp://chzzk/video/4970352?currentTime=7946&quot;\n}</code></pre></div>\n<p><code>type</code> 이 <code>TEXT</code> 인 항목의 <code>link</code> 에서 두 값을 얻습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>위치</th><th>값</th></tr></thead><tbody><tr><td><code>/video/{n}</code></td><td>원본 영상 번호 <code>videoNo</code></td></tr><tr><td><code>?currentTime={n}</code></td><td>원본 영상 기준 클립 시작 위치. 단위는 초</td></tr></tbody></table></div>\n<p><code>currentTime</code> 은 클립의 시작점이며 중앙이나 끝점이 아닙니다. 따라서 원본 영상에서 클립이 차지하는 구간은 <code>[currentTime, currentTime + duration]</code> 이고 단위는 초입니다. 예를 들어 <code>currentTime=7946</code> 은 2시간 12분 26초 지점을 가리킵니다.</p>\n<p>다시보기 채팅의 <code>playerMessageTime</code> 은 밀리초입니다. 두 값을 함께 다룰 때 단위가 다릅니다. (<a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 참조</a>)</p>\n<h3 id=\"원본-상태에-따른-링크-형태\">원본 상태에 따른 링크 형태<a class=\"anchor\" href=\"#/modules/clip@원본-상태에-따른-링크-형태\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>link</code> 의 형태는 원본 방송의 상태에 따라 달라집니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>원본 방송 상태</th><th>link</th></tr></thead><tbody><tr><td>방송 종료 후 다시보기 생성됨</td><td><code>https://chzzk.naver.com/video/{videoNo}?currentTime={초}</code></td></tr><tr><td>방송 진행 중</td><td><code>https://chzzk.naver.com/live/{channelId}</code></td></tr><tr><td>다시보기 미저장 또는 삭제</td><td>확인되지 않음</td></tr></tbody></table></div>\n<p><code>/live/</code> 형태에는 시작 위치가 없습니다. 경로를 분기하지 않고 파싱하면 <code>videoNo</code> 자리에 채널 식별자가 들어갑니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">from urllib.parse import urlparse, parse_qs\n\ndef parse_clip_origin(extra_links):\n    for e in extra_links or []:\n        if e.get(&quot;type&quot;) != &quot;TEXT&quot;:\n            continue\n        u = urlparse(e.get(&quot;link&quot;, &quot;&quot;))\n        parts = u.path.strip(&quot;/&quot;).split(&quot;/&quot;)\n        if len(parts) &gt;= 2 and parts[0] == &quot;video&quot;:\n            return {\n                &quot;title&quot;: e.get(&quot;title&quot;),\n                &quot;videoNo&quot;: int(parts[1]),\n                &quot;currentTime&quot;: int(parse_qs(u.query).get(&quot;currentTime&quot;, [0])[0]),\n            }\n    return None</code></pre></div>\n<h3 id=\"방송-진행-중일-때의-근사\">방송 진행 중일 때의 근사<a class=\"anchor\" href=\"#/modules/clip@방송-진행-중일-때의-근사\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>link</code> 가 <code>/live/</code> 를 가리켜 시작 위치를 얻을 수 없는 경우, 저장 시각과 방송 시작 시각의 차이로 근사할 수 있습니다.</p>\n<div class=\"code\"><pre><code>오프셋 ≈ clip.createdDate − live.openDate\n구간   ≈ [오프셋 − clip.duration, 오프셋]</code></pre></div>\n<p>원본 라이브 시작이 <code>2026-07-24 19:08:46</code> 인 캡처에서 확인한 값입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>clipUID</th><th>duration</th><th>추정 구간</th></tr></thead><tbody><tr><td>L0gvjE67xM</td><td>100</td><td>5:32:56 ~ 5:34:36</td></tr><tr><td>IqtvsrPt0w</td><td>103</td><td>5:32:36 ~ 5:34:19</td></tr></tbody></table></div>\n<p><code>createdDate</code> 는 클립이 저장된 시각이므로 오차가 수십 초 단위로 발생합니다. 방송이 종료되어 다시보기가 생성되면 <code>extraLinks</code> 에서 정확한 값을 다시 조회할 수 있습니다.</p>\n<h3 id=\"매니페스트의-시간값\">매니페스트의 시간값<a class=\"anchor\" href=\"#/modules/clip@매니페스트의-시간값\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>같은 응답의 <code>vod.playback</code> 에도 시간값이 있으나 모두 클립 내부 기준입니다. 원본 영상 기준 오프셋은 <code>extraLinks</code> 에만 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>위치</th><th>예시</th><th>의미</th></tr></thead><tbody><tr><td><code>nvod:Thumbnail[n]/@targetTime</code></td><td><code>PT0.000S</code> ~ <code>PT1M30.000S</code></td><td>클립 내부 썸네일 시각</td></tr><tr><td><code>nvod:Tracking/nvod:TimeTable</code></td><td><code>[3, 5, 8, 13, 21, 34, 60]</code></td><td>QoE 전송 시점. 재생 후 n초</td></tr><tr><td><code>Period/@duration</code></td><td><code>PT1M40.224S</code></td><td>클립 길이</td></tr><tr><td><code>MPD/@nvod:serverTime</code> · <code>@expireTime</code></td><td>ISO 8601</td><td>매니페스트 서명 및 만료</td></tr></tbody></table></div>\n<h3 id=\"확인되지-않은-사항\">확인되지 않은 사항<a class=\"anchor\" href=\"#/modules/clip@확인되지-않은-사항\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<ul><li>다시보기가 생방송 전체를 담지 않고 앞부분이 잘린 경우, <code>currentTime</code> 이 다시보기 기준인지 라이브 기준인지 확인되지 않았습니다. 링크가 그대로 동작해야 하므로 다시보기 기준일 가능성이 높습니다.</li><li><code>seedMediaId</code> 에 <code>clipUID</code> 를 사용할 수 있는지 확인되지 않았습니다.</li></ul>\n<hr>\n<h2 id=\"클립-뷰어-피드-조회\">클립 뷰어 피드 조회<a class=\"anchor\" href=\"#/modules/clip@클립-뷰어-피드-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>추천 클립 목록을 조회할 수 있습니다.<br>특정 클립이 아니라 무한스크롤 피드를 반환합니다.<br>이 API는 <code>https://creatorhub-api.naver.com</code> 을 사용하며 응답 봉투가 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /api/v5.0/clipviewer/cards</strong></td><td>클립 뷰어 피드 조회</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>session</td><td>Object</td><td>세션 정보</td></tr><tr><td>session.id</td><td>String</td><td>세션 식별자. 다음 요청에 <code>sessionId</code> 로 전달</td></tr><tr><td>session.expireAt</td><td>Int</td><td>만료 시각. epoch</td></tr><tr><td>session.hasMore</td><td>Boolean</td><td>다음 페이지 존재 여부</td></tr><tr><td>session.pageIndex</td><td>Int</td><td>현재 페이지. 0부터 시작</td></tr><tr><td>session.pageSize</td><td>Int</td><td>페이지 크기. 10 확인</td></tr><tr><td>session.enableReverse</td><td>Boolean</td><td>역방향 스크롤 가능 여부</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">&quot;session&quot;: { &quot;id&quot;: &quot;&lt;uuid&gt;&quot;, &quot;expireAt&quot;: 1784922975, &quot;hasMore&quot;: true,\n             &quot;pageIndex&quot;: 0, &quot;pageSize&quot;: 10, &quot;enableReverse&quot;: false }</code></pre></div>\n<p>추천 맥락은 <code>recId</code> 로 전달되며 문자열로 감싸진 JSON 입니다. (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/clip@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/comment\" data-nav>Comment</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "클립-객체", "text": "클립 객체"}, {"level": 2, "id": "채널-클립-목록-조회", "text": "채널 클립 목록 조회"}, {"level": 2, "id": "클립-상세-조회", "text": "클립 상세 조회"}, {"level": 2, "id": "클립-벌크-조회", "text": "클립 벌크 조회"}, {"level": 2, "id": "업로드-가능-여부-조회", "text": "업로드 가능 여부 조회"}, {"level": 2, "id": "클립-뷰어-카드-조회", "text": "클립 뷰어 카드 조회"}, {"level": 3, "id": "extralinks", "text": "extraLinks"}, {"level": 3, "id": "원본-상태에-따른-링크-형태", "text": "원본 상태에 따른 링크 형태"}, {"level": 3, "id": "방송-진행-중일-때의-근사", "text": "방송 진행 중일 때의 근사"}, {"level": 3, "id": "매니페스트의-시간값", "text": "매니페스트의 시간값"}, {"level": 3, "id": "확인되지-않은-사항", "text": "확인되지 않은 사항"}, {"level": 2, "id": "클립-뷰어-피드-조회", "text": "클립 뷰어 피드 조회"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/comment": {"title": "Comment", "html": "<h1 id=\"comment\">Comment<a class=\"anchor\" href=\"#/modules/comment@comment\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>댓글 API로 VOD, 채널 게시글, 클립에 달린 댓글과 대댓글을 조회할 수 있습니다.<br>세 대상이 같은 엔드포인트를 사용하며 <code>objectType</code> 으로 구분합니다.<br>인증이 필요하지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://apis.naver.com/nng_main/nng_comment_api</code> · <code>https://creatorhub-api.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code>. 스티커 2건만 B형 <code>header.code == 0</code></td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/clip\" data-nav>Clip</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/comment@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /v1/type/{objectType}/id/{objectId}/comments</strong></td><td><a href=\"#/modules/comment@댓글-목록-조회\" data-nav>댓글 목록 조회</a></td></tr><tr><td>실측</td><td><strong>GET /v1/type/{objectType}/id/{objectId}/comments/{commentId}/replyComments</strong></td><td><a href=\"#/modules/comment@대댓글-조회\" data-nav>대댓글 조회</a></td></tr><tr><td>실측</td><td><strong>GET /api/v4.0/comment/sticker/pack</strong></td><td><a href=\"#/modules/comment@스티커-조회\" data-nav>스티커 조회</a></td></tr><tr><td>실측</td><td><strong>GET /api/v4.0/comment/sticker</strong></td><td><a href=\"#/modules/comment@스티커-조회\" data-nav>스티커 조회</a></td></tr></tbody></table></div>\n<p>스티커 2건은 <code>https://creatorhub-api.naver.com</code> 을 사용하며 응답 봉투가 B형입니다. 기능이 댓글 첨부이므로 이 문서에 수록합니다. (<a href=\"#/core/conventions@b형--creator-hub-계열\" data-nav>응답 봉투 참조</a>)</p>\n<hr>\n<h2 id=\"objecttype\">objectType<a class=\"anchor\" href=\"#/modules/comment@objecttype\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>댓글 대상은 세 가지이며 타입마다 <code>objectId</code> 의 체계가 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>objectType</th><th>objectId</th><th>형태</th><th>대상</th></tr></thead><tbody><tr><td>STREAMING_VIDEO</td><td>videoNo</td><td>Int</td><td>VOD 댓글</td></tr><tr><td>CHANNEL_POST</td><td>channelId</td><td>32자 hex</td><td>채널 커뮤니티 게시글 댓글</td></tr><tr><td>CLIP</td><td>clipUID</td><td>10자</td><td>클립 댓글</td></tr></tbody></table></div>\n<p><code>CLIP</code> 의 <code>objectId</code> 는 <code>clipUID</code> 이며 36자 <code>videoId</code> 가 아닙니다. <code>CHANNEL_POST</code> 의 <code>objectId</code> 도 게시글 번호가 아니라 <code>channelId</code> 입니다.</p>\n<hr>\n<h2 id=\"댓글-객체\">댓글 객체<a class=\"anchor\" href=\"#/modules/comment@댓글-객체\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>목록 조회와 대댓글 조회가 공통으로 반환하는 객체입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>comment.commentId</td><td>Int</td><td>댓글 식별자</td></tr><tr><td>comment.commentType</td><td>String</td><td><code>COMMENT</code> 또는 <code>REPLY</code></td></tr><tr><td>comment.content</td><td>String</td><td>본문. 스티커만 첨부한 경우 빈 문자열</td></tr><tr><td>comment.replyCount</td><td>Int</td><td>대댓글 수 (<a href=\"#/modules/comment@replycount-를-신뢰해도-됩니다\" data-nav>아래 참조</a>)</td></tr><tr><td>comment.parentCommentId</td><td>Int</td><td>부모 댓글 식별자. 최상위 댓글은 0</td></tr><tr><td>comment.mentionedUserIdHash</td><td>String</td><td>답글 대상 사용자 해시</td></tr><tr><td>comment.mentionedUserNickname</td><td>String</td><td>답글 대상 닉네임</td></tr><tr><td>comment.secret</td><td>Boolean</td><td>비밀 댓글 여부</td></tr><tr><td>comment.hideByCleanBot</td><td>Boolean</td><td>클린봇 자동 숨김 여부</td></tr><tr><td>comment.deleted</td><td>Boolean</td><td>삭제 여부</td></tr><tr><td>comment.createdDate</td><td>String</td><td>작성 일시. <code>YYYYMMDDHHmmss</code> 형식</td></tr><tr><td>comment.attaches</td><td>Object[]</td><td><a href=\"#/modules/comment@첨부\" data-nav>첨부 목록</a></td></tr><tr><td>comment.objectType</td><td>String</td><td>댓글 대상 종류</td></tr><tr><td>comment.objectId</td><td>String</td><td>댓글 대상 식별자</td></tr><tr><td>comment.childObjectCount</td><td>Int</td><td>대댓글 수. <code>replyCount</code> 와 별도로 존재하며 차이는 미확인</td></tr><tr><td>comment.childCommentActive</td><td>Boolean</td><td>대댓글 허용 여부</td></tr><tr><td>user.userIdHash</td><td>String</td><td>작성자 해시. 개인정보</td></tr><tr><td>user.userNickname</td><td>String</td><td>작성자 닉네임. 개인정보</td></tr><tr><td>user.userRoleCode</td><td>String</td><td>작성자 역할 (예: <code>common_user</code>)</td></tr><tr><td>user.writer</td><td>Boolean</td><td>영상 작성자 본인 여부</td></tr><tr><td>user.privateUserBlock</td><td>Boolean</td><td>차단한 사용자 여부 (<a href=\"#/modules/user@차단-목록-조회\" data-nav>차단 목록 조회 참조</a>)</td></tr><tr><td>buffNerf.buffCount</td><td>Int</td><td>추천 수</td></tr><tr><td>buffNerf.nerfCount</td><td>Int</td><td>비추천 수</td></tr></tbody></table></div>\n<h3 id=\"첨부\">첨부<a class=\"anchor\" href=\"#/modules/comment@첨부\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>attachType</td><td>String</td><td><code>PHOTO</code> 또는 <code>STICKER</code></td></tr><tr><td>attachValue</td><td>String</td><td>이미지 URL 또는 스티커 코드</td></tr><tr><td>extraJson</td><td>String</td><td><code>PHOTO</code> 면 width와 height, <code>STICKER</code> 면 <code>null</code>. 문자열로 감싸진 JSON</td></tr><tr><td>order</td><td>Int</td><td>표시 순서</td></tr><tr><td>createdDate</td><td>String</td><td>첨부 일시. ISO 8601 형식</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"댓글-목록-조회\">댓글 목록 조회<a class=\"anchor\" href=\"#/modules/comment@댓글-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>대상에 달린 댓글 목록을 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /v1/type/{objectType}/id/{objectId}/comments</strong></td><td>댓글 목록 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>objectType</td><td>String</td><td>*</td><td>댓글 대상 종류. <a href=\"#/modules/comment@objecttype\" data-nav>3종</a></td></tr><tr><td>objectId</td><td>String</td><td>*</td><td>댓글 대상 식별자. 타입마다 체계가 다름</td></tr><tr><td>limit</td><td>Int</td><td>*</td><td>조회할 댓글 개수. 30 확인</td></tr><tr><td>offset</td><td>Int</td><td>*</td><td>조회 시작 위치. 0부터 시작 (<a href=\"#/core/conventions@페이지네이션--3가지-혼재\" data-nav>참조</a>)</td></tr><tr><td>orderType</td><td>String</td><td>*</td><td>정렬 방식. <code>POPULAR</code> 인기순, <code>DESC</code> 최신순, <code>ASC</code> 오래된순</td></tr><tr><td>pagingType</td><td>String</td><td>*</td><td><code>PAGE</code></td></tr></tbody></table></div>\n<p>최신순 값이 <code>NEW</code> 가 아니라 <code>DESC</code> 입니다.</p>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>commentActive</td><td>Boolean</td><td>댓글 허용 여부</td></tr><tr><td>totalCount</td><td>Int</td><td>전체 댓글 수</td></tr><tr><td>commentCount</td><td>Int</td><td>전체 댓글 수. <code>totalCount</code> 와 병존하는 이유는 미확인</td></tr><tr><td>comments.page</td><td>Object</td><td>페이지 정보</td></tr><tr><td>comments.data</td><td>Object[]</td><td><a href=\"#/modules/comment@댓글-객체\" data-nav>댓글 객체</a> 목록</td></tr></tbody></table></div>\n<details><summary>응답 예시</summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;comments&quot;: {\n      &quot;page&quot;: { &quot;next&quot;: null, &quot;prev&quot;: null },\n      &quot;data&quot;: [{\n        &quot;comment&quot;: {\n          &quot;commentId&quot;: 27576679,\n          &quot;commentType&quot;: &quot;COMMENT&quot;,\n          &quot;replyCount&quot;: 0,\n          &quot;parentCommentId&quot;: 0,\n          &quot;content&quot;: &quot;댓글 내용&quot;,\n          &quot;mentionedUserIdHash&quot;: null,\n          &quot;mentionedUserNickname&quot;: null,\n          &quot;secret&quot;: false,\n          &quot;hideByCleanBot&quot;: false,\n          &quot;deleted&quot;: false,\n          &quot;createdDate&quot;: &quot;20260724191415&quot;,\n          &quot;attaches&quot;: [{\n            &quot;commentId&quot;: 27576679,\n            &quot;attachType&quot;: &quot;PHOTO&quot;,\n            &quot;attachValue&quot;: &quot;https://nng-phinf.pstatic.net/...&quot;,\n            &quot;extraJson&quot;: &quot;{\\&quot;width\\&quot;:360,\\&quot;height\\&quot;:194}&quot;,\n            &quot;order&quot;: 1,\n            &quot;createdDate&quot;: &quot;2026-07-24T10:56:45.000+00:00&quot;\n          }],\n          &quot;objectType&quot;: &quot;STREAMING_VIDEO&quot;,\n          &quot;objectId&quot;: &quot;14350160&quot;,\n          &quot;loungeId&quot;: null,\n          &quot;onlyOneEmoji&quot;: false,\n          &quot;childObjectCount&quot;: 0,\n          &quot;childCommentActive&quot;: true\n        },\n        &quot;user&quot;: {\n          &quot;userIdHash&quot;: &quot;&lt;hash&gt;&quot;,\n          &quot;userNickname&quot;: &quot;&lt;nickname&gt;&quot;,\n          &quot;profileImageUrl&quot;: &quot;...&quot;,\n          &quot;userLevel&quot;: 0,\n          &quot;writer&quot;: false,\n          &quot;badge&quot;: null,\n          &quot;title&quot;: null,\n          &quot;userRoleCode&quot;: &quot;common_user&quot;,\n          &quot;secretOpen&quot;: false,\n          &quot;buffnerf&quot;: null,\n          &quot;privateUserBlock&quot;: false,\n          &quot;verifiedMark&quot;: false,\n          &quot;activatedChannelBadgeIds&quot;: []\n        },\n        &quot;buffNerf&quot;: { &quot;buffCount&quot;: 2, &quot;nerfCount&quot;: 0 }\n      }]\n    }\n  }\n}</code></pre></div>\n</details>\n<h3 id=\"날짜-형식이-두-가지입니다\">날짜 형식이 두 가지입니다<a class=\"anchor\" href=\"#/modules/comment@날짜-형식이-두-가지입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>위치</th><th>형식</th></tr></thead><tbody><tr><td>comment.createdDate</td><td><code>YYYYMMDDHHmmss</code></td></tr><tr><td>attaches.createdDate</td><td>ISO 8601</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">from datetime import datetime\ndt = datetime.strptime(c[&quot;comment&quot;][&quot;createdDate&quot;], &quot;%Y%m%d%H%M%S&quot;)</code></pre></div>\n<hr>\n<h2 id=\"대댓글-조회\">대댓글 조회<a class=\"anchor\" href=\"#/modules/comment@대댓글-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>특정 댓글에 달린 대댓글 목록을 조회할 수 있습니다.</p>\n<p>경로가 <code>replies</code> 가 아니라 <code>replyComments</code> 입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /v1/type/{objectType}/id/{objectId}/comments/{commentId}/replyComments</strong></td><td>대댓글 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>objectType</td><td>String</td><td>*</td><td>댓글 대상 종류</td></tr><tr><td>objectId</td><td>String</td><td>*</td><td>댓글 대상 식별자</td></tr><tr><td>commentId</td><td>Int</td><td>*</td><td>부모 댓글 식별자</td></tr><tr><td>offset</td><td>Int</td><td>*</td><td>조회 시작 위치. 0부터 시작. <code>limit</code> 은 없음</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<p><a href=\"#/modules/comment@댓글-객체\" data-nav>댓글 객체</a>와 같으며 아래 필드의 값이 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>최상위 댓글</th><th>대댓글</th></tr></thead><tbody><tr><td>commentType</td><td><code>COMMENT</code></td><td><code>REPLY</code></td></tr><tr><td>parentCommentId</td><td>0</td><td>부모 댓글 식별자</td></tr><tr><td>mentionedUserNickname · mentionedUserIdHash</td><td><code>null</code></td><td>답글 대상 정보가 채워짐</td></tr><tr><td>commentCount</td><td>반환됨</td><td>반환되지 않음</td></tr><tr><td>totalCount</td><td>전체 댓글 수</td><td>대댓글 총 개수</td></tr></tbody></table></div>\n<h3 id=\"replycount-를-신뢰해도-됩니다\">replyCount 를 신뢰해도 됩니다<a class=\"anchor\" href=\"#/modules/comment@replycount-를-신뢰해도-됩니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>부모 댓글의 <code>replyCount</code> 와 대댓글 응답의 <code>totalCount</code> 가 일치하는 것을 확인했습니다. 3건과 8건 두 사례에서 모두 일치했습니다. 따라서 <code>replyCount</code> 가 0이면 대댓글 조회를 생략할 수 있습니다.</p>\n<p><strong>예제</strong></p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def collect_all(object_type, object_id, headers):\n    for item in iter_comments(object_type, object_id, headers):\n        yield item\n        if item[&quot;comment&quot;][&quot;replyCount&quot;] &gt; 0:      # 0이면 요청 생략\n            yield from iter_replies(\n                object_type, object_id, item[&quot;comment&quot;][&quot;commentId&quot;], headers)</code></pre></div>\n<hr>\n<h2 id=\"스티커-조회\">스티커 조회<a class=\"anchor\" href=\"#/modules/comment@스티커-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>댓글에 첨부된 스티커 정보를 조회할 수 있습니다.<br><code>attaches</code> 의 <code>attachType</code> 이 <code>STICKER</code> 인 항목을 해석할 때 사용합니다.<br>이 API는 <code>https://creatorhub-api.naver.com</code> 을 사용하며 응답 봉투가 B형입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /api/v4.0/comment/sticker/pack</strong></td><td>스티커 팩 목록 조회</td></tr><tr><td><strong>GET /api/v4.0/comment/sticker</strong></td><td>팩 내 스티커 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>stickerServiceCode</td><td>String</td><td>*</td><td><code>chzzk</code>. 두 API 공통</td></tr><tr><td>packCode</td><td>String</td><td>*</td><td>스티커 팩 코드. <code>/sticker</code> 에만 사용</td></tr></tbody></table></div>\n<p>성공 조건이 <code>header.code == 0</code> 입니다. A형과 같은 방식으로 판정하면 정상 응답을 실패로 처리하게 됩니다. (<a href=\"#/core/conventions@응답-봉투\" data-nav>응답 봉투 참조</a>)</p>\n<hr>\n<h2 id=\"개인정보\">개인정보<a class=\"anchor\" href=\"#/modules/comment@개인정보\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>댓글 응답에는 다른 이용자의 닉네임과 <code>userIdHash</code> 가 포함됩니다. 수집·보관 시 개인정보 취급에 유의합니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/comment@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/clip\" data-nav>Clip</a> · <a href=\"#/modules/user\" data-nav>User</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "objecttype", "text": "objectType"}, {"level": 2, "id": "댓글-객체", "text": "댓글 객체"}, {"level": 3, "id": "첨부", "text": "첨부"}, {"level": 2, "id": "댓글-목록-조회", "text": "댓글 목록 조회"}, {"level": 3, "id": "날짜-형식이-두-가지입니다", "text": "날짜 형식이 두 가지입니다"}, {"level": 2, "id": "대댓글-조회", "text": "대댓글 조회"}, {"level": 3, "id": "replycount-를-신뢰해도-됩니다", "text": "replyCount 를 신뢰해도 됩니다"}, {"level": 2, "id": "스티커-조회", "text": "스티커 조회"}, {"level": 2, "id": "개인정보", "text": "개인정보"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/commerce": {"title": "Commerce", "html": "<h1 id=\"commerce\">Commerce<a class=\"anchor\" href=\"#/modules/commerce@commerce\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>커머스 API로 채널의 후원 설정, 미션 목록, 스트리머 상점 정보를 조회할 수 있습니다.<br>인증이 필요하지 않습니다.<br>후원 설정을 반환하는 API이며 후원 내역을 반환하지는 않습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/notification\" data-nav>Notification</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/commerce@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><strong>후원</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/donations/chat-setting</strong></td><td><a href=\"#/modules/commerce@후원-설정-조회\" data-nav>후원 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/donations/video-setting</strong></td><td><a href=\"#/modules/commerce@후원-설정-조회\" data-nav>후원 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/donations/mission-setting</strong></td><td><a href=\"#/modules/commerce@후원-설정-조회\" data-nav>후원 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v2/channels/{channelId}/donations/missions</strong></td><td><a href=\"#/modules/commerce@미션-목록-조회\" data-nav>미션 목록 조회</a></td></tr></tbody></table></div>\n<p><strong>상업 기능</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /commercial/v1/streamer-shop/{channelId}/products</strong></td><td><a href=\"#/modules/commerce@스트리머-상점-조회\" data-nav>스트리머 상점 조회</a></td></tr><tr><td>실측</td><td><strong>GET /commercial/v1/streamer-shop/{channelId}/notifiable</strong></td><td><a href=\"#/modules/commerce@스트리머-상점-조회\" data-nav>스트리머 상점 조회</a></td></tr><tr><td>실측</td><td><strong>GET /commercial/v1/channels/{channelId}/donation-campaigns</strong></td><td>후원 캠페인 조회</td></tr><tr><td>실측</td><td><strong>GET /commercial/v1/cheat-key/status</strong></td><td><a href=\"#/modules/commerce@치트키--오퍼월\" data-nav>치트키 · 오퍼월</a></td></tr><tr><td>실측</td><td><strong>GET /commercial/v1/cheat-key/promotion-status</strong></td><td><a href=\"#/modules/commerce@치트키--오퍼월\" data-nav>치트키 · 오퍼월</a></td></tr><tr><td>실측</td><td><strong>GET /commercial/v1/offerwall/total-reward</strong></td><td><a href=\"#/modules/commerce@치트키--오퍼월\" data-nav>치트키 · 오퍼월</a></td></tr></tbody></table></div>\n<p><strong>광고 · 유료상품</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>경로만 확인</td><td><strong>GET /service/v1/paid-product/init</strong></td><td><a href=\"#/modules/commerce@광고--유료상품\" data-nav>광고 · 유료상품</a></td></tr><tr><td>경로만 확인</td><td><strong>GET /service/v1/ad/display-status</strong></td><td><a href=\"#/modules/commerce@광고--유료상품\" data-nav>광고 · 유료상품</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"미션-목록-조회\">미션 목록 조회<a class=\"anchor\" href=\"#/modules/commerce@미션-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널의 미션 후원 목록을 조회할 수 있습니다.</p>\n<p>v1과 v2가 공존하며 v2가 현행입니다. v1은 구버전입니다. (<a href=\"#/reference/deprecated\" data-nav>제외된 API 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v2/channels/{channelId}/donations/missions</strong></td><td>미션 목록 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>filterStatus</td><td>String</td><td>optional</td><td>미션 상태 필터. 사용 가능한 값은 미확인</td></tr><tr><td>page</td><td>Int</td><td>*</td><td>요청하는 페이지. 0부터 시작 (<a href=\"#/core/conventions@페이지네이션--3가지-혼재\" data-nav>참조</a>)</td></tr><tr><td>size</td><td>Int</td><td>*</td><td>조회할 미션 개수</td></tr></tbody></table></div>\n<p>미션 승인과 거절은 서버 상태를 변경하는 동작이므로 이 문서의 범위 밖입니다. 미션 발생을 실시간으로 감지하려면 알림 소켓의 <code>mission@</code> 세션을 사용합니다. (<a href=\"#/modules/notification@이벤트-세션-9종\" data-nav>이벤트 세션 참조</a>)</p>\n<hr>\n<h2 id=\"후원-설정-조회\">후원 설정 조회<a class=\"anchor\" href=\"#/modules/commerce@후원-설정-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널이 후원을 받는 방식에 대한 설정을 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/{channelId}/donations/chat-setting</strong></td><td>채팅 후원 설정 조회</td></tr><tr><td><strong>GET /service/v1/channels/{channelId}/donations/video-setting</strong></td><td>영상 후원 설정 조회</td></tr><tr><td><strong>GET /service/v1/channels/{channelId}/donations/mission-setting</strong></td><td>미션 후원 설정 조회</td></tr></tbody></table></div>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>내용</th></tr></thead><tbody><tr><td>chat-setting</td><td>채팅 후원 허용 여부, 최소 금액 등</td></tr><tr><td>video-setting</td><td>영상 후원 설정</td></tr><tr><td>mission-setting</td><td>미션 후원 설정</td></tr></tbody></table></div>\n<h3 id=\"후원-내역\">후원 내역<a class=\"anchor\" href=\"#/modules/commerce@후원-내역\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>후원 내역을 반환하는 공개 API는 이번 캡처에서 확인되지 않았습니다. 후원 랭킹의 노출 여부만 라이브 상태의 <code>chatDonationRankingExposure</code> 로 확인할 수 있습니다. (<a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회 참조</a>)</p>\n<p>VOD 다시보기 채팅에서는 후원을 건별로 확인할 수 있습니다. <code>messageTypeCode</code> 가 10인 메시지가 후원입니다. (<a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 조회 참조</a>)</p>\n<hr>\n<h2 id=\"스트리머-상점-조회\">스트리머 상점 조회<a class=\"anchor\" href=\"#/modules/commerce@스트리머-상점-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널의 스트리머 상점 상품 목록을 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /commercial/v1/streamer-shop/{channelId}/products</strong></td><td>상점 상품 조회</td></tr><tr><td><strong>GET /commercial/v1/streamer-shop/{channelId}/notifiable</strong></td><td>상점 알림 가능 여부 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>catalogType</td><td>String</td><td>*</td><td>카탈로그 종류. 사용 가능한 값은 미확인. <code>products</code> 에만 사용</td></tr></tbody></table></div>\n<p><code>notifiable</code> 은 쿼리 파라미터가 없습니다.</p>\n<p>VOD 상세의 <code>streamerShopCatalogTagActive</code> 가 <code>true</code> 이면 해당 영상에 상품 태그가 있습니다. (<a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체 참조</a>)</p>\n<hr>\n<h2 id=\"치트키--오퍼월\">치트키 · 오퍼월<a class=\"anchor\" href=\"#/modules/commerce@치트키--오퍼월\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>치트키 사용 상태와 오퍼월 누적 리워드를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /commercial/v1/cheat-key/status</strong></td><td>치트키 상태 조회</td></tr><tr><td><strong>GET /commercial/v1/cheat-key/promotion-status</strong></td><td>치트키 프로모션 조회</td></tr><tr><td><strong>GET /commercial/v1/offerwall/total-reward</strong></td><td>오퍼월 누적 리워드 조회</td></tr></tbody></table></div>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>내용</th><th>파라미터</th></tr></thead><tbody><tr><td>cheat-key/status</td><td>치트키 사용 상태</td><td>없음</td></tr><tr><td>cheat-key/promotion-status</td><td>프로모션 진행 여부</td><td>없음</td></tr><tr><td>offerwall/total-reward</td><td>누적 리워드</td><td><code>clientPlatformType</code></td></tr></tbody></table></div>\n<p><code>my-info</code> 응답의 <code>cheatKey</code> 필드와 연동됩니다. (<a href=\"#/modules/channel@내-정보-조회\" data-nav>내 정보 조회 참조</a>)</p>\n<hr>\n<h2 id=\"광고--유료상품\">광고 · 유료상품<a class=\"anchor\" href=\"#/modules/commerce@광고--유료상품\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/ad/display-status</strong></td><td>광고 노출 상태 조회</td></tr><tr><td><strong>GET /service/v1/paid-product/init</strong></td><td>유료상품 초기화</td></tr></tbody></table></div>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>파라미터</th></tr></thead><tbody><tr><td>ad/display-status</td><td><code>pgId</code>, <code>pgType</code></td></tr><tr><td>paid-product/init</td><td>없음</td></tr></tbody></table></div>\n<p>경로만 확인했으며 파라미터 값과 응답은 검증되지 않았습니다.</p>\n<p>라이브 광고는 <a href=\"#/modules/live@광고\" data-nav>Live</a>에 있습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/commerce@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/notification\" data-nav>Notification</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "미션-목록-조회", "text": "미션 목록 조회"}, {"level": 2, "id": "후원-설정-조회", "text": "후원 설정 조회"}, {"level": 3, "id": "후원-내역", "text": "후원 내역"}, {"level": 2, "id": "스트리머-상점-조회", "text": "스트리머 상점 조회"}, {"level": 2, "id": "치트키--오퍼월", "text": "치트키 · 오퍼월"}, {"level": 2, "id": "광고--유료상품", "text": "광고 · 유료상품"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/discovery": {"title": "Discovery", "html": "<h1 id=\"discovery\">Discovery<a class=\"anchor\" href=\"#/modules/discovery@discovery\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>디스커버리 API로 홈 피드, 카테고리별 라이브, 배너, 라운지 검색 결과를 조회할 수 있습니다.<br>인증이 필요하지 않습니다.<br>특정 채널이 아니라 서비스 전체를 대상으로 하는 API 묶음입니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com</code> · <code>https://comm-api.game.naver.com/nng_main</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/channel\" data-nav>Channel</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/discovery@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /service/v1/topics/HOME/sub-topics/HOME/main</strong></td><td><a href=\"#/modules/discovery@홈-메인-피드-조회\" data-nav>홈 메인 피드 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/categories/live</strong></td><td><a href=\"#/modules/discovery@카테고리별-라이브-조회\" data-nav>카테고리별 라이브 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/topics</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/banners</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/home/skins</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/client-config</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/program-schedules/coming</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/streamer-partners/recommended</strong></td><td><a href=\"#/modules/discovery@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /v2/search/lounges</strong></td><td><a href=\"#/modules/discovery@라운지-검색\" data-nav>라운지 검색</a></td></tr><tr><td>실측</td><td><strong>GET /v2/search/lounges/auto-complete</strong></td><td><a href=\"#/modules/discovery@라운지-검색\" data-nav>라운지 검색</a></td></tr><tr><td>실측</td><td><strong>GET /v1/lounge/loungeEvent/chzzk</strong></td><td><a href=\"#/modules/discovery@라운지-검색\" data-nav>라운지 검색</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"홈-메인-피드-조회\">홈 메인 피드 조회<a class=\"anchor\" href=\"#/modules/discovery@홈-메인-피드-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>치지직 홈 첫 화면의 콘텐츠를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/topics/HOME/sub-topics/HOME/main</strong></td><td>홈 메인 피드 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>slotSize</td><td>Int</td><td>*</td><td>슬롯 개수. 5 확인</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>topLives</td><td>Object[]</td><td>상위 라이브 목록</td></tr><tr><td>topLives.trackingParams</td><td>Object</td><td>통계용 파라미터. 조회 결과에 영향 없음</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"카테고리별-라이브-조회\">카테고리별 라이브 조회<a class=\"anchor\" href=\"#/modules/discovery@카테고리별-라이브-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>카테고리를 동시 시청자 수 순으로 조회할 수 있습니다.<br>커서 방식으로 페이징합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/categories/live</strong></td><td>카테고리별 라이브 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>size</td><td>Int</td><td>*</td><td>조회할 카테고리 개수. 6 확인</td></tr><tr><td>concurrentUserCount</td><td>Int</td><td>optional</td><td>커서. 첫 요청은 생략</td></tr><tr><td>openLiveCount</td><td>Int</td><td>optional</td><td>커서</td></tr><tr><td>categoryId</td><td>String</td><td>optional</td><td>커서</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>data</td><td>Object[]</td><td>카테고리 목록</td></tr><tr><td>data.categoryType</td><td>String</td><td><code>GAME</code>, <code>SPORTS</code>, <code>ETC</code> (<a href=\"#/reference/enums\" data-nav>Enum 참조</a>)</td></tr><tr><td>data.categoryId</td><td>String</td><td>카테고리 코드 (예: <code>Lost_Ark</code>)</td></tr><tr><td>data.categoryValue</td><td>String</td><td>카테고리 표시명</td></tr><tr><td>data.posterImageUrl</td><td>String</td><td>포스터 이미지 URL</td></tr><tr><td>data.openLiveCount</td><td>Int</td><td>해당 카테고리의 방송 수</td></tr><tr><td>data.concurrentUserCount</td><td>Int</td><td>해당 카테고리의 합산 시청자 수</td></tr><tr><td>data.newCategory</td><td>Boolean</td><td>신규 카테고리 여부</td></tr><tr><td>data.dropsCampaignNos</td><td>Int[]</td><td>드롭스 캠페인 번호</td></tr><tr><td>page.next</td><td>Object</td><td>다음 커서. 마지막 페이지면 <code>null</code></td></tr></tbody></table></div>\n<h3 id=\"커서가-3개로-구성됩니다\">커서가 3개로 구성됩니다<a class=\"anchor\" href=\"#/modules/discovery@커서가-3개로-구성됩니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>정렬 기준 세 필드가 함께 커서를 구성합니다. (<a href=\"#/core/conventions@커서-방식이-특이합니다\" data-nav>커서 페이지네이션 참조</a>)</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">&quot;page&quot;: { &quot;next&quot;: { &quot;concurrentUserCount&quot;: 7307, &quot;openLiveCount&quot;: 172, &quot;categoryId&quot;: &quot;Lost_Ark&quot; } }</code></pre></div>\n<div class=\"code\"><pre><code>?concurrentUserCount=7307&amp;openLiveCount=172&amp;categoryId=Lost_Ark</code></pre></div>\n<p><code>page.next</code> 를 그대로 파라미터에 병합합니다. 키를 하나라도 누락하면 정렬 위치가 어긋납니다.</p>\n<hr>\n<h2 id=\"라운지-검색\">라운지 검색<a class=\"anchor\" href=\"#/modules/discovery@라운지-검색\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>네이버 게임 라운지를 검색할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v2/search/lounges</strong></td><td>라운지 검색</td></tr><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v2/search/lounges/auto-complete</strong></td><td>라운지 자동완성</td></tr><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/lounge/loungeEvent/chzzk</strong></td><td>라운지 이벤트 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>offset</td><td>Int</td><td>*</td><td>조회 시작 위치 (<a href=\"#/core/conventions@페이지네이션--3가지-혼재\" data-nav>참조</a>)</td></tr><tr><td>size</td><td>Int</td><td>*</td><td>조회할 개수</td></tr></tbody></table></div>\n<p>응답의 <code>page.next.offset</code> 을 다음 요청에 사용합니다.</p>\n<p>라운지는 네이버 게임 커뮤니티 개념이며 치지직 채널과 1:1로 대응하지 않습니다. 채널 검색이 목적이라면 이 경로가 적합하지 않을 수 있습니다. 채널 검색 전용 경로는 이번 캡처에서 확인되지 않았습니다.</p>\n<hr>\n<h2 id=\"부가-엔드포인트\">부가 엔드포인트<a class=\"anchor\" href=\"#/modules/discovery@부가-엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로와 응답 형태는 확인했으나 쿼리 파라미터 조합은 대부분 검증되지 않았습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>내용</th><th>파라미터</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/topics</code></td><td>토픽 목록. 홈 피드의 <code>HOME/HOME</code> 외 다른 토픽 존재</td><td>없음</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/banners</code></td><td>배너</td><td><code>deviceType</code>, <code>positionsIn</code></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/home/skins</code></td><td>홈 스킨. 이벤트 테마</td><td>미검증</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/client-config</code></td><td>클라이언트 설정과 이벤트 배너</td><td>미검증</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/program-schedules/coming</code></td><td>방송 예정 편성표</td><td>미검증</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/streamer-partners/recommended</code></td><td>추천 파트너 스트리머</td><td>미검증</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/discovery@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "홈-메인-피드-조회", "text": "홈 메인 피드 조회"}, {"level": 2, "id": "카테고리별-라이브-조회", "text": "카테고리별 라이브 조회"}, {"level": 3, "id": "커서가-3개로-구성됩니다", "text": "커서가 3개로 구성됩니다"}, {"level": 2, "id": "라운지-검색", "text": "라운지 검색"}, {"level": 2, "id": "부가-엔드포인트", "text": "부가 엔드포인트"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/live": {"title": "Live", "html": "<h1 id=\"live\">Live<a class=\"anchor\" href=\"#/modules/live@live\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>라이브 API로 방송 상태와 방송 상세 정보를 조회할 수 있습니다.<br>인증이 필요하지 않습니다.<br>시청자 수를 주기적으로 확인할 때는 <code>live-detail</code> 보다 가벼운 <code>live-status</code> 를 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/live@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /polling/v3.1/channels/{channelId}/live-status</strong></td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v3.3/channels/{channelId}/live-detail</strong></td><td><a href=\"#/modules/live@라이브-상세-조회\" data-nav>라이브 상세 조회</a></td></tr><tr><td>실측</td><td><strong>GET /polling/live-detail</strong></td><td><a href=\"#/modules/live@ab-테스트-배정-조회\" data-nav>A/B 테스트 배정 조회</a></td></tr><tr><td>경로만 확인</td><td><strong>GET /service/v1/lives/{liveId}/ads/current</strong></td><td><a href=\"#/modules/live@광고\" data-nav>광고</a></td></tr><tr><td>경로만 확인</td><td><strong>GET /service/v1/live/{liveId}/auto-play-info</strong></td><td><a href=\"#/modules/live@광고\" data-nav>광고</a></td></tr></tbody></table></div>\n<p>경로에 <code>lives</code>(복수)와 <code>live</code>(단수)가 함께 쓰입니다. 오타가 아니라 실제 경로입니다.</p>\n<h3 id=\"이름과-기능이-다른-경로\">이름과 기능이 다른 경로<a class=\"anchor\" href=\"#/modules/live@이름과-기능이-다른-경로\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>실제 기능</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /polling/v3.1/.../live-status</code></td><td>라이브 상태 조회</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v3.3/.../live-detail</code></td><td>라이브 상세 조회</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /polling/live-detail</code></td><td>라이브 상세가 아니라 A/B 테스트 배정 조회</td></tr><tr><td><code><span class=\"method m-post\">POST</span> /service/live-status</code></td><td>라이브 상태가 아니라 행동 로그 수집기. <a href=\"#/reference/deprecated\" data-nav>이 문서에서 제외</a></td></tr></tbody></table></div>\n<p><code>polling</code> 은 상태, <code>service</code> 는 상세를 반환합니다. <code>polling/live-detail</code> 만 예외입니다.</p>\n<hr>\n<h2 id=\"라이브-상태-조회\">라이브 상태 조회<a class=\"anchor\" href=\"#/modules/live@라이브-상태-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널의 현재 방송 상태와 동시 시청자 수를 조회할 수 있습니다.<br><code>live-detail</code> 보다 응답이 가벼워 주기 호출에 적합합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /polling/v3.1/channels/{channelId}/live-status</strong></td><td>라이브 상태 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>includePlayerRecommendContent</td><td>Boolean</td><td>optional</td><td>추천 콘텐츠 포함 여부. <code>false</code> 확인</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>status</td><td>String</td><td><code>OPEN</code> 또는 <code>CLOSE</code></td></tr><tr><td>concurrentUserCount</td><td>Int</td><td>현재 동시 시청자 수</td></tr><tr><td>accumulateCount</td><td>Int</td><td>항상 0으로 반환됩니다. <a href=\"#/modules/live@accumulatecount-는-무효-필드입니다\" data-nav>아래 참조</a></td></tr><tr><td>liveTitle</td><td>String</td><td>방송 제목</td></tr><tr><td>liveCategory</td><td>String</td><td>카테고리 코드</td></tr><tr><td>liveCategoryValue</td><td>String</td><td>카테고리 표시명</td></tr><tr><td>categoryType</td><td>String</td><td>카테고리 분류 (예: <code>GAME</code>)</td></tr><tr><td>tags</td><td>String[]</td><td>방송 태그</td></tr><tr><td>openDate</td><td>String</td><td>방송 시작 일시. <code>YYYY-MM-DD HH:mm:ss</code></td></tr><tr><td>closeDate</td><td>String</td><td>방송 종료 일시. 방송 중이면 <code>null</code></td></tr><tr><td>chatChannelId</td><td>String</td><td>채팅방 식별자 (<a href=\"#/modules/chat\" data-nav>Chat 참조</a>)</td></tr><tr><td>chatActive</td><td>Boolean</td><td>채팅 활성 여부</td></tr><tr><td>chatAvailableGroup</td><td>String</td><td>채팅 참여 가능 그룹</td></tr><tr><td>chatDonationRankingExposure</td><td>Boolean</td><td>후원 랭킹 노출 여부</td></tr><tr><td>livePollingStatusJson</td><td>String</td><td>폴링 주기 정보. 문자열로 감싸진 JSON (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</td></tr><tr><td>liveTokenList</td><td>String[]</td><td>민감 정보. 외부에 공유하지 않습니다</td></tr><tr><td>adult</td><td>Boolean</td><td>성인 제한 여부</td></tr><tr><td>userAdultStatus</td><td>String</td><td>성인 인증 상태</td></tr><tr><td>skipPreRollAd</td><td>Boolean</td><td>프리롤 광고 스킵 여부</td></tr><tr><td>clipActive</td><td>Boolean</td><td>클립 생성 허용 여부</td></tr><tr><td>timeMachineActive</td><td>Boolean</td><td>타임머신 허용 여부</td></tr></tbody></table></div>\n<details><summary>응답 예시</summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;liveTitle&quot;: &quot;...&quot;, &quot;status&quot;: &quot;OPEN&quot;,\n    &quot;concurrentUserCount&quot;: 1926, &quot;accumulateCount&quot;: 0,\n    &quot;cvExposure&quot;: true, &quot;paidPromotion&quot;: false, &quot;adult&quot;: false,\n    &quot;krOnlyViewing&quot;: false, &quot;abroadCountry&quot;: false,\n    &quot;openDate&quot;: &quot;2026-07-24 19:31:33&quot;, &quot;closeDate&quot;: null,\n    &quot;clipActive&quot;: true, &quot;timeMachineActive&quot;: true,\n    &quot;chatChannelId&quot;: &quot;N2dcLY&quot;,\n    &quot;tags&quot;: [&quot;넥슨커넥트&quot;, &quot;메이플&quot;, &quot;...&quot;],\n    &quot;categoryType&quot;: &quot;GAME&quot;,\n    &quot;liveCategory&quot;: &quot;MapleStory&quot;, &quot;liveCategoryValue&quot;: &quot;메이플스토리&quot;,\n    &quot;livePollingStatusJson&quot;: &quot;{...}&quot;,\n    &quot;faultStatus&quot;: null, &quot;liveConnecting&quot;: false,\n    &quot;skipPreRollAd&quot;: false, &quot;userAdultStatus&quot;: &quot;AGE_RESTRICTION&quot;,\n    &quot;blindType&quot;: null,\n    &quot;chatActive&quot;: true, &quot;chatAvailableGroup&quot;: &quot;ALL&quot;,\n    &quot;chatAvailableCondition&quot;: &quot;NONE&quot;, &quot;minFollowerMinute&quot;: 0,\n    &quot;allowSubscriberInFollowerMode&quot;: true,\n    &quot;chatSlowModeSec&quot;: 0, &quot;chatEmojiMode&quot;: false,\n    &quot;chatDonationRankingExposure&quot;: true,\n    &quot;dropsCampaignNo&quot;: null,\n    &quot;liveTokenList&quot;: [&quot;&lt;base64 token&gt;&quot;],\n    &quot;watchPartyNo&quot;: null, &quot;watchPartyTag&quot;: null, &quot;watchPartyType&quot;: null,\n    &quot;playerRecommendContent&quot;: { &quot;categoryLives&quot;: [], &quot;channelLatestVideos&quot;: [] }\n  }\n}</code></pre></div>\n</details>\n<h3 id=\"폴링-주기\">폴링 주기<a class=\"anchor\" href=\"#/modules/live@폴링-주기\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>livePollingStatusJson</code> 을 파싱하면 <code>callPeriodMilliSecond</code> 가 있습니다. 관측값은 10000ms입니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import json\nperiod = json.loads(content[&quot;livePollingStatusJson&quot;])[&quot;callPeriodMilliSecond&quot;] / 1000</code></pre></div>\n<p>이보다 자주 호출하면 IP 차단으로 이어질 수 있습니다.</p>\n<h3 id=\"accumulatecount-는-무효-필드입니다\">accumulateCount 는 무효 필드입니다<a class=\"anchor\" href=\"#/modules/live@accumulatecount-는-무효-필드입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>이름은 누적 시청자 수를 뜻하지만 <code>live-status</code> 와 <code>live-detail</code> 양쪽 모두 0으로 관측됐습니다. 엔드포인트에 따른 차이가 아니라 필드 자체가 채워지지 않습니다.</p>\n<p>누적 시청자 수가 필요한 경우 아래 방법을 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>시점</th><th>방법</th></tr></thead><tbody><tr><td>방송 종료 후</td><td>VOD의 <code>livePv</code> (<a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체 참조</a>)</td></tr><tr><td>방송 중</td><td><code>concurrentUserCount</code> 를 주기적으로 조회하여 직접 집계</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"라이브-상세-조회\">라이브 상세 조회<a class=\"anchor\" href=\"#/modules/live@라이브-상세-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>방송의 상세 정보와 재생 정보를 조회할 수 있습니다.</p>\n<p>경로 버전이 <code>v3.3</code> 입니다. 공개 라이브러리에 알려진 v2는 구버전입니다. (<a href=\"#/reference/deprecated\" data-nav>제외된 API 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v3.3/channels/{channelId}/live-detail</strong></td><td>라이브 상세 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>cu · dt · tm</td><td>String</td><td>optional</td><td>캐시 무효화 또는 통계용으로 보이며 생략 가능한 것으로 관측</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<p><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a>의 필드에 재생 정보가 추가됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>livePlaybackJson</td><td>String</td><td>재생 정보. 문자열로 감싸진 JSON (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</td></tr></tbody></table></div>\n<h3 id=\"concurrentusercount-가-두-api에서-다릅니다\">concurrentUserCount 가 두 API에서 다릅니다<a class=\"anchor\" href=\"#/modules/live@concurrentusercount-가-두-api에서-다릅니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>같은 시점에 두 API를 호출했을 때 값이 달랐습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>엔드포인트</th><th>관측값</th></tr></thead><tbody><tr><td><code>polling/v3.1/.../live-status</code></td><td>1926</td></tr><tr><td><code>service/v3.3/.../live-detail</code></td><td>4866</td></tr></tbody></table></div>\n<p>캡처 시점 차이일 가능성이 있으나 확인되지 않았습니다. 시계열로 축적하는 경우 한쪽 API로 통일하는 편이 안전하며, 폴링 비용이 낮은 <code>live-status</code> 를 권장합니다.</p>\n<hr>\n<h2 id=\"ab-테스트-배정-조회\">A/B 테스트 배정 조회<a class=\"anchor\" href=\"#/modules/live@ab-테스트-배정-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>웹 클라이언트의 A/B 테스트 배정을 조회합니다.<br>경로 이름과 달리 라이브 상세 정보를 반환하지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /polling/live-detail</strong></td><td>A/B 테스트 배정 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>entityId</td><td>String</td><td>*</td><td>대상 식별자</td></tr><tr><td>abTestNoList</td><td>String</td><td>*</td><td>테스트 번호 목록. 콤마로 구분</td></tr></tbody></table></div>\n<p>실사용 가치는 낮으나 경로 이름이 <code>live-detail</code> 이라 혼동하기 쉬워 수록합니다. 라이브 상세 정보는 <a href=\"#/modules/live@라이브-상세-조회\" data-nav>라이브 상세 조회</a>에서 제공합니다.</p>\n<hr>\n<h2 id=\"광고\">광고<a class=\"anchor\" href=\"#/modules/live@광고\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>방송 중 광고 정보를 조회합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/lives/{liveId}/ads/current</strong></td><td>현재 광고 조회</td></tr><tr><td><strong>GET /service/v1/live/{liveId}/auto-play-info</strong></td><td>자동재생 정보 조회</td></tr></tbody></table></div>\n<p>경로만 확인했으며 파라미터와 응답은 검증되지 않았습니다.</p>\n<p>광고 표시 여부 자체는 <code>live-status</code> 의 <code>skipPreRollAd</code> 와 <code>my-info</code> 의 <code>playerAdFlag</code> 로도 확인할 수 있습니다. (<a href=\"#/modules/channel@내-정보-조회\" data-nav>내 정보 조회 참조</a>)</p>\n<p>상점과 후원 관련 광고는 <a href=\"#/modules/commerce@광고--유료상품\" data-nav>Commerce</a>에 있습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/live@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 3, "id": "이름과-기능이-다른-경로", "text": "이름과 기능이 다른 경로"}, {"level": 2, "id": "라이브-상태-조회", "text": "라이브 상태 조회"}, {"level": 3, "id": "폴링-주기", "text": "폴링 주기"}, {"level": 3, "id": "accumulatecount-는-무효-필드입니다", "text": "accumulateCount 는 무효 필드입니다"}, {"level": 2, "id": "라이브-상세-조회", "text": "라이브 상세 조회"}, {"level": 3, "id": "concurrentusercount-가-두-api에서-다릅니다", "text": "concurrentUserCount 가 두 API에서 다릅니다"}, {"level": 2, "id": "ab-테스트-배정-조회", "text": "A/B 테스트 배정 조회"}, {"level": 2, "id": "광고", "text": "광고"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/manage": {"title": "Manage", "html": "<h1 id=\"manage\">Manage<a class=\"anchor\" href=\"#/modules/manage@manage\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>스튜디오 API로 본인 채널의 방송 설정, 권한, 채팅 관리 정보, 시청자 목록, 콘텐츠 목록을 조회할 수 있습니다.<br>이 API를 호출하려면 본인 채널 또는 매니저 권한이 필요합니다.<br>방송 설정 변경, 제재 추가와 해제, 금지어 편집, 매니저 지정 등 서버 상태를 변경하는 동작은 수록하지 않았습니다. (<a href=\"#/reference/deprecated@읽기-전용-규칙으로-제외된-것\" data-nav>제외 목록 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com/manage/v1</code>. 일부 <code>v2</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/stats\" data-nav>Stats</a> · <a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/notification\" data-nav>Notification</a></td></tr></tbody></table></div>\n<p>채널 통계 3건은 별도 문서로 분리했습니다. (<a href=\"#/modules/stats\" data-nav>Stats</a>)</p>\n<hr>\n<h2 id=\"수록-범위\">수록 범위<a class=\"anchor\" href=\"#/modules/manage@수록-범위\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>스튜디오 캡처 315건에서 확인된 GET 경로 47개를 기준으로 합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>분류</th><th>건수</th><th>위치</th></tr></thead><tbody><tr><td>채널 통계</td><td>3</td><td><a href=\"#/modules/stats\" data-nav>Stats</a></td></tr><tr><td>알림 세션</td><td>1</td><td><a href=\"#/modules/notification@이벤트-세션-9종\" data-nav>Notification</a></td></tr><tr><td>이 문서</td><td>43</td><td>이름 확인 23건, <a href=\"#/modules/manage@미수록-경로\" data-nav>미수록 20건</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/manage@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><strong>방송 정보</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측 · 민감 정보</td><td><strong>GET /channels/{channelId}/streaming-info</strong></td><td><a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회</a></td></tr><tr><td>경로만 확인</td><td><strong>GET /channels/{channelId}/streams</strong></td><td>유효하나 실사용은 <code>streaming-info</code></td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/live-setting/normal</strong></td><td><a href=\"#/modules/manage@방송-설정-조회\" data-nav>방송 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/live-setting/chat</strong></td><td><a href=\"#/modules/manage@방송-설정-조회\" data-nav>방송 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/live-setting/chat-mode</strong></td><td><a href=\"#/modules/manage@방송-설정-조회\" data-nav>방송 설정 조회</a></td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/live-setting/chat-condition</strong></td><td><a href=\"#/modules/manage@방송-설정-조회\" data-nav>방송 설정 조회</a></td></tr></tbody></table></div>\n<p><strong>권한</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /channels/{channelId}/my-role</strong></td><td>내 역할 조회. <code>userRole</code>, <code>permissions</code></td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/my-status</strong></td><td>내 상태 조회</td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/streaming-roles</strong></td><td>매니저 목록 조회</td></tr><tr><td>실측</td><td><strong>GET /manage/v2/channels/{channelId}/center-status</strong></td><td>크리에이터 센터 상태 조회. v2</td></tr></tbody></table></div>\n<p><strong>채팅 관리</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /channels/{channelId}/chat-rules</strong></td><td>채팅 규칙 조회</td></tr><tr><td>실측</td><td><strong>GET /channels/{channelId}/chats/prohibit-words</strong></td><td>금지어 목록 조회</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/restrict-users</strong></td><td>활동 제한 사용자 조회</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/restrict-release-requests</strong></td><td>제한 해제 요청 조회</td></tr><tr><td>경로만 확인</td><td><strong>GET /channels/{channelId}/users/{targetId}/chat-activity-count</strong></td><td><a href=\"#/modules/manage@미포착-2건\" data-nav>미포착</a></td></tr></tbody></table></div>\n<p><strong>시청자</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/followers</strong></td><td>팔로워 목록 조회. 공개 API에는 없음</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/subscribers</strong></td><td>구독자 목록 조회</td></tr></tbody></table></div>\n<p><strong>콘텐츠</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/videos</strong></td><td>VOD 목록 조회. 비공개 포함</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/clips</strong></td><td>클립 목록 조회</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/clips/make-clips</strong></td><td>내가 만든 클립 조회</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/news-feeds</strong></td><td>뉴스피드 조회</td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/party/summary</strong></td><td>파티 요약 조회</td></tr></tbody></table></div>\n<p><strong>기타</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>경로만 확인</td><td><strong>GET /auto-complete/categories</strong></td><td><a href=\"#/modules/manage@미포착-2건\" da
