<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── Notion 디자인 토큰 (DESIGN-notion.md) · 라이트 전용 ──────────
   마케팅 사이트 실측값입니다. 다크 모드는 두지 않습니다. */
:root{
  /* Surface — 따뜻한 종이색 캔버스 위에 흰 카드 */
  --bg:#F6F5F4;          /* canvas-soft — 시그니처 페이지 바탕 */
  --surface:#FFFFFF;     /* canvas — 카드·표·사이드바 */
  --bg-soft:#ECEBE9;     /* 캔버스보다 한 단계 진한 채움 (인라인 코드·표 머리) */
  --line:#E6E6E6;        /* hairline */
  --line-soft:#EFEEED;

  /* Text */
  --ink:#0D0D0D;         /* ink — 검정 95% 알파를 흰 배경에 얹은 값 */
  --ink-2:#31302E;       /* ink-secondary — 따뜻한 차콜 */
  --ink-3:#615D59;       /* ink-muted — 스톤 */
  --ink-faint:#A39E98;   /* ink-faint — 애시. 캡션·플레이스홀더 */

  /* Accent — 구조를 칠하는 색은 이 파랑 하나뿐입니다.
     ⚠️ Notion 원본은 #0075DE 인데 따뜻한 종이색(#F6F5F4) 위에서 대비가
        4.19:1 로 본문 링크 기준(4.5:1)에 못 미칩니다. 색상은 그대로 두고
        명도만 낮춰 4.9:1 을 만들었습니다. 눌린 상태는 원본값 그대로입니다. */
  --accent:#0069C7;
  --accent-hover:#005BAB; /* primary-active */
  --accent-soft:#E7F2FD;
  --sel:#CFE6FB;

  /* 상태 마커 — Notion 마케팅에는 시맨틱 램프가 없고 "스티커 팔레트"가
     그 역할을 합니다. 스티커색은 장식용이라 흰 배경에서 12px 글자로 쓰기엔
     대비가 모자라, 같은 색상(hue)을 유지한 채 어둡게 조정했습니다. */
  --ok:#137A28;          /* accent-green  #1AAE39 를 어둡게 */
  --partial:#A34400;     /* accent-orange #DD5B00 를 어둡게 */
  --weak:#793400;        /* accent-orange-deep 그대로 */
  --guess:#615D59;       /* ink-muted — 추정은 색을 주지 않습니다 */
  --post:#1F7573;        /* accent-teal   #2A9D99 를 어둡게 */
  --auth:#391C57;        /* accent-purple-deep 그대로 */
  --star:#7A5200;        /* accent-brown  #523410 계열 */
  /* 🚨 Notion 팔레트에는 빨강이 없습니다. 스트림 키 노출 같은 안전 경고는
     경고로 읽혀야 하므로 팔레트 밖에서 하나 들였습니다. */
  --danger:#B3261E;
  --dead:#B3261E;

  /* Typography — NotionInter 는 Inter 의 자체 튜닝본이라 Inter 로 대체하고,
     한글은 Inter 에 없으므로 IBM Plex Sans KR 가 받습니다. */
  --sans:Inter,"IBM Plex Sans KR",-apple-system,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;

  /* Radius */
  --r-xs:4px; --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px;

  --sidebar:280px; --toc:220px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-feature-settings:"lnum","locl"}
::selection{background:var(--sel)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.searchbox{padding:20px 16px 12px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;padding:9px 11px;font:400 15px/1.33 var(--sans);
  color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xs)}
.searchbox input::placeholder{color:var(--ink-faint)}
.nav{overflow-y:auto;flex:1;padding:14px 12px 40px}
/* 그룹 헤더는 항목보다 **진해야** 구분됩니다. 예전에 ink-3 을 쓰는 바람에
   항목(ink-2)보다 연해서 폴더 경계가 안 보였습니다. */
.nav .group{display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;margin:20px 0 4px;padding:6px 10px;border:0;background:none;
  font:600 12px/1.33 var(--sans);letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink);text-align:left;cursor:pointer;border-radius:var(--r-sm)}
.nav .group:first-child{margin-top:4px}
.nav .group:hover{background:var(--bg-soft)}
.nav .group::after{content:"\25BE";font-size:11px;color:var(--ink-3);
  opacity:0;transition:transform .15s,opacity .15s}
.nav .group:hover::after,
.nav .group:focus-visible::after{opacity:1}
.nav .group[aria-expanded="false"]::after{opacity:1;transform:rotate(-90deg)}
.nav .group[aria-expanded="false"]+.grp{display:none}
.nav .grp{display:flex;flex-direction:column}
/* 파일 항목은 헤더(--ink)보다 한 단계 연하게 둡니다. 둘 다 진하면 폴더와
   파일이 같은 무게로 읽혀 계층이 사라집니다. */
.nav a{display:block;padding:6px 10px;border-radius:var(--r-sm);color:var(--ink-3);
  font-size:15px;line-height:1.33}
.nav a:hover{background:var(--line-soft);color:var(--ink-2);text-decoration:none}
.nav a.d1{padding-left:22px;font-size:14px;color:var(--ink-3)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) var(--toc)}
.doc{min-width:0;padding:44px 52px 120px;max-width:880px;margin-inline:auto}
.aside{padding:44px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;
  font-size:14px;line-height:1.43}
.aside .lbl{font:600 12px/1.33 var(--sans);letter-spacing:.125px;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:10px}
.aside a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);color:var(--ink-3)}
.aside a.l3{padding-left:22px}
.aside a:hover{color:var(--ink);text-decoration:none;border-left-color:var(--ink-3)}
.aside a.on{color:var(--accent);border-left-color:var(--accent)}

.doc h1{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;
  margin:0 0 20px;text-wrap:balance}
.doc h2{font-size:26px;font-weight:700;letter-spacing:-.625px;line-height:1.23;
  margin:56px 0 16px;padding-top:24px;border-top:1px solid var(--line);text-wrap:balance}
.doc h3{font-size:22px;font-weight:700;letter-spacing:-.25px;line-height:1.27;
  margin:32px 0 12px;text-wrap:balance}
.doc h4{font-size:20px;font-weight:600;letter-spacing:-.125px;line-height:1.4;
  margin:24px 0 10px;color:var(--ink-2)}
.doc h1+*,.doc h2+*,.doc h3+*{margin-top:0}
.doc p{margin:0 0 16px;max-width:68ch}
.doc ul,.doc ol{margin:0 0 16px;padding-left:24px;max-width:68ch}
.doc li{margin:6px 0}
.doc p>code,.doc li code,.doc td code,.doc th code,.doc h1 code,.doc h2 code,.doc h3 code,.doc h4 code{
  font:500 .86em/1.5 var(--mono);background:var(--bg-soft);border:1px solid var(--line-soft);
  padding:1.5px 5px;border-radius:var(--r-xs)}
.doc hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.anchor{margin-left:9px;color:var(--ink-3);opacity:0;font-weight:400;font-size:.7em}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1}
.anchor:hover{text-decoration:none;color:var(--accent)}

.table-wrap{overflow-x:auto;margin:0 0 24px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.33}
thead{background:var(--bg-soft)}
thead.th-empty{display:none}
th{text-align:left;font-weight:600;color:var(--ink-2);padding:11px 14px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px;letter-spacing:.125px}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;
  font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg-soft)}
.doc td code,.doc th code{font-size:12.5px}
td code{white-space:pre-wrap;word-break:break-word}
.cell-marker{white-space:nowrap;width:1%}

.chip{display:inline-block;font-size:12px;line-height:1.33;padding:3px 5px;border-radius:var(--r-sm);
  border:1px solid currentColor;margin-right:3px}
.chip-ok{color:var(--ok)} .chip-partial{color:var(--partial)} .chip-weak{color:var(--weak)}
.chip-guess{color:var(--guess)} .chip-post{color:var(--post)} .chip-auth{color:var(--auth)}
.chip-danger{color:var(--danger)} .chip-star{color:var(--star)} .chip-dead{color:var(--dead)}
.method{font-weight:600;letter-spacing:.03em;font-size:.92em}
.m-get{color:var(--ok)} .m-post{color:var(--post)} .m-wss,.m-ws{color:var(--accent)}
.m-put{color:var(--partial)} .m-delete{color:var(--danger)}

.code{position:relative;margin:0 0 24px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--bg-soft);overflow:hidden}
.code pre{margin:0;padding:14px 16px;overflow-x:auto}
.code code{font:400 12.8px/1.7 var(--mono);color:var(--ink);white-space:pre}
.code-lang{position:absolute;top:0;right:0;font:500 10px/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);background:var(--line-soft);
  padding:5px 8px;border-bottom-left-radius:6px}
blockquote{margin:0 0 20px;padding:14px 18px;background:var(--bg-soft);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r-lg) var(--r-lg) 0}
blockquote>*:last-child{margin-bottom:0}
blockquote h2,blockquote h3{margin-top:0;border-top:0;padding-top:0;font-size:15px}
blockquote p{max-width:none}
blockquote .table-wrap{background:var(--surface)}
details{margin:0 0 24px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
summary{cursor:pointer;padding:11px 16px;font-size:13px;font-weight:500;color:var(--ink-2);
  user-select:none;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";display:inline-block;margin-right:8px;color:var(--ink-3);
  transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details[open] summary{border-bottom:1px solid var(--line)}
details>.code{margin:0;border:0;border-radius:0;background:transparent}

.results .hit{display:block;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2)}
.results .hit:hover{background:var(--line-soft);text-decoration:none}
.results .hit b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.results .hit span{font-size:12px;color:var(--ink-3)}
.results .none{padding:10px;font-size:14px;color:var(--ink-3)}
mark{background:var(--sel);color:inherit;border-radius:2px;padding:0 1px}

.topbar{display:none}
.footnav{display:flex;gap:12px;margin-top:60px;padding-top:22px;border-top:1px solid var(--line)}
.footnav a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);color:var(--ink)}
.footnav a:hover{border-color:var(--accent);text-decoration:none}
.footnav span{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.footnav .nx{text-align:right}

@media(max-width:1400px){.main{grid-template-columns:minmax(0,1fr)}.aside{display:none}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);
    transition:transform .2s}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:11px 16px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
  .topbar button{padding:6px 10px;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .doc{padding:28px 20px 90px}
  .doc h1{font-size:27px} .doc h2{font-size:20px}
}
</style>

    <article class="doc" id="doc"></article>

</div>

<script>
// 브라우저의 스크롤 복원이 앵커 이동을 덮습니다. 위치는 우리가 정합니다.
if("scrollRestoration" in history) history.scrollRestoration="manual";

// 사이트 이름은 위 <title> 태그가 유일한 출처입니다. 바꾸려면 거기만 고칩니다.
// go() 가 이동할 때마다 document.title 을 덮어쓰므로 최초 값을 먼저 잡아둡니다.
const TITLE=document.title;
const NAV=[{"kind": "link", "depth": 0, "label": "README", "page": "README", "frag": ""}, {"kind": "link", "depth": 0, "label": "CONTRIBUTING", "page": "CONTRIBUTING", "frag": ""}, {"kind": "group", "label": "core"}, {"kind": "link", "depth": 0, "label": "auth", "page": "core/auth", "frag": ""}, {"kind": "link", "depth": 0, "label": "base-urls", "page": "core/base-urls", "frag": ""}, {"kind": "link", "depth": 0, "label": "conventions", "page": "core/conventions", "frag": ""}, {"kind": "link", "depth": 0, "label": "headers", "page": "core/headers", "frag": ""}, {"kind": "group", "label": "modules"}, {"kind": "link", "depth": 0, "label": "channel", "page": "modules/channel", "frag": ""}, {"kind": "link", "depth": 0, "label": "chat", "page": "modules/chat", "frag": ""}, {"kind": "link", "depth": 0, "label": "clip", "page": "modules/clip", "frag": ""}, {"kind": "link", "depth": 0, "label": "comment", "page": "modules/comment", "frag": ""}, {"kind": "link", "depth": 0, "label": "commerce", "page": "modules/commerce", "frag": ""}, {"kind": "link", "depth": 0, "label": "discovery", "page": "modules/discovery", "frag": ""}, {"kind": "link", "depth": 0, "label": "live", "page": "modules/live", "frag": ""}, {"kind": "link", "depth": 0, "label": "manage", "page": "modules/manage", "frag": ""}, {"kind": "link", "depth": 0, "label": "notification", "page": "modules/notification", "frag": ""}, {"kind": "link", "depth": 0, "label": "stats", "page": "modules/stats", "frag": ""}, {"kind": "link", "depth": 0, "label": "user", "page": "modules/user", "frag": ""}, {"kind": "link", "depth": 0, "label": "video", "page": "modules/video", "frag": ""}, {"kind": "group", "label": "reference"}, {"kind": "link", "depth": 0, "label": "analytics", "page": "reference/analytics", "frag": ""}, {"kind": "link", "depth": 0, "label": "deprecated", "page": "reference/deprecated", "frag": ""}, {"kind": "link", "depth": 0, "label": "endpoints", "page": "reference/endpoints", "frag": ""}, {"kind": "link", "depth": 0, "label": "enums", "page": "reference/enums", "frag": ""}, {"kind": "group", "label": "_work"}, {"kind": "link", "depth": 0, "label": "step1-triage", "page": "_work/step1-triage", "frag": ""}, {"kind": "link", "depth": 0, "label": "step2-modules", "page": "_work/step2-modules", "frag": ""}], PAGES={"README": {"title": "치지직(CHZZK) 비공식 API 문서", "html": "<h1 id=\"치지직chzzk-비공식-api-문서\">치지직(CHZZK) 비공식 API 문서<a class=\"anchor\" href=\"#/README@치지직chzzk-비공식-api-문서\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>네이버 치지직 웹 프론트엔드가 사용하는 내부 API를 캡처하여 정리한 비공식 문서입니다.<br>공식 문서가 아니며, 네이버는 이 API들의 하위 호환성을 보장하지 않습니다.<br>상업적 서비스를 개발하는 경우 <a href=\"https://developers.chzzk.naver.com\" target=\"_blank\" rel=\"noopener\">치지직 개발자센터</a>의 공식 API를 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>수록 엔드포인트</td><td>115건. 이름 확인 95건 + <a href=\"#/modules/manage@미수록-경로\" data-nav>미확보 20건</a> (<a href=\"#/reference/endpoints\" data-nav>전체 목록</a>)</td></tr><tr><td>캡처 기준일</td><td>2026-07-25 (클립·웹) · 2026-07-29 (스튜디오·댓글)</td></tr><tr><td>범위</td><td>읽기 전용. <code>GET</code>, WebSocket 수신, <a href=\"#/reference/deprecated@예외--조회용-post-1건\" data-nav>조회용 <code>POST</code> 1건</a></td></tr><tr><td>인증</td><td>공개 조회는 불필요. 일부 API만 쿠키 필요 (<a href=\"#/core/auth\" data-nav>인증 참조</a>)</td></tr><tr><td>응답 봉투</td><td>3형이 혼재하며 성공 조건이 다릅니다 (<a href=\"#/core/conventions@응답-봉투\" data-nav>응답 봉투 참조</a>)</td></tr></tbody></table></div>\n<p>서버 상태를 변경하는 요청(<code>POST</code>, <code>PUT</code>, <code>DELETE</code>)은 수록하지 않았습니다. 방송 설정 변경, 제재 관리, 금지어 편집, 시청 이벤트 전송 등이 해당합니다. 제외 목록과 사유는 <a href=\"#/reference/deprecated\" data-nav>제외된 API</a>에 있습니다.</p>\n<hr>\n<h2 id=\"빠른-시작\">빠른 시작<a class=\"anchor\" href=\"#/README@빠른-시작\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>인증 없이 호출할 수 있습니다. 다만 커스텀 헤더가 없으면 상당수의 API가 실패합니다. (<a href=\"#/core/headers\" data-nav>필수 헤더 참조</a>)</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import requests\n\nBASE = &quot;https://api.chzzk.naver.com&quot;\nHEADERS = {\n    &quot;Accept&quot;: &quot;application/json&quot;,\n    &quot;User-Agent&quot;: &quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36&quot;,\n    &quot;Origin&quot;: &quot;https://chzzk.naver.com&quot;,\n    &quot;Referer&quot;: &quot;https://chzzk.naver.com/&quot;,\n    &quot;front-client-platform-type&quot;: &quot;PC&quot;,\n    &quot;front-client-product-type&quot;: &quot;web&quot;,\n    &quot;deviceId&quot;: &quot;00000000-0000-4000-8000-000000000000&quot;,  # UUID v4 하나를 고정해 사용\n}\n\ncid = &quot;&lt;32자 channelId&gt;&quot;\n\n# 채널 기본 정보\nch = requests.get(f&quot;{BASE}/service/v1/channels/{cid}&quot;, headers=HEADERS).json()\nprint(ch[&quot;content&quot;][&quot;channelName&quot;], ch[&quot;content&quot;][&quot;followerCount&quot;])\n\n# 라이브 상태\nst = requests.get(\n    f&quot;{BASE}/polling/v3.1/channels/{cid}/live-status&quot;,\n    params={&quot;includePlayerRecommendContent&quot;: &quot;false&quot;}, headers=HEADERS,\n).json()\nprint(st[&quot;content&quot;][&quot;status&quot;], st[&quot;content&quot;][&quot;concurrentUserCount&quot;])</code></pre></div>\n<hr>\n<h2 id=\"오류-처리\">오류 처리<a class=\"anchor\" href=\"#/README@오류-처리\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>HTTP 상태 코드가 200이어도 실패일 수 있습니다. 응답 봉투 안의 코드로 판정합니다.<br>호스트마다 봉투 형태와 성공 조건이 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>봉투</th><th>호스트</th><th>성공 조건</th><th>실패 시</th></tr></thead><tbody><tr><td>A형</td><td><code>api.chzzk.naver.com</code> · <code>comm-api</code> · <code>nng_comment_api</code></td><td><code>code == 200</code></td><td><code>message</code> 에 사유</td></tr><tr><td>B형</td><td><code>creatorhub-api.naver.com</code></td><td><code>header.code == 0</code></td><td><code>header.message</code> 에 사유</td></tr><tr><td>XML</td><td><code>apis.naver.com/neonplayer</code></td><td>봉투 없음 (DASH MPD)</td><td>—</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def unwrap(resp):\n    j = resp.json()\n    if &quot;content&quot; in j:                      # A형\n        if j.get(&quot;code&quot;) != 200:\n            raise RuntimeError(f&#x27;code={j.get(&quot;code&quot;)} {j.get(&quot;message&quot;)}&#x27;)\n        return j[&quot;content&quot;]\n    if &quot;body&quot; in j:                         # B형\n        if j.get(&quot;header&quot;, {}).get(&quot;code&quot;) != 0:\n            raise RuntimeError(j[&quot;header&quot;].get(&quot;message&quot;))\n        return j[&quot;body&quot;]\n    raise RuntimeError(&quot;unknown envelope&quot;)</code></pre></div>\n<p>봉투가 성공을 반환하면서 내용이 비어 있는 경우가 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>상황</th><th>판정 방법</th></tr></thead><tbody><tr><td>존재하지 않는 채널</td><td><code>code: 200</code> 이면서 <code>channelId</code> 가 <code>null</code> (<a href=\"#/modules/channel@채널-기본-정보-조회\" data-nav>참조</a>)</td></tr><tr><td>데이터가 없는 스튜디오 통계</td><td>빈 배열 또는 <code>null</code> (<a href=\"#/modules/stats@미확인--일별-배열-항목-구조\" data-nav>참조</a>)</td></tr><tr><td>쿠키 만료</td><td>HTTP 401이 아니라 <code>loggedIn: false</code> (<a href=\"#/modules/user@로그인-상태-조회\" data-nav>참조</a>)</td></tr></tbody></table></div>\n<p>전체 규약은 <a href=\"#/core/conventions@응답-봉투\" data-nav>응답 봉투</a>에 있습니다.</p>\n<hr>\n<h2 id=\"요청-제한\">요청 제한<a class=\"anchor\" href=\"#/README@요청-제한\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>공식적으로 문서화된 rate limit은 없습니다. 아래는 관측값과 안전 마진을 기준으로 한 권장 사항입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>상황</th><th>권장</th></tr></thead><tbody><tr><td>방송 중 라이브 폴링</td><td>응답의 <code>livePollingStatusJson.callPeriodMilliSecond</code> 를 따름. 관측값 10000ms</td></tr><tr><td>대량 수집 (클립·VOD·채팅)</td><td>요청 사이에 간격을 둠. 배치 작업이라도 몰아서 호출하면 IP 차단 위험</td></tr><tr><td>재시도</td><td><code>429</code> 와 <code>5xx</code> 에만 지수 백오프. 나머지 <code>4xx</code> 는 재시도해도 결과가 같음</td></tr></tbody></table></div>\n<p>권장 주기보다 자주 호출하면 IP 차단이나 계정 보호조치로 이어질 수 있습니다. <a href=\"#/modules/clip@클립-뷰어-카드-조회\" data-nav>클립 뷰어 카드 조회</a>는 벌크 조회가 없어 클립 한 개당 한 번씩 호출해야 하므로 특히 주의가 필요합니다.</p>\n<hr>\n<h2 id=\"민감-정보\">민감 정보<a class=\"anchor\" href=\"#/README@민감-정보\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>아래 값은 공유하거나 저장소에 커밋해서는 안 됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>값</th><th>출처</th><th>위험</th></tr></thead><tbody><tr><td>streamKey · streamUrl</td><td><a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회</a></td><td>제3자가 해당 채널로 송출 가능</td></tr><tr><td>accTkn</td><td><a href=\"#/modules/chat@액세스-토큰-발급\" data-nav>액세스 토큰 발급</a></td><td>채팅 계정 도용</td></tr><tr><td>liveTokenList</td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td><td>시청 이벤트 위조</td></tr><tr><td>extraToken</td><td><a href=\"#/modules/chat@extras\" data-nav>채팅 메시지 extras</a></td><td>시청 이벤트 위조</td></tr><tr><td>Socket.IO auth</td><td><a href=\"#/modules/notification@알림-소켓-url-발급\" data-nav>알림 소켓 URL 발급</a></td><td>개인 알림 수신</td></tr><tr><td>NID_AUT · NID_SES</td><td>브라우저 쿠키</td><td>계정 자격증명</td></tr></tbody></table></div>\n<p>크롬의 sanitized HAR 내보내기는 쿠키와 요청 헤더만 제거하며 응답 본문은 지우지 않습니다. 스튜디오 화면을 캡처하면 <code>streamKey</code> 가 평문으로 HAR에 남습니다. HAR을 공유하거나 커밋하기 전에 응답 본문까지 제거하는 별도 스크럽이 필요합니다.</p>\n<p>댓글과 채팅 응답에는 다른 이용자의 닉네임과 <code>userIdHash</code> 가 포함됩니다. 수집·보관 시 개인정보 취급에 유의합니다.</p>\n<hr>\n<h2 id=\"이름과-기능이-다른-엔드포인트\">이름과 기능이 다른 엔드포인트<a class=\"anchor\" href=\"#/README@이름과-기능이-다른-엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로 이름만으로 기능을 판단하면 잘못된 API를 호출하게 되는 경우가 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>실제 기능</th></tr></thead><tbody><tr><td><code><span class=\"method m-post\">POST</span> /service/live-status</code></td><td>라이브 상태가 아니라 행동 로그 수집기. 이 문서에서 제외</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /polling/live-detail</code></td><td>라이브 상세가 아니라 <a href=\"#/modules/live@ab-테스트-배정-조회\" data-nav>A/B 테스트 배정 조회</a></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /polling/v3.1/.../live-status</code></td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v3.3/.../live-detail</code></td><td><a href=\"#/modules/live@라이브-상세-조회\" data-nav>라이브 상세 조회</a></td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/personal/session-url</code></td><td>개인 데이터가 아니라 <a href=\"#/modules/notification@알림-소켓-url-발급\" data-nav>알림 소켓 URL 발급</a></td></tr><tr><td><code>wss://ssio{N}.nchat.naver.com</code></td><td>채팅이 아니라 <a href=\"#/modules/notification\" data-nav>개인 알림 채널</a></td></tr></tbody></table></div>\n<p>정정 내역 전체는 <a href=\"#/reference/deprecated@잘못-알려져-있던-사실\" data-nav>정정된 사실</a>에 있습니다.</p>\n<hr>\n<h2 id=\"문서-구성\">문서 구성<a class=\"anchor\" href=\"#/README@문서-구성\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><strong>요청 규약</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>문서</th><th>내용</th></tr></thead><tbody><tr><td><a href=\"#/core/base-urls\" data-nav>Base URL</a></td><td>호스트 7종과 용도</td></tr><tr><td><a href=\"#/core/headers\" data-nav>필수 요청 헤더</a></td><td>커스텀 헤더. 없으면 상당수가 실패</td></tr><tr><td><a href=\"#/core/conventions\" data-nav>공통 규칙</a></td><td>응답 봉투 3형, 페이지네이션 3종, 식별자</td></tr><tr><td><a href=\"#/core/auth\" data-nav>인증</a></td><td>쿠키 인증과 권한 3단계</td></tr></tbody></table></div>\n<p><strong>기능 모듈</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>문서</th><th>건수</th><th>내용</th></tr></thead><tbody><tr><td><a href=\"#/modules/channel\" data-nav>Channel</a></td><td>15</td><td>채널 조회, 부가 데이터, 팔로잉</td></tr><tr><td><a href=\"#/modules/live\" data-nav>Live</a></td><td>5</td><td>라이브 상세·상태, 폴링</td></tr><tr><td><a href=\"#/modules/video\" data-nav>Video</a></td><td>3</td><td>VOD 상세, 다시보기 채팅, 재생 매니페스트</td></tr><tr><td><a href=\"#/modules/clip\" data-nav>Clip</a></td><td>6</td><td>클립 목록·상세·벌크, 원본 영상 매핑</td></tr><tr><td><a href=\"#/modules/comment\" data-nav>Comment</a></td><td>4</td><td>댓글, 대댓글, 스티커</td></tr><tr><td><a href=\"#/modules/chat\" data-nav>Chat</a></td><td>3</td><td>실시간 채팅. 수신 전용</td></tr><tr><td><a href=\"#/modules/notification\" data-nav>Notification</a></td><td>4</td><td>개인 알림 소켓, 이벤트 세션 9종</td></tr><tr><td><a href=\"#/modules/discovery\" data-nav>Discovery</a></td><td>11</td><td>홈, 카테고리, 배너, 검색</td></tr><tr><td><a href=\"#/modules/commerce\" data-nav>Commerce</a></td><td>12</td><td>후원, 미션, 상점, 광고</td></tr><tr><td><a href=\"#/modules/user\" data-nav>User</a></td><td>6</td><td>사용자 상태, 차단, 배지</td></tr><tr><td><a href=\"#/modules/manage\" data-nav>Manage</a></td><td>43</td><td>스튜디오 조회. 본인 채널 권한 필요</td></tr><tr><td><a href=\"#/modules/stats\" data-nav>Stats</a></td><td>3</td><td>채널 통계. 본인 채널 권한 필요</td></tr></tbody></table></div>\n<p>각 모듈은 엔드포인트마다 같은 순서로 작성합니다. HTTP Request, Request Param, Response Body, 예제 순입니다.</p>\n<p><strong>레퍼런스</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>문서</th><th>내용</th></tr></thead><tbody><tr><td><a href=\"#/reference/endpoints\" data-nav>엔드포인트 전체 목록</a></td><td>115건 평면 인덱스. 경로로 찾을 때 사용</td></tr><tr><td><a href=\"#/reference/enums\" data-nav>Enum 레퍼런스</a></td><td>확인된 Enum 전량</td></tr><tr><td><a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a></td><td>본인 채널과 타 채널의 수집 방법</td></tr><tr><td><a href=\"#/reference/deprecated\" data-nav>제외된 API · 정정된 사실</a></td><td>제외 23건, 정정 7건</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"목적별-진입점\">목적별 진입점<a class=\"anchor\" href=\"#/README@목적별-진입점\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>목적</th><th>문서</th></tr></thead><tbody><tr><td>시청자 수 추적</td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a>, <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a></td></tr><tr><td>채팅 로그 전량 수집</td><td><a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 조회</a>. WebSocket 불필요</td></tr><tr><td>실시간 채팅 수신</td><td><a href=\"#/modules/chat\" data-nav>Chat</a></td></tr><tr><td>클립의 원본 방송 위치</td><td><a href=\"#/modules/clip@클립-뷰어-카드-조회\" data-nav>클립 뷰어 카드 조회</a></td></tr><tr><td>채널 개설일과 누적 방송시간</td><td><a href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav>채널 부가 데이터 조회</a></td></tr><tr><td>본인 채널 시계열 통계</td><td><a href=\"#/modules/stats\" data-nav>Stats</a></td></tr><tr><td>타 채널 분석</td><td><a href=\"#/reference/analytics@트랙-b--타-채널\" data-nav>트랙 B</a></td></tr><tr><td>후원 알림 오버레이</td><td><a href=\"#/modules/notification\" data-nav>Notification</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"상태-표기\">상태 표기<a class=\"anchor\" href=\"#/README@상태-표기\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>각 엔드포인트에는 확인 수준을 함께 적습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>표기</th><th>의미</th></tr></thead><tbody><tr><td>실측</td><td>경로, 파라미터, 응답을 모두 확인</td></tr><tr><td>스키마 미상</td><td>경로와 인증은 확정. 응답 스키마는 빈 배열이나 <code>null</code> 로만 관측</td></tr><tr><td>경로만 확인</td><td>파라미터 미검증</td></tr><tr><td>추정</td><td>실측 근거 없음</td></tr><tr><td>조회용 POST</td><td>메서드는 <code>POST</code> 이나 서버 상태를 변경하지 않음</td></tr></tbody></table></div>\n<p>인증이 필요한 API에는 인증 필요, 민감 정보를 포함하는 응답에는 민감 정보 포함을 함께 적습니다.</p>\n<hr>\n<h2 id=\"주의-사항\">주의 사항<a class=\"anchor\" href=\"#/README@주의-사항\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>비공식 API입니다. 네이버가 사용을 허가한 것이 아니며 예고 없이 변경될 수 있습니다. 응답 파싱은 필드 누락에 관대하게 작성하는 편이 안전합니다.</p>\n<h2 id=\"참고\">참고<a class=\"anchor\" href=\"#/README@참고\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<ul><li><a href=\"https://chzzk.gitbook.io/chzzk\" target=\"_blank\" rel=\"noopener\">치지직 공식 개발자 문서</a></li><li><a href=\"https://github.com/dokdo2013/awesome-chzzk\" target=\"_blank\" rel=\"noopener\">awesome-chzzk</a></li><li><a href=\"https://github.com/kimcore/chzzk\" target=\"_blank\" rel=\"noopener\">kimcore/chzzk</a> · <a href=\"https://github.com/gunyu1019/chzzkpy\" target=\"_blank\" rel=\"noopener\">gunyu1019/chzzkpy</a> · <a href=\"https://github.com/R2turnTrue/chzzk4j\" target=\"_blank\" rel=\"noopener\">R2turnTrue/chzzk4j</a></li></ul>\n<h2 id=\"문서에-기여하기\">문서에 기여하기<a class=\"anchor\" href=\"#/README@문서에-기여하기\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>새 엔드포인트를 추가하거나 오류를 수정할 때는 <a href=\"#/CONTRIBUTING\" data-nav>문서 규약</a>을 따릅니다.</p>", "toc": [{"level": 2, "id": "빠른-시작", "text": "빠른 시작"}, {"level": 2, "id": "오류-처리", "text": "오류 처리"}, {"level": 2, "id": "요청-제한", "text": "요청 제한"}, {"level": 2, "id": "민감-정보", "text": "민감 정보"}, {"level": 2, "id": "이름과-기능이-다른-엔드포인트", "text": "이름과 기능이 다른 엔드포인트"}, {"level": 2, "id": "문서-구성", "text": "문서 구성"}, {"level": 2, "id": "목적별-진입점", "text": "목적별 진입점"}, {"level": 2, "id": "상태-표기", "text": "상태 표기"}, {"level": 2, "id": "주의-사항", "text": "주의 사항"}, {"level": 2, "id": "참고", "text": "참고"}, {"level": 2, "id": "문서에-기여하기", "text": "문서에 기여하기"}]}, "CONTRIBUTING": {"title": "문서 규약", "html": "<h1 id=\"문서-규약\">문서 규약<a class=\"anchor\" href=\"#/CONTRIBUTING@문서-규약\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>이 문서를 수정하거나 새 엔드포인트를 추가할 때 따르는 규약입니다.</p>\n<hr>\n<h2 id=\"상태-표기\">상태 표기<a class=\"anchor\" href=\"#/CONTRIBUTING@상태-표기\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>확인 수준을 표기합니다. 추정과 확인된 사실이 섞이지 않도록 하는 장치이므로, 새 항목을 추가할 때도 반드시 하나를 붙입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>표기</th><th>의미</th></tr></thead><tbody><tr><td>실측</td><td>경로, 파라미터, 응답을 모두 확인</td></tr><tr><td>스키마 미상</td><td>경로와 인증은 확정. 응답 스키마는 빈 배열이나 <code>null</code> 로만 관측</td></tr><tr><td>경로만 확인</td><td>파라미터 미검증</td></tr><tr><td>추정</td><td>실측 근거 없음</td></tr><tr><td>조회용 POST</td><td>메서드는 <code>POST</code> 이나 서버 상태를 변경하지 않음</td></tr></tbody></table></div>\n<p>인증이 필요한 API에는 인증 필요, 민감 정보를 포함하는 응답에는 민감 정보 포함을 함께 적습니다.</p>\n<hr>\n<h2 id=\"작성-규칙\">작성 규칙<a class=\"anchor\" href=\"#/CONTRIBUTING@작성-규칙\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>엔드포인트는 정본 한 곳에만 상세히 쓰고 나머지 문서에서는 링크로 참조합니다. 같은 내용을 여러 곳에 쓰면 한쪽만 수정되면서 문서 간에 값이 어긋납니다.</p>\n<p>링크는 상대경로로 씁니다. <code>§6.4</code> 같은 절 번호 참조는 문서를 재편할 때마다 깨지므로 사용하지 않습니다.</p>\n<p>제목 맨 앞에는 이모지를 두지 않습니다. 일부 마크다운 렌더러가 앵커를 <code>#-제목</code> 형태로 만들어 다른 문서에서 건 링크가 깨집니다.</p>\n<p>실측 근거가 없는 내용은 추정임을 밝히고 그 근거를 함께 적습니다. 이 문서는 잘못 알려진 통념을 실측으로 바로잡는 것을 목적으로 합니다.</p>\n<p>새 엔드포인트를 추가하면 <a href=\"#/reference/endpoints\" data-nav>엔드포인트 전체 목록</a>도 함께 갱신합니다. 이 표는 손으로 관리하며, 이 저장소에서 엔드포인트를 찾는 경로는 이 색인 하나뿐입니다. 헤더의 건수 집계도 함께 수정합니다.</p>\n<hr>\n<h2 id=\"문서-어투\">문서 어투<a class=\"anchor\" href=\"#/CONTRIBUTING@문서-어투\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>치지직 <a href=\"https://chzzk.gitbook.io/chzzk\" target=\"_blank\" rel=\"noopener\">공식 개발자 문서</a>의 서술 방식을 따릅니다.</p>\n<ul><li>각 API는 <code>~을 조회할 수 있습니다</code> 형태의 한 문장으로 시작합니다.</li><li>동작을 설명할 때는 <code>~합니다</code>, <code>~됩니다</code> 를 씁니다. 독자에게 지시하는 문장은 쓰지 않습니다.</li><li>강조를 위한 이모지나 굵은 글씨를 남용하지 않습니다. 사실을 그대로 서술합니다.</li><li>표는 <code>HTTP Request</code>, <code>Request Param</code>, <code>Response Body</code> 순으로 배치합니다.</li><li><code>required</code> 칸에는 필수면 <code>*</code>, 선택이면 <code>optional</code> 을 적습니다.</li><li>중첩 필드는 들여쓰기 대신 전체 경로로 적습니다. 예: <code>card.content.extraLinks</code></li></ul>\n<p>한 문단 안에서 문장을 줄로 나눌 때는 줄 끝에 백슬래시를 붙입니다.</p>\n<hr>\n<h2 id=\"캡처-자료를-다룰-때\">캡처 자료를 다룰 때<a class=\"anchor\" href=\"#/CONTRIBUTING@캡처-자료를-다룰-때\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>크롬의 sanitized HAR 내보내기는 쿠키와 요청 헤더만 제거하며 응답 본문은 지우지 않습니다. <code>streamKey</code>, <code>accTkn</code>, <code>liveTokenList</code> 같은 값은 모두 응답 본문에 있으므로, HAR을 공유하거나 커밋하기 전에 응답 본문까지 제거하는 별도 스크럽이 필요합니다.</p>\n<p>댓글과 채팅 응답에는 다른 이용자의 닉네임과 <code>userIdHash</code> 가 포함됩니다. 예시로 옮길 때는 치환합니다.</p>\n<p>실제 값을 예시에서 발견하면 플레이스홀더로 치환합니다.</p>\n<hr>\n<h2 id=\"사이트-생성\">사이트 생성<a class=\"anchor\" href=\"#/CONTRIBUTING@사이트-생성\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>문서를 수정한 뒤에는 사이트를 다시 생성합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">bash</span><pre><code class=\"lang-bash\">python book/build.py\npython book/check-links.py</code></pre></div>\n<p><code>book/site.html</code> 은 생성물이므로 직접 수정하지 않습니다. 내용은 <code>docs/</code> 의 <code>.md</code> 를, 겉모습은 <code>book/template.html</code> 을 수정합니다. <code>docs/SUMMARY.md</code> 도 생성물입니다. 목차는 디렉터리 구조에서 만들어지므로 손으로 고치지 않습니다.</p>", "toc": [{"level": 2, "id": "상태-표기", "text": "상태 표기"}, {"level": 2, "id": "작성-규칙", "text": "작성 규칙"}, {"level": 2, "id": "문서-어투", "text": "문서 어투"}, {"level": 2, "id": "캡처-자료를-다룰-때", "text": "캡처 자료를 다룰 때"}, {"level": 2, "id": "사이트-생성", "text": "사이트 생성"}]}, "core/auth": {"title": "인증", "html": "<h1 id=\"인증\">인증<a class=\"anchor\" href=\"#/core/auth@인증\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>공개 조회 API는 인증이 필요하지 않습니다.<br>일부 API만 네이버 통합 로그인 쿠키를 요구합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>공개 조회</td><td>인증 불필요. 채널, 라이브, VOD, 클립, 댓글</td></tr><tr><td>인증 방식</td><td>네이버 통합 로그인 쿠키 2개</td></tr><tr><td>관련 문서</td><td><a href=\"#/core/base-urls\" data-nav>Base URL</a> · <a href=\"#/core/headers\" data-nav>필수 요청 헤더</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"쿠키\">쿠키<a class=\"anchor\" href=\"#/core/auth@쿠키\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"code\"><span class=\"code-lang\">http</span><pre><code class=\"lang-http\">Cookie: NID_AUT=&lt;value&gt;; NID_SES=&lt;value&gt;</code></pre></div>\n<p><code>chzzk.naver.com</code> 에 로그인한 뒤 개발자 도구의 Application 탭에서 Cookies 항목의 두 값을 확인할 수 있습니다.</p>\n<p>두 쿠키는 네이버 통합 로그인 세션이며 계정 자격증명과 같은 수준의 민감 정보입니다.</p>\n<hr>\n<h2 id=\"권한-3단계\">권한 3단계<a class=\"anchor\" href=\"#/core/auth@권한-3단계\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>단계</th><th>필요 조건</th><th>대상</th></tr></thead><tbody><tr><td>공개</td><td>없음</td><td>채널, 라이브, VOD, 클립, 댓글 조회</td></tr><tr><td>로그인</td><td>쿠키</td><td><code>my-info</code>, <code>followings</code>, <code>getUserStatus</code>, 채팅 토큰, 차단 목록, 알림</td></tr><tr><td>채널 권한</td><td>쿠키 + 본인 채널 또는 매니저</td><td><code>manage/*</code> 전체, <code>stats/*</code></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"모듈별-요구-수준\">모듈별 요구 수준<a class=\"anchor\" href=\"#/core/auth@모듈별-요구-수준\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>모듈</th><th>공개</th><th>로그인</th><th>채널 권한</th></tr></thead><tbody><tr><td><a href=\"#/modules/channel\" data-nav>Channel</a></td><td>13</td><td>3</td><td></td></tr><tr><td><a href=\"#/modules/live\" data-nav>Live</a></td><td>5</td><td></td><td></td></tr><tr><td><a href=\"#/modules/video\" data-nav>Video</a></td><td>3</td><td></td><td></td></tr><tr><td><a href=\"#/modules/clip\" data-nav>Clip</a></td><td>6</td><td></td><td></td></tr><tr><td><a href=\"#/modules/comment\" data-nav>Comment</a></td><td>4</td><td></td><td></td></tr><tr><td><a href=\"#/modules/chat\" data-nav>Chat</a></td><td></td><td>3</td><td></td></tr><tr><td><a href=\"#/modules/notification\" data-nav>Notification</a></td><td></td><td>3</td><td>1 (<code>alerts/*</code>)</td></tr><tr><td><a href=\"#/modules/discovery\" data-nav>Discovery</a></td><td>11</td><td></td><td></td></tr><tr><td><a href=\"#/modules/commerce\" data-nav>Commerce</a></td><td>12</td><td></td><td></td></tr><tr><td><a href=\"#/modules/user\" data-nav>User</a></td><td>2</td><td>4</td><td></td></tr><tr><td><a href=\"#/modules/manage\" data-nav>Manage</a></td><td></td><td></td><td>43</td></tr><tr><td><a href=\"#/modules/stats\" data-nav>Stats</a></td><td></td><td></td><td>3</td></tr></tbody></table></div>\n<p>합계가 모듈별 엔드포인트 수와 다를 수 있습니다. 일부 엔드포인트는 비로그인 상태에서도 응답하지만 필드가 비어서 반환됩니다.</p>\n<hr>\n<h2 id=\"확인된-권한-값\">확인된 권한 값<a class=\"anchor\" href=\"#/core/auth@확인된-권한-값\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>로그인 상태에서 <code>my-info</code> 와 <code>my-role</code> 응답에 포함됩니다.</p>\n<p><code>userRole</code> 은 <code>USER</code> 와 <code>STREAMER</code> 두 값이 확인됐습니다.</p>\n<p><code>permissions</code> 는 스트리머 본인일 때 반환됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>값</th><th>의미</th></tr></thead><tbody><tr><td>CHANNEL_MANAGE</td><td>채널 설정</td></tr><tr><td>LIVE_CREATE</td><td>방송 시작</td></tr><tr><td>CHAT_MANAGE</td><td>채팅 관리</td></tr><tr><td>CHAT_BLIND</td><td>채팅 블라인드</td></tr><tr><td>VIDEO_DELETE</td><td>VOD 삭제</td></tr><tr><td>VIDEO_HIDE</td><td>VOD 숨김</td></tr><tr><td>SETTLEMENT_MANAGE</td><td>정산</td></tr><tr><td>PAID_WATCH_PARTY_SOURCE_PLAY</td><td>유료 워치파티</td></tr></tbody></table></div>\n<p>이 문서는 읽기 전용 API만 다루므로 위 권한 중 실제로 사용되는 것은 조회 범위 판정뿐입니다.</p>\n<hr>\n<h2 id=\"민감-정보\">민감 정보<a class=\"anchor\" href=\"#/core/auth@민감-정보\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>아래 값은 공유하거나 저장소에 커밋해서는 안 됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>값</th><th>출처</th></tr></thead><tbody><tr><td>NID_AUT · NID_SES</td><td>브라우저 쿠키</td></tr><tr><td>accTkn</td><td><a href=\"#/modules/chat@액세스-토큰-발급\" data-nav>액세스 토큰 발급</a></td></tr><tr><td>streamKey · streamUrl</td><td><a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회</a></td></tr><tr><td>liveTokenList</td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td></tr><tr><td>Socket.IO auth</td><td><a href=\"#/modules/notification@알림-소켓-url-발급\" data-nav>알림 소켓 URL 발급</a></td></tr></tbody></table></div>\n<p>크롬의 sanitized HAR 내보내기는 쿠키와 요청 헤더만 제거합니다. 위 값들은 모두 응답 본문에 있으므로 sanitize 후에도 그대로 남습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/core/auth@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/core/base-urls\" data-nav>Base URL</a> · <a href=\"#/core/headers\" data-nav>필수 요청 헤더</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a></p>", "toc": [{"level": 2, "id": "쿠키", "text": "쿠키"}, {"level": 2, "id": "권한-3단계", "text": "권한 3단계"}, {"level": 2, "id": "모듈별-요구-수준", "text": "모듈별 요구 수준"}, {"level": 2, "id": "확인된-권한-값", "text": "확인된 권한 값"}, {"level": 2, "id": "민감-정보", "text": "민감 정보"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "core/base-urls": {"title": "Base URL", "html": "<h1 id=\"base-url\">Base URL<a class=\"anchor\" href=\"#/core/base-urls@base-url\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>치지직 API는 7개 호스트에 걸쳐 있습니다.<br>어떤 호스트를 사용하는지에 따라 응답 봉투의 형태가 달라집니다. (<a href=\"#/core/conventions@응답-봉투\" data-nav>응답 봉투 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>적용 범위</td><td>모든 요청</td></tr><tr><td>관련 문서</td><td><a href=\"#/core/headers\" data-nav>필수 요청 헤더</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/core/auth\" data-nav>인증</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"호스트-목록\">호스트 목록<a class=\"anchor\" href=\"#/core/base-urls@호스트-목록\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>별칭</th><th>Host</th><th>용도</th><th>봉투</th></tr></thead><tbody><tr><td>CHZZK</td><td><code>https://api.chzzk.naver.com</code></td><td>대부분의 조회. 캡처 요청의 약 60%</td><td><a href=\"#/core/conventions@a형--치지직-계열\" data-nav>A형</a></td></tr><tr><td>GAME</td><td><code>https://comm-api.game.naver.com/nng_main</code></td><td>로그인 상태, 채팅 토큰, 프로필, 차단 목록</td><td>A형</td></tr><tr><td>COMMENT</td><td><code>https://apis.naver.com/nng_main/nng_comment_api</code></td><td>댓글. VOD·채널 게시글·클립</td><td>A형</td></tr><tr><td>CREATOR</td><td><code>https://creatorhub-api.naver.com</code></td><td>클립 뷰어 피드, 댓글 스티커</td><td><a href=\"#/core/conventions@b형--creator-hub-계열\" data-nav>B형</a></td></tr><tr><td>VOD</td><td><code>https://apis.naver.com/neonplayer/vodplay/v3/playback/{videoId}</code></td><td>VOD 재생 매니페스트</td><td>XML (DASH MPD)</td></tr><tr><td>CHAT</td><td><code>wss://kr-ss{N}.chat.naver.com/chat</code></td><td>실시간 채팅 WebSocket</td><td>자체 JSON. cmd 코드</td></tr><tr><td>NOTIFY</td><td><code>wss://ssio{N}.nchat.naver.com/socket.io/</code></td><td>개인 알림 Socket.IO</td><td>Engine.IO v3</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"chzzk-경로-접두사\">CHZZK 경로 접두사<a class=\"anchor\" href=\"#/core/base-urls@chzzk-경로-접두사\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>같은 호스트이지만 경로 접두사에 따라 성격이 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>접두사</th><th>성격</th><th>모듈</th></tr></thead><tbody><tr><td><code>/service/</code></td><td>일반 조회</td><td>대부분</td></tr><tr><td><code>/polling/</code></td><td>주기 호출용 경량 조회</td><td><a href=\"#/modules/live\" data-nav>Live</a></td></tr><tr><td><code>/commercial/</code></td><td>상업 기능</td><td><a href=\"#/modules/commerce\" data-nav>Commerce</a></td></tr><tr><td><code>/manage/</code></td><td>스튜디오. 본인 채널 권한 필요</td><td><a href=\"#/modules/manage\" data-nav>Manage</a> · <a href=\"#/modules/stats\" data-nav>Stats</a></td></tr></tbody></table></div>\n<p><code>/manage/</code> 는 v1과 v2가 공존합니다. 대부분 v1이며 <code>center-status</code> 만 v2로 관측됐습니다.</p>\n<hr>\n<h2 id=\"creator-호스트\">CREATOR 호스트<a class=\"anchor\" href=\"#/core/base-urls@creator-호스트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><code>creatorhub-api.naver.com</code> 은 스튜디오 통계 API가 아닙니다.</p>\n<p>캡처에서 확인된 것은 클립 뷰어 추천 피드(<code>/clipviewer/*</code>)와 댓글 스티커 팩(<code>/comment/sticker*</code>) 두 가지입니다. 네이버 공통 크리에이터 플랫폼으로 블로그와 클립이 함께 사용하며, 응답 봉투도 <code>{header, body}</code> 형태로 다릅니다.</p>\n<p>채널 통계는 이 호스트가 아니라 <code>/manage/v1/.../stats/*</code> 에 있습니다. (<a href=\"#/modules/stats\" data-nav>Stats 참조</a>)</p>\n<hr>\n<h2 id=\"서버-번호\">서버 번호<a class=\"anchor\" href=\"#/core/base-urls@서버-번호\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><code>CHAT</code> 과 <code>NOTIFY</code> 의 <code>{N}</code> 은 클라이언트가 계산하는 값이 아닙니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>호스트</th><th>결정 방식</th><th>관측값</th></tr></thead><tbody><tr><td>CHAT</td><td>풀 내 임의. 동일한 <code>chatChannelId</code> 가 서로 다른 서버에 접속해 모두 성공</td><td><code>kr-ss24</code>, <code>kr-ss35</code></td></tr><tr><td>NOTIFY</td><td>서버가 URL 전체를 반환 (<code>personal/session-url</code>)</td><td><code>ssio07</code>, <code>ssio09</code>, <code>ssio24</code>, <code>ssio25</code></td></tr></tbody></table></div>\n<p>공개 라이브러리에 알려진 <code>sum(charCodes) % 9 + 1</code> 공식은 modulus 값이 틀린 것이 아니라 전제 자체가 성립하지 않습니다. 자세한 내용은 <a href=\"#/modules/chat@서버-번호는-클라이언트가-정하지-않습니다\" data-nav>서버 번호는 클라이언트가 정하지 않습니다</a>에 있습니다.</p>\n<hr>\n<h2 id=\"notify-호스트\">NOTIFY 호스트<a class=\"anchor\" href=\"#/core/base-urls@notify-호스트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로명이 <code>nchat</code> 이라 채팅으로 오인하기 쉽습니다. 앱 식별자가 <code>nng@glive</code> 이고 관측된 WebSocket 프레임이 모두 핸드셰이크와 하트비트였습니다. 개인 알림 채널입니다. (<a href=\"#/modules/notification\" data-nav>Notification 참조</a>)</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/core/base-urls@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/core/headers\" data-nav>필수 요청 헤더</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/core/auth\" data-nav>인증</a></p>", "toc": [{"level": 2, "id": "호스트-목록", "text": "호스트 목록"}, {"level": 2, "id": "chzzk-경로-접두사", "text": "CHZZK 경로 접두사"}, {"level": 2, "id": "creator-호스트", "text": "CREATOR 호스트"}, {"level": 2, "id": "서버-번호", "text": "서버 번호"}, {"level": 2, "id": "notify-호스트", "text": "NOTIFY 호스트"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "core/conventions": {"title": "공통 규칙", "html": "<h1 id=\"공통-규칙\">공통 규칙<a class=\"anchor\" href=\"#/core/conventions@공통-규칙\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>응답 봉투, 페이지네이션, 문자열 JSON, 식별자 네 가지를 다룹니다.<br>모듈 문서를 읽기 전에 확인해 두면 나머지 문서를 이해하기 쉽습니다.</p>\n<hr>\n<h2 id=\"응답-봉투\">응답 봉투<a class=\"anchor\" href=\"#/core/conventions@응답-봉투\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>호스트마다 응답 봉투의 형태와 성공 조건이 다릅니다.</p>\n<h3 id=\"a형--치지직-계열\">A형 — 치지직 계열<a class=\"anchor\" href=\"#/core/conventions@a형--치지직-계열\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>api.chzzk.naver.com</code>, <code>comm-api.game.naver.com</code>, <code>nng_comment_api</code> 가 사용합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;code&quot;: 200, &quot;message&quot;: null, &quot;content&quot;: { } }</code></pre></div>\n<p>HTTP 상태 코드가 200이어도 <code>code</code> 가 200이 아닐 수 있습니다. <code>code</code> 로 판정합니다.</p>\n<h3 id=\"b형--creator-hub-계열\">B형 — Creator Hub 계열<a class=\"anchor\" href=\"#/core/conventions@b형--creator-hub-계열\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>creatorhub-api.naver.com</code> 이 사용합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;header&quot;: { &quot;code&quot;: 0, &quot;message&quot;: &quot;&quot; }, &quot;body&quot;: { } }</code></pre></div>\n<p>성공 조건이 <code>0</code> 입니다. A형과 같은 코드로 판정하면 정상 응답을 실패로 처리하게 됩니다.</p>\n<h3 id=\"c형--통계-수집기\">C형 — 통계 수집기<a class=\"anchor\" href=\"#/core/conventions@c형--통계-수집기\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;result_code&quot;: 1, &quot;result_data&quot;: { &quot;message&quot;: &quot;success&quot; } }</code></pre></div>\n<p>이 문서는 읽기 전용 API만 다루므로 C형을 반환하는 엔드포인트는 수록하지 않았습니다. 참고용으로만 기재합니다.</p>\n<h3 id=\"파싱\">파싱<a class=\"anchor\" href=\"#/core/conventions@파싱\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def unwrap(resp):\n    j = resp.json()\n    if &quot;content&quot; in j:                      # A형\n        if j.get(&quot;code&quot;) != 200:\n            raise RuntimeError(f&#x27;code={j.get(&quot;code&quot;)} {j.get(&quot;message&quot;)}&#x27;)\n        return j[&quot;content&quot;]\n    if &quot;body&quot; in j:                         # B형\n        if j.get(&quot;header&quot;, {}).get(&quot;code&quot;) != 0:\n            raise RuntimeError(j[&quot;header&quot;].get(&quot;message&quot;))\n        return j[&quot;body&quot;]\n    raise RuntimeError(&quot;unknown envelope&quot;)</code></pre></div>\n<hr>\n<h2 id=\"페이지네이션--3가지-혼재\">페이지네이션 — 3가지 혼재<a class=\"anchor\" href=\"#/core/conventions@페이지네이션--3가지-혼재\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>세 가지 방식이 함께 쓰입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>방식</th><th>요청 파라미터</th><th>응답</th><th>사용처</th></tr></thead><tbody><tr><td>page</td><td><code>page</code>, <code>size</code>, <code>pagingType=PAGE</code></td><td><code>totalCount</code>, <code>totalPage</code></td><td>팔로잉, VOD, 댓글</td></tr><tr><td>offset</td><td><code>offset</code>, <code>size</code></td><td><code>page.next.offset</code></td><td>검색, 대댓글</td></tr><tr><td>cursor</td><td>정렬 기준 필드 자체</td><td><code>page.next.{키}</code></td><td>클립, 카테고리</td></tr></tbody></table></div>\n<h3 id=\"커서-방식이-특이합니다\">커서 방식이 특이합니다<a class=\"anchor\" href=\"#/core/conventions@커서-방식이-특이합니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>커서 방식은 별도의 커서 토큰을 쓰지 않고, 정렬 기준이 되는 필드 자체를 다음 페이지 키로 사용합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">// 클립: 다음 요청에 clipUID=PXHD1Pg1jT\n&quot;page&quot;: { &quot;next&quot;: { &quot;clipUID&quot;: &quot;PXHD1Pg1jT&quot; }, &quot;prev&quot;: null }\n\n// 카테고리: 정렬 기준 3개가 함께 커서를 구성\n&quot;page&quot;: { &quot;next&quot;: { &quot;concurrentUserCount&quot;: 7307, &quot;openLiveCount&quot;: 172, &quot;categoryId&quot;: &quot;Lost_Ark&quot; } }</code></pre></div>\n<p><code>page.next</code> 가 <code>null</code> 이면 마지막 페이지입니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def paginate_cursor(url, params, headers):\n    while True:\n        content = unwrap(requests.get(url, params=params, headers=headers))\n        yield from content[&quot;data&quot;]\n        nxt = content.get(&quot;page&quot;, {}).get(&quot;next&quot;)\n        if not nxt:\n            return\n        params.update(nxt)      # 커서 키를 그대로 파라미터에 병합</code></pre></div>\n<hr>\n<h2 id=\"문자열로-감싸진-json\">문자열로 감싸진 JSON<a class=\"anchor\" href=\"#/core/conventions@문자열로-감싸진-json\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>아래 필드는 JSON 객체가 아니라 JSON 문자열로 반환됩니다. 한 번 더 파싱해야 합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>위치</th></tr></thead><tbody><tr><td>livePlaybackJson</td><td>라이브 상세</td></tr><tr><td>livePollingStatusJson</td><td>라이브 상태</td></tr><tr><td>recId</td><td>클립 목록, Creator Hub 카드</td></tr><tr><td>extras</td><td>채팅 메시지</td></tr><tr><td>profile</td><td>채팅 메시지. 시스템 메시지면 <code>&quot;{}&quot;</code></td></tr><tr><td>extraJson</td><td>댓글 첨부. <code>PHOTO</code> 면 width·height, <code>STICKER</code> 면 <code>null</code></td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import json\nplayback = json.loads(content[&quot;livePlaybackJson&quot;])</code></pre></div>\n<hr>\n<h2 id=\"식별자\">식별자<a class=\"anchor\" href=\"#/core/conventions@식별자\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>이름</th><th>형태</th><th>설명</th></tr></thead><tbody><tr><td>channelId</td><td>32자 hex</td><td>채널 고유 식별자</td></tr><tr><td>liveId</td><td>Int. 8자리</td><td>방송 세션 식별자. 방송을 켤 때마다 새로 발급</td></tr><tr><td>chatChannelId</td><td><code>N</code> + 5자</td><td>채팅방 식별자. 방송마다 변경</td></tr><tr><td>videoNo</td><td>Int</td><td>VOD 번호. 댓글과 조회 API가 사용</td></tr><tr><td>videoId</td><td>36자 대문자 hex</td><td>VOD 재생용 식별자</td></tr><tr><td>clipUID</td><td>10자 영숫자</td><td>클립 식별자 (예: <code>L0gvjE67xM</code>)</td></tr><tr><td>userIdHash</td><td>32자 hex</td><td>사용자 해시</td></tr><tr><td>sessionIOChannelId</td><td><code>{type}@{...}</code></td><td>알림 이벤트 세션 식별자</td></tr></tbody></table></div>\n<h3 id=\"헷갈리는-3쌍\">헷갈리는 3쌍<a class=\"anchor\" href=\"#/core/conventions@헷갈리는-3쌍\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><strong>channelId 와 userIdHash</strong></p>\n<p>두 값 모두 32자 hex로 형식이 같습니다. 스트리머 본인은 두 값이 동일합니다.</p>\n<p><strong>videoNo 와 videoId</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>식별자</th><th>사용처</th></tr></thead><tbody><tr><td>videoNo (Int)</td><td>VOD 상세, 다시보기 채팅, 댓글</td></tr><tr><td>videoId (36자)</td><td>재생 매니페스트, Creator Hub <code>seedMediaId</code></td></tr></tbody></table></div>\n<p><strong>clipUID 와 클립의 videoId</strong></p>\n<p>클립도 두 식별자를 함께 가집니다. 댓글 조회는 <code>clipUID</code> 를, Creator Hub 카드 조회는 <code>videoId</code> 를 사용합니다. (<a href=\"#/modules/clip\" data-nav>Clip 참조</a> · <a href=\"#/modules/comment@objecttype\" data-nav>Comment 참조</a>)</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/core/conventions@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/core/base-urls\" data-nav>Base URL</a> · <a href=\"#/core/headers\" data-nav>필수 요청 헤더</a> · <a href=\"#/core/auth\" data-nav>인증</a></p>", "toc": [{"level": 2, "id": "응답-봉투", "text": "응답 봉투"}, {"level": 3, "id": "a형--치지직-계열", "text": "A형 — 치지직 계열"}, {"level": 3, "id": "b형--creator-hub-계열", "text": "B형 — Creator Hub 계열"}, {"level": 3, "id": "c형--통계-수집기", "text": "C형 — 통계 수집기"}, {"level": 3, "id": "파싱", "text": "파싱"}, {"level": 2, "id": "페이지네이션--3가지-혼재", "text": "페이지네이션 — 3가지 혼재"}, {"level": 3, "id": "커서-방식이-특이합니다", "text": "커서 방식이 특이합니다"}, {"level": 2, "id": "문자열로-감싸진-json", "text": "문자열로 감싸진 JSON"}, {"level": 2, "id": "식별자", "text": "식별자"}, {"level": 3, "id": "헷갈리는-3쌍", "text": "헷갈리는 3쌍"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "core/headers": {"title": "필수 요청 헤더", "html": "<h1 id=\"필수-요청-헤더\">필수 요청 헤더<a class=\"anchor\" href=\"#/core/headers@필수-요청-헤더\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>치지직 API는 웹 클라이언트가 붙이는 커스텀 헤더를 요구합니다.<br>이 헤더가 없으면 상당수의 엔드포인트가 실패합니다.<br>공개 라이브러리 문서에는 대부분 기재되어 있지 않은 부분입니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>적용 범위</td><td>모든 HTTP 요청</td></tr><tr><td>필수 커스텀 헤더</td><td><code>front-client-platform-type</code> · <code>front-client-product-type</code> · <code>deviceId</code></td></tr><tr><td>관련 문서</td><td><a href=\"#/core/base-urls\" data-nav>Base URL</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/core/auth\" data-nav>인증</a></td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">http</span><pre><code class=\"lang-http\">Accept: application/json\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ...\nOrigin: https://chzzk.naver.com\nReferer: https://chzzk.naver.com/\nfront-client-platform-type: PC\nfront-client-product-type: web\ndeviceId: &lt;UUID v4. 클라이언트가 생성하여 재사용&gt;</code></pre></div>\n<hr>\n<h2 id=\"커스텀-헤더\">커스텀 헤더<a class=\"anchor\" href=\"#/core/headers@커스텀-헤더\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Header</th><th>required</th><th>Value</th><th>Description</th></tr></thead><tbody><tr><td>front-client-platform-type</td><td>*</td><td><code>PC</code>. <code>MOBILE</code> 은 미확인</td><td>플랫폼 구분</td></tr><tr><td>front-client-product-type</td><td>*</td><td><code>web</code>. <code>app</code> 은 미확인</td><td>제품 구분</td></tr><tr><td>deviceId</td><td>*</td><td>UUID v4</td><td>클라이언트가 생성하는 기기 식별자. 서버 발급이 아님</td></tr><tr><td>scene</td><td>optional</td><td>숫자 (25, 51, 73 등)</td><td>화면 식별자. 통계용이며 생략해도 동작</td></tr></tbody></table></div>\n<h3 id=\"deviceid\">deviceId<a class=\"anchor\" href=\"#/core/headers@deviceid\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>서버가 발급하는 값이 아니라 클라이언트가 생성하는 값입니다. 웹 클라이언트는 UUID v4를 만들어 localStorage에 저장하고 계속 재사용합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import uuid\nDEVICE_ID = str(uuid.uuid4())   # 한 번 생성하여 저장 후 재사용</code></pre></div>\n<p>요청마다 새로 생성하면 서버에서는 새 기기가 계속 접속하는 것으로 관측됩니다. 한 번 생성한 값을 고정하여 사용합니다.</p>\n<h3 id=\"scene\">scene<a class=\"anchor\" href=\"#/core/headers@scene\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>생략할 수 있습니다. 웹 클라이언트가 화면별 통계를 위해 붙이는 값이며 조회 결과에 영향을 주지 않습니다.</p>\n<hr>\n<h2 id=\"cors-프리플라이트\">CORS 프리플라이트<a class=\"anchor\" href=\"#/core/headers@cors-프리플라이트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>커스텀 헤더 때문에 브라우저에서 호출하면 본 요청 전에 <code>OPTIONS</code> 요청이 먼저 발생합니다.</p>\n<p>서버 사이드에서 호출하는 경우 프리플라이트가 발생하지 않으므로 본 요청만 보내면 됩니다. 캡처한 HAR에 <code>OPTIONS</code> 가 다수 보이는 것은 이 때문이며, 실제 조회는 그 뒤의 <code>GET</code> 요청입니다.</p>\n<hr>\n<h2 id=\"인증이-필요한-요청\">인증이 필요한 요청<a class=\"anchor\" href=\"#/core/headers@인증이-필요한-요청\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>쿠키를 추가로 전달합니다. (<a href=\"#/core/auth\" data-nav>인증 참조</a>)</p>\n<div class=\"code\"><span class=\"code-lang\">http</span><pre><code class=\"lang-http\">Cookie: NID_AUT=&lt;value&gt;; NID_SES=&lt;value&gt;</code></pre></div>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/core/headers@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/core/base-urls\" data-nav>Base URL</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/core/auth\" data-nav>인증</a></p>", "toc": [{"level": 2, "id": "커스텀-헤더", "text": "커스텀 헤더"}, {"level": 3, "id": "deviceid", "text": "deviceId"}, {"level": 3, "id": "scene", "text": "scene"}, {"level": 2, "id": "cors-프리플라이트", "text": "CORS 프리플라이트"}, {"level": 2, "id": "인증이-필요한-요청", "text": "인증이 필요한 요청"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/channel": {"title": "Channel", "html": "<h1 id=\"channel\">Channel<a class=\"anchor\" href=\"#/modules/channel@channel\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>채널 API로 채널 기본 정보, 채널 부가 데이터, 내 상태, 팔로잉 목록을 조회할 수 있습니다.<br>대부분 인증이 필요하지 않으며, <code>my-info</code> 와 <code>followings</code> 3건만 로그인이 필요합니다.<br>인증 없이 얻을 수 있는 채널 지표가 모여 있어 타 채널 분석의 출발점이 됩니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/clip\" data-nav>Clip</a> · <a href=\"#/modules/manage\" data-nav>Manage</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/channel@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}</strong></td><td><a href=\"#/modules/channel@채널-기본-정보-조회\" data-nav>채널 기본 정보 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/data</strong></td><td><a href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav>채널 부가 데이터 조회</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /service/v1.1/channels/{channelId}/my-info</strong></td><td><a href=\"#/modules/channel@내-정보-조회\" data-nav>내 정보 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/videos</strong></td><td><a href=\"#/modules/channel@vod-목록-조회\" data-nav>VOD 목록 조회</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /service/v1/channels/followings</strong></td><td><a href=\"#/modules/channel@팔로잉-목록-조회\" data-nav>팔로잉 목록 조회</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /service/v1/channels/followings/live</strong></td><td><a href=\"#/modules/channel@팔로잉-목록-조회\" data-nav>팔로잉 목록 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/chat-rules</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/announcements</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/live-schedule</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/live-recommended</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/follow</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/cafe-connection</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/achievement-badges</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/party-donation-info</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/channels/{channelId}/log-power/prediction</strong></td><td><a href=\"#/modules/channel@부가-엔드포인트\" data-nav>부가 엔드포인트</a></td></tr></tbody></table></div>\n<p>클립 목록은 이 모듈이 아니라 클립 API에 있습니다. (<a href=\"#/modules/clip@채널-클립-목록-조회\" data-nav>채널 클립 목록 조회</a>)</p>\n<h3 id=\"manage-와-겹치는-경로\">manage 와 겹치는 경로<a class=\"anchor\" href=\"#/modules/channel@manage-와-겹치는-경로\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>같은 이름의 경로가 공개 API와 스튜디오 API에 각각 존재하며 반환 범위가 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>이 모듈</th><th><a href=\"#/modules/manage\" data-nav>Manage</a></th></tr></thead><tbody><tr><td>chat-rules</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/chat-rules</code></td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/chat-rules</code></td></tr><tr><td>videos</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/videos</code>. 공개분만</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/videos</code>. 비공개 포함</td></tr><tr><td>clips</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/clips</code></td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/clips</code></td></tr><tr><td>followers</td><td>없음. <code>followerCount</code> 숫자만 제공</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/followers</code>. 목록 제공</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"채널-기본-정보-조회\">채널 기본 정보 조회<a class=\"anchor\" href=\"#/modules/channel@채널-기본-정보-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널의 기본 정보를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/{channelId}</strong></td><td>채널 기본 정보 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>채널 식별자</td></tr><tr><td>channelName</td><td>String</td><td>채널 이름</td></tr><tr><td>channelImageUrl</td><td>String</td><td>채널 이미지 URL</td></tr><tr><td>channelDescription</td><td>String</td><td>채널 소개</td></tr><tr><td>followerCount</td><td>Int</td><td>채널의 팔로워 수</td></tr><tr><td>openLive</td><td>Boolean</td><td>방송 중 여부</td></tr><tr><td>verifiedMark</td><td>Boolean</td><td>채널 인증 마크 여부</td></tr><tr><td>activatedChannelBadgeIds</td><td>String[]</td><td>활성화된 채널 배지 식별자 목록</td></tr></tbody></table></div>\n<p><strong>오류</strong></p>\n<p>존재하지 않는 채널을 요청해도 <code>code</code> 는 200으로 반환됩니다. 내용만 비어서 옵니다.</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{ &quot;channelId&quot;: null, &quot;channelName&quot;: &quot;(알 수 없음)&quot;, &quot;followerCount&quot;: 0 }</code></pre></div>\n<p>봉투만으로는 실패를 구분할 수 없으므로 <code>channelId</code> 가 <code>null</code> 인지 확인해야 합니다.</p>\n<p>팔로워 수의 추이는 이 API에서 제공하지 않습니다. 타 채널은 이 엔드포인트를 주기적으로 호출해 직접 축적해야 합니다. (<a href=\"#/reference/analytics@트랙-b--타-채널\" data-nav>트랙 B 참조</a>) 본인 채널은 <a href=\"#/modules/stats\" data-nav>Stats</a>에서 조회할 수 있습니다.</p>\n<hr>\n<h2 id=\"채널-부가-데이터-조회\">채널 부가 데이터 조회<a class=\"anchor\" href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널 개설일, 누적 방송시간, 소셜 링크 등의 부가 데이터를 조회할 수 있습니다.<br>인증 없이 누적 지표를 얻을 수 있는 몇 안 되는 API입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/{channelId}/data</strong></td><td>채널 부가 데이터 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>fields</td><td>String</td><td>*</td><td>조회할 항목. 콤마로 구분하며 요청한 항목만 반환</td></tr></tbody></table></div>\n<p><code>fields</code> 에 사용할 수 있는 값입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>값</th><th>반환 내용</th></tr></thead><tbody><tr><td>channelHistory</td><td>개설일(<code>firstLiveDate</code>)과 누적 방송시간(<code>totalLiveHours</code>)</td></tr><tr><td>description</td><td>채널 소개</td></tr><tr><td>socialLinks</td><td>소셜 링크 목록</td></tr><tr><td>topExposedVideos</td><td>상단 고정 영상 또는 진행 중인 라이브</td></tr><tr><td>banners</td><td>채널 배너</td></tr><tr><td>donationRankingsExposure</td><td>후원 랭킹 공개 여부</td></tr><tr><td>achievementBadgeExposure</td><td>업적 배지 공개 여부</td></tr><tr><td>logPowerActive</td><td>로그파워 사용 여부</td></tr><tr><td>logPowerRankingExposure</td><td>로그파워 랭킹 공개 여부</td></tr><tr><td>missionDonationChannelHomeExposure</td><td>미션 후원 홈 노출 여부</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>channelHistory</td><td>Object</td><td>채널 이력</td></tr><tr><td>channelHistory.firstLiveDate</td><td>String</td><td>첫 방송 일시. 채널 개설 시점</td></tr><tr><td>channelHistory.totalLiveHours</td><td>Int</td><td>누적 방송시간. 단위는 시간</td></tr><tr><td>socialLinks</td><td>Object[]</td><td>소셜 링크 목록</td></tr><tr><td>socialLinks.title</td><td>String</td><td>링크 이름</td></tr><tr><td>socialLinks.landingUrl</td><td>String</td><td>링크 URL</td></tr><tr><td>activatedAchievementBadgeIds</td><td>String[]</td><td>활성화된 업적 배지. 요청하지 않아도 항상 반환</td></tr></tbody></table></div>\n<details><summary>응답 예시 — <code>fields=channelHistory,socialLinks</code></summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;socialLinks&quot;: [\n      { &quot;title&quot;: &quot;X&quot;, &quot;landingUrl&quot;: &quot;https://x.com/...&quot; },\n      { &quot;title&quot;: &quot;YouTube&quot;, &quot;landingUrl&quot;: &quot;https://www.youtube.com/channel/...&quot; }\n    ],\n    &quot;channelHistory&quot;: {\n      &quot;firstLiveDate&quot;: &quot;2024-05-18 16:56:56&quot;,\n      &quot;totalLiveHours&quot;: 4259\n    },\n    &quot;donationRankingsExposure&quot;: false,\n    &quot;activatedAchievementBadgeIds&quot;: [],\n    &quot;achievementBadgeExposure&quot;: true,\n    &quot;logPowerActive&quot;: true,\n    &quot;logPowerRankingExposure&quot;: false\n  }\n}</code></pre></div>\n</details>\n<hr>\n<h2 id=\"내-정보-조회\">내 정보 조회<a class=\"anchor\" href=\"#/modules/channel@내-정보-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>해당 채널에 대한 로그인 사용자의 상태를 조회할 수 있습니다.<br>팔로우, 구독, 제재, 권한 정보를 한 번에 반환합니다.<br>이 API를 호출하려면 로그인이 필요합니다. (<a href=\"#/core/auth\" data-nav>인증 참조</a>)</p>\n<p>경로 버전이 <code>v1.1</code> 입니다. 이 모듈에서 유일합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1.1/channels/{channelId}/my-info</strong></td><td>내 정보 조회</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>userRole</td><td>String</td><td><code>USER</code> 또는 <code>STREAMER</code></td></tr><tr><td>permissions</td><td>String[]</td><td>스트리머 본인일 때 8종 반환 (<a href=\"#/core/auth@확인된-권한-값\" data-nav>권한 값 참조</a>)</td></tr><tr><td>following</td><td>Object</td><td>팔로우 정보</td></tr><tr><td>following.following</td><td>Boolean</td><td>팔로우 여부</td></tr><tr><td>following.followDate</td><td>String</td><td>팔로우 시작 일시</td></tr><tr><td>following.notification</td><td>Boolean</td><td>알림 설정 여부</td></tr><tr><td>subscription</td><td>Object</td><td>구독 정보</td></tr><tr><td>subscription.subscribing</td><td>Boolean</td><td>구독 여부</td></tr><tr><td>restriction</td><td>Object</td><td>제재 정보</td></tr><tr><td>restriction.restrict</td><td>Boolean</td><td>제재 여부</td></tr><tr><td>cheatKey</td><td>Boolean</td><td>치트키 사용 여부 (<a href=\"#/modules/commerce@치트키--오퍼월\" data-nav>참조</a>)</td></tr><tr><td>playerAdFlag</td><td>Object</td><td><code>preRoll</code>, <code>midRoll</code>, <code>postRoll</code></td></tr></tbody></table></div>\n<details><summary>응답 예시</summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;channelId&quot;: &quot;&lt;channelId&gt;&quot;,\n    &quot;userRole&quot;: &quot;USER&quot;,\n    &quot;permissions&quot;: [],\n    &quot;following&quot;: { &quot;following&quot;: true, &quot;notification&quot;: true, &quot;followDate&quot;: &quot;2026-01-20 14:36:07&quot; },\n    &quot;cheatKey&quot;: false,\n    &quot;naverMembership&quot;: false,\n    &quot;restriction&quot;: {\n      &quot;restrict&quot;: false, &quot;origin&quot;: false, &quot;restrictReleaseState&quot;: &quot;NONE&quot;,\n      &quot;judgment&quot;: null, &quot;availableReleaseRequestDate&quot;: null,\n      &quot;restrictUserNickname&quot;: null, &quot;fromDate&quot;: null, &quot;toDate&quot;: null\n    },\n    &quot;privateUserBlock&quot;: false,\n    &quot;subscription&quot;: {\n      &quot;subscribing&quot;: false, &quot;subscriptionDeferred&quot;: false,\n      &quot;subscriptionAlertNotified&quot;: false, &quot;subscriptionAlertRefused&quot;: false,\n      &quot;subscriptionDisabled&quot;: false, &quot;subscriptionExpireNotifyRequired&quot;: false,\n      &quot;subscriptionGift&quot;: false\n    },\n    &quot;playerAdFlag&quot;: { &quot;preRoll&quot;: true, &quot;midRoll&quot;: true, &quot;postRoll&quot;: true }\n  }\n}</code></pre></div>\n</details>\n<hr>\n<h2 id=\"vod-목록-조회\">VOD 목록 조회<a class=\"anchor\" href=\"#/modules/channel@vod-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채널의 공개된 VOD 목록을 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/{channelId}/videos</strong></td><td>VOD 목록 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>조회할 채널 식별자</td></tr><tr><td>page</td><td>Int</td><td>*</td><td>요청하는 페이지. 0부터 시작 (<a href=\"#/core/conventions@페이지네이션--3가지-혼재\" data-nav>참조</a>)</td></tr><tr><td>size</td><td>Int</td><td>*</td><td>조회할 VOD 개수. 24 확인</td></tr><tr><td>pagingType</td><td>String</td><td>optional</td><td><code>PAGE</code></td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>data</td><td>Object[]</td><td>VOD 요약 목록 (<a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체 참조</a>)</td></tr><tr><td>totalCount</td><td>Int</td><td>전체 개수</td></tr><tr><td>totalPage</td><td>Int</td><td>전체 페이지 수</td></tr></tbody></table></div>\n<p>전체 VOD를 수집할 때는 이 목록보다 VOD 체인이 정확합니다. <code><span class=\"method m-get\">GET</span> /service/v3/videos/{videoNo}</code> 의 <code>nextVideo.videoNo</code> 를 따라 순회하면 누락이 적습니다. (<a href=\"#/modules/video@vod-체인\" data-nav>VOD 체인 참조</a>) 이 목록은 체인의 출발점이 되는 최신 <code>videoNo</code> 를 얻는 데 사용합니다.</p>\n<hr>\n<h2 id=\"팔로잉-목록-조회\">팔로잉 목록 조회<a class=\"anchor\" href=\"#/modules/channel@팔로잉-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>로그인 사용자가 팔로우한 채널 목록을 조회할 수 있습니다.<br><code>/live</code> 는 그중 방송 중인 채널만 반환합니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/channels/followings</strong></td><td>팔로잉 목록 조회</td></tr><tr><td><strong>GET /service/v1/channels/followings/live</strong></td><td>방송 중인 팔로잉 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>page</td><td>Int</td><td>*</td><td>요청하는 페이지. 0부터 시작</td></tr><tr><td>size</td><td>Int</td><td>*</td><td>조회할 개수. 505까지 요청 가능한 것을 확인. 상한은 미확인</td></tr><tr><td>sortType</td><td>String</td><td>*</td><td>정렬 방식. <code>FOLLOW</code> 확인. 그 외 값은 미확인</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>totalCount</td><td>Int</td><td>전체 개수</td></tr><tr><td>totalPage</td><td>Int</td><td>전체 페이지 수</td></tr><tr><td>followingList</td><td>Object[]</td><td>팔로잉 목록</td></tr><tr><td>followingList.channel</td><td>Object</td><td>채널 정보</td></tr><tr><td>followingList.streamer.openLive</td><td>Boolean</td><td>방송 중 여부</td></tr><tr><td>followingList.liveInfo</td><td>Object</td><td>방송 중일 때의 제목과 시청자 수</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"부가-엔드포인트\">부가 엔드포인트<a class=\"anchor\" href=\"#/modules/channel@부가-엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>아래 API는 모두 <code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/…</code> 형태이며 요청 파라미터가 없습니다. 인증이 필요하지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>내용</th></tr></thead><tbody><tr><td>chat-rules</td><td>채팅 규칙</td></tr><tr><td>announcements</td><td>공지</td></tr><tr><td>live-schedule</td><td>방송 예정</td></tr><tr><td>live-recommended</td><td>추천 라이브</td></tr><tr><td>follow</td><td>팔로우 정보</td></tr><tr><td>cafe-connection</td><td>카페 연동</td></tr><tr><td>achievement-badges</td><td>업적 배지</td></tr><tr><td>party-donation-info</td><td>파티 후원</td></tr><tr><td>log-power/prediction</td><td>로그파워 예측</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/channel@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/clip\" data-nav>Clip</a> · <a href=\"#/modules/manage\" data-nav>Manage</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 3, "id": "manage-와-겹치는-경로", "text": "manage 와 겹치는 경로"}, {"level": 2, "id": "채널-기본-정보-조회", "text": "채널 기본 정보 조회"}, {"level": 2, "id": "채널-부가-데이터-조회", "text": "채널 부가 데이터 조회"}, {"level": 2, "id": "내-정보-조회", "text": "내 정보 조회"}, {"level": 2, "id": "vod-목록-조회", "text": "VOD 목록 조회"}, {"level": 2, "id": "팔로잉-목록-조회", "text": "팔로잉 목록 조회"}, {"level": 2, "id": "부가-엔드포인트", "text": "부가 엔드포인트"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/chat": {"title": "Chat", "html": "<h1 id=\"chat\">Chat<a class=\"anchor\" href=\"#/modules/chat@chat\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>채팅 API로 실시간 채팅 메시지를 수신할 수 있습니다.<br>WebSocket 접속에 로그인 쿠키로 발급받은 액세스 토큰이 필요합니다.<br>이 문서는 읽기 전용 API만 다루므로 채팅 송신(<code>cmd 3101</code>)은 수록하지 않았습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>wss://kr-ss{N}.chat.naver.com/chat</code> · <code>https://comm-api.game.naver.com/nng_main</code></td></tr><tr><td>응답 봉투</td><td>HTTP는 A형. WebSocket은 <code>cmd</code>/<code>bdy</code> 프레임</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a> · <a href=\"#/modules/notification\" data-nav>Notification</a></td></tr></tbody></table></div>\n<p>실시간 수신이 필요하지 않은 경우 <a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 조회</a>로 방송 전체의 채팅 로그를 받을 수 있습니다. 토큰 발급과 WebSocket 접속이 필요하지 않습니다.</p>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/chat@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>WSS kr-ss{N}.chat.naver.com/chat</strong></td><td><a href=\"#/modules/chat@websocket-연결\" data-nav>WebSocket 연결</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /v1/chats/access-token</strong></td><td><a href=\"#/modules/chat@액세스-토큰-발급\" data-nav>액세스 토큰 발급</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /v1/chats/{chatChannelId}/users/{userIdHash}/profile</strong></td><td><a href=\"#/modules/chat@프로필-조회\" data-nav>프로필 조회</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"접속-절차\">접속 절차<a class=\"anchor\" href=\"#/modules/chat@접속-절차\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"code\"><pre><code>1. GET /polling/v3.1/channels/{channelId}/live-status   → chatChannelId\n2. GET /v1/chats/access-token?channelId={chatChannelId} → accTkn\n3. wss://kr-ss{N}.chat.naver.com/chat  접속\n4. cmd 100 (CONNECT) 전송 → cmd 10100 응답의 bdy.sid 보관\n5. 이후 모든 요청에 sid 포함</code></pre></div>\n<p><code>chatChannelId</code> 는 방송마다 변경됩니다. 재접속할 때마다 1번부터 다시 수행합니다.</p>\n<hr>\n<h2 id=\"액세스-토큰-발급\">액세스 토큰 발급<a class=\"anchor\" href=\"#/modules/chat@액세스-토큰-발급\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채팅 서버 접속에 사용할 토큰을 발급받을 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/chats/access-token</strong></td><td>액세스 토큰 발급</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td><code>chatChannelId</code>. 채널 식별자가 아님</td></tr><tr><td>chatType</td><td>String</td><td>*</td><td><code>STREAMING</code></td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>accTkn</td><td>String</td><td>채팅 서버 접속 토큰. 민감 정보</td></tr></tbody></table></div>\n<p><code>accTkn</code> 은 채팅 계정 도용에 사용될 수 있습니다. 공유하거나 저장소에 커밋하지 않습니다.</p>\n<hr>\n<h2 id=\"websocket-연결\">WebSocket 연결<a class=\"anchor\" href=\"#/modules/chat@websocket-연결\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"code\"><pre><code>wss://kr-ss{N}.chat.naver.com/chat</code></pre></div>\n<h3 id=\"서버-번호는-클라이언트가-정하지-않습니다\">서버 번호는 클라이언트가 정하지 않습니다<a class=\"anchor\" href=\"#/modules/chat@서버-번호는-클라이언트가-정하지-않습니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>공개 라이브러리에 아래와 같은 서버 번호 계산식이 알려져 있습니다.</p>\n<div class=\"code\"><span class=\"code-lang\">js</span><pre><code class=\"lang-js\">serverId = Math.abs(sum(charCodes)) % 9 + 1   // 1~9</code></pre></div>\n<p>이 계산식은 성립하지 않습니다. modulus 값이 틀린 것이 아니라 전제 자체가 다릅니다.</p>\n<p>캡처한 WebSocket 프레임에서 동일한 <code>chatChannelId</code> 가 서로 다른 두 서버에 접속해 모두 성공했습니다.</p>\n<div class=\"code\"><pre><code>wss://kr-ss24.chat.naver.com/chat  ← cid &quot;N2dc9q&quot; → retCode 0 SUCCESS\nwss://kr-ss35.chat.naver.com/chat  ← cid &quot;N2dc9q&quot; → retCode 0 SUCCESS</code></pre></div>\n<p>양쪽 모두 <code>messageList</code> 를 정상 수신했습니다. <code>cid</code> 에서 서버를 유도하는 방식이 아니라 풀 내의 임의 서버에 접속하는 방식입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>항목</th><th>상태</th></tr></thead><tbody><tr><td>관측된 서버 번호</td><td><code>kr-ss24</code>, <code>kr-ss35</code></td></tr><tr><td>유효 번호 범위</td><td>미확인</td></tr></tbody></table></div>\n<h3 id=\"connect-프레임\">CONNECT 프레임<a class=\"anchor\" href=\"#/modules/chat@connect-프레임\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>ver</code> 값은 <code>3</code> 입니다. 공개 라이브러리에 <code>2</code> 로 알려져 있으나 실제 값은 <code>3</code> 이며 바디 구성도 다릅니다.</p>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;ver&quot;: &quot;3&quot;,\n  &quot;cmd&quot;: 100,\n  &quot;svcid&quot;: &quot;game&quot;,\n  &quot;cid&quot;: &quot;&lt;chatChannelId&gt;&quot;,\n  &quot;sid&quot;: null,\n  &quot;bdy&quot;: {\n    &quot;uid&quot;: &quot;&lt;userIdHash&gt;&quot;,\n    &quot;devType&quot;: 2001,\n    &quot;accTkn&quot;: &quot;&lt;accessToken&gt;&quot;,\n    &quot;auth&quot;: &quot;SEND&quot;,\n    &quot;libVer&quot;: &quot;4.11.0&quot;,\n    &quot;osVer&quot;: &quot;Windows/10&quot;,\n    &quot;devName&quot;: &quot;Google Chrome/150.0.0.0&quot;,\n    &quot;locale&quot;: &quot;ko&quot;,\n    &quot;timezone&quot;: &quot;Asia/Seoul&quot;,\n    &quot;uuid&quot;: &quot;&lt;UUID&gt;&quot;,\n    &quot;windowId&quot;: &quot;&lt;UUID&gt;&quot;\n  }\n}</code></pre></div>\n<p>응답 <code>cmd: 10100</code> 의 <code>bdy.sid</code> 를 이후 모든 요청에 포함해야 합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>미검증 사항</th></tr></thead><tbody><tr><td>auth</td><td><code>SEND</code> 로 관측. <code>READ</code> 로 <code>uid</code> 없이 접속 가능한지 미확인</td></tr><tr><td>libVer · windowId</td><td>필수 여부 미확인</td></tr></tbody></table></div>\n<p>수신만 하는 경우 <code>auth: &quot;READ&quot;</code> 의 동작 여부를 먼저 확인해 볼 수 있습니다.</p>\n<h3 id=\"cmd-코드\">cmd 코드<a class=\"anchor\" href=\"#/modules/chat@cmd-코드\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>수신에 사용되는 코드입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>cmd</th><th>이름</th><th>방향</th></tr></thead><tbody><tr><td>0 / 10000</td><td>PING / PONG</td><td>양방향</td></tr><tr><td>100 / 10100</td><td>CONNECT / CONNECTED</td><td>양방향</td></tr><tr><td>5101 / 15101</td><td>REQUEST_RECENT_CHAT / RECENT_CHAT</td><td>양방향</td></tr><tr><td>93101</td><td>CHAT</td><td>수신</td></tr><tr><td>93102</td><td>DONATION</td><td>수신</td></tr><tr><td>93006</td><td>EVENT</td><td>수신</td></tr><tr><td>94005 / 94006 / 94008</td><td>KICK / BLOCK / BLIND</td><td>수신</td></tr><tr><td>94010 / 94015</td><td>NOTICE / PENALTY</td><td>수신</td></tr></tbody></table></div>\n<p>송신 코드인 <code>3101 SEND_CHAT</code> 은 이 문서의 범위 밖입니다.</p>\n<hr>\n<h2 id=\"메시지-객체\">메시지 객체<a class=\"anchor\" href=\"#/modules/chat@메시지-객체\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>수신 프레임의 <code>bdy</code> 에 포함되는 메시지입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>me
