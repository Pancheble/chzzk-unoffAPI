ta-nav>미포착</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"스트리밍-정보-조회\">스트리밍 정보 조회<a class=\"anchor\" href=\"#/modules/manage@스트리밍-정보-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>방송 송출에 필요한 정보와 알림 이벤트 세션 식별자를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /manage/v1/channels/{channelId}/streaming-info</strong></td><td>스트리밍 정보 조회</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>streamKey</td><td>String</td><td>스트림 키. 민감 정보</td></tr><tr><td>streamUrl</td><td>String</td><td>RTMP 송출 URL. 민감 정보</td></tr><tr><td>sessionIOChannelId 계열</td><td>String</td><td><a href=\"#/modules/notification@이벤트-세션-9종\" data-nav>이벤트 세션 9종</a></td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;streamKey&quot;: &quot;&lt;32자&gt;&quot;,\n  &quot;streamUrl&quot;: &quot;rtmp://global-rtmp.lip2.navercorp.com:8080/relay&quot;\n}</code></pre></div>\n<p><code>streamKey</code> 와 <code>streamUrl</code> 두 값이 있으면 제3자가 해당 채널로 송출할 수 있습니다. HAR, 로그, 스크린샷에 남기지 않습니다. 크롬의 sanitized HAR 내보내기는 쿠키와 요청 헤더만 제거하므로 이 값들은 응답 본문에 그대로 남습니다. 노출된 경우 스튜디오에서 스트림 키를 재발급합니다.</p>\n<p>알림 소켓에 접속하려면 이 응답의 <code>sessionIOChannelId</code> 에서 시작합니다. 키를 제외한 나머지 필드 구조는 확보되지 않았습니다.</p>\n<hr>\n<h2 id=\"방송-설정-조회\">방송 설정 조회<a class=\"anchor\" href=\"#/modules/manage@방송-설정-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>방송과 채팅 설정을 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /channels/{channelId}/live-setting/normal</strong></td><td>방송 기본 설정 조회</td></tr><tr><td><strong>GET /channels/{channelId}/live-setting/chat</strong></td><td>채팅 설정 조회</td></tr><tr><td><strong>GET /channels/{channelId}/live-setting/chat-mode</strong></td><td>채팅 모드 조회</td></tr><tr><td><strong>GET /channels/{channelId}/live-setting/chat-condition</strong></td><td>채팅 조건 조회</td></tr></tbody></table></div>\n<p>공개 문서에는 <code>/live-setting</code> 단일 경로로 기재된 경우가 있으나 실제로는 위 4개로 분리되어 있습니다.</p>\n<hr>\n<h2 id=\"확인된-파라미터-값\">확인된 파라미터 값<a class=\"anchor\" href=\"#/modules/manage@확인된-파라미터-값\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>경로</th><th>값</th></tr></thead><tbody><tr><td>dateFilter</td><td>clips</td><td><code>ALL</code></td></tr><tr><td>orderFilter</td><td>clips</td><td><code>LATEST</code></td></tr><tr><td>sortType</td><td>subscribers</td><td><code>RECENT</code></td></tr><tr><td>keyword</td><td>auto-complete/categories</td><td>검색어</td></tr></tbody></table></div>\n<p>전체 Enum은 <a href=\"#/reference/enums\" data-nav>Enum 레퍼런스</a>에 있습니다.</p>\n<hr>\n<h2 id=\"응답-스키마-미상--11건\">응답 스키마 미상 — 11건<a class=\"anchor\" href=\"#/modules/manage@응답-스키마-미상--11건\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로와 인증은 확정됐으나 캡처한 채널에 데이터가 없어 응답이 비어 있었습니다.</p>\n<p><code>clips</code>, <code>clips/make-clips</code>, <code>followers</code>, <code>news-feeds</code>, <code>party/summary</code>, <code>restrict-release-requests</code>, <code>restrict-users</code>, <code>subscribers</code>, <code>videos</code> 그리고 <a href=\"#/modules/stats\" data-nav>Stats</a>의 <code>stats/lives</code>, <code>stats/videos</code> 입니다.</p>\n<p>빈 배열 또는 <code>null</code> 로 관측됐습니다. 데이터가 축적된 채널에서 재캡처하면 일괄 확인할 수 있습니다.</p>\n<hr>\n<h2 id=\"미포착-2건\">미포착 2건<a class=\"anchor\" href=\"#/modules/manage@미포착-2건\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로는 확인됐으나 캡처에 잡히지 않았습니다. 해당 UI 조작이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>유발 방법</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /auto-complete/categories?keyword=</code></td><td>카테고리 검색창에 입력</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /channels/{channelId}/users/{targetId}/chat-activity-count</code></td><td>시청자 목록에서 특정 사용자 선택</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"미수록-경로\">미수록 경로<a class=\"anchor\" href=\"#/modules/manage@미수록-경로\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>스튜디오 캡처에서 확인된 47개 중 20개의 경로명을 확보하지 못했습니다.</p>\n<!-- 목록 확보 시 이 절을 채웁니다. 형식:\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody></tbody></table></div>\n<p>--&gt;</p>\n<hr>\n<h2 id=\"공개-api-와-겹치는-경로\">공개 API 와 겹치는 경로<a class=\"anchor\" href=\"#/modules/manage@공개-api-와-겹치는-경로\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>이 문서</th><th>공개</th></tr></thead><tbody><tr><td>chat-rules</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/chat-rules</code></td><td><a href=\"#/modules/channel\" data-nav>Channel</a></td></tr><tr><td>videos</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/videos</code>. 비공개 포함</td><td><a href=\"#/modules/channel@vod-목록-조회\" data-nav>VOD 목록 조회</a></td></tr><tr><td>clips</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/clips</code></td><td><a href=\"#/modules/clip@채널-클립-목록-조회\" data-nav>채널 클립 목록 조회</a></td></tr><tr><td>followers</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/followers</code>. 목록 제공</td><td>공개는 <code>followerCount</code> 숫자만</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"버전\">버전<a class=\"anchor\" href=\"#/modules/manage@버전\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>대부분 <code>manage/v1</code> 이며 <code>center-status</code> 만 <code>manage/v2</code> 로 관측됐습니다. v2가 다른 경로에도 존재하는지는 확인되지 않았습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/manage@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/stats\" data-nav>Stats</a> · <a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/notification\" data-nav>Notification</a> · <a href=\"#/reference/deprecated\" data-nav>제외된 API</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "수록-범위", "text": "수록 범위"}, {"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "스트리밍-정보-조회", "text": "스트리밍 정보 조회"}, {"level": 2, "id": "방송-설정-조회", "text": "방송 설정 조회"}, {"level": 2, "id": "확인된-파라미터-값", "text": "확인된 파라미터 값"}, {"level": 2, "id": "응답-스키마-미상--11건", "text": "응답 스키마 미상 — 11건"}, {"level": 2, "id": "미포착-2건", "text": "미포착 2건"}, {"level": 2, "id": "미수록-경로", "text": "미수록 경로"}, {"level": 2, "id": "공개-api-와-겹치는-경로", "text": "공개 API 와 겹치는 경로"}, {"level": 2, "id": "버전", "text": "버전"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/notification": {"title": "Notification", "html": "<h1 id=\"notification\">Notification<a class=\"anchor\" href=\"#/modules/notification@notification\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>알림 API로 개인 알림 소켓의 접속 URL을 발급받고 알림 이벤트를 수신할 수 있습니다.<br>소켓 URL 발급에는 로그인이 필요하며, 이벤트 세션 URL 발급에는 채널 권한이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>wss://ssio{N}.nchat.naver.com/socket.io/</code> · <code>https://api.chzzk.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/manage\" data-nav>Manage</a></td></tr></tbody></table></div>\n<p>호스트명이 <code>nchat</code> 이라 채팅으로 오인하기 쉽습니다. 관측된 WebSocket 프레임 8개는 모두 핸드셰이크(<code>0{sid...}</code>, <code>40</code>)와 하트비트(<code>2</code>, <code>3</code>)였으며 채팅 페이로드는 없었습니다. 앱 식별자도 <code>nng@glive</code> 입니다. 개인 알림 채널입니다. 실시간 채팅은 <a href=\"#/modules/chat\" data-nav>Chat</a>에 있습니다.</p>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/notification@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측 · 인증 필요</td><td><strong>GET /service/v1/personal/session-url</strong></td><td><a href=\"#/modules/notification@알림-소켓-url-발급\" data-nav>알림 소켓 URL 발급</a></td></tr><tr><td>스키마 미상 · 인증 필요</td><td><strong>GET /manage/v1/alerts/{sessionIOChannelId}/session-url</strong></td><td><a href=\"#/modules/notification@이벤트-세션-url-발급\" data-nav>이벤트 세션 URL 발급</a></td></tr><tr><td>실측</td><td><strong>WSS ssio{N}.nchat.naver.com/socket.io/</strong></td><td><a href=\"#/modules/notification@socketio-연결\" data-nav>Socket.IO 연결</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /v1/notification/new</strong></td><td><a href=\"#/modules/notification@새-알림-여부-조회\" data-nav>새 알림 여부 조회</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"알림-소켓-url-발급\">알림 소켓 URL 발급<a class=\"anchor\" href=\"#/modules/notification@알림-소켓-url-발급\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>개인 알림 소켓에 접속할 URL을 발급받을 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<p>경로가 <code>personal</code> 이라 개인 데이터 조회로 보이지만 실제로는 소켓 URL 발급 API입니다. 개인 설정 데이터는 <a href=\"#/modules/user@개인-설정-데이터-조회\" data-nav>별도 엔드포인트</a>입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/personal/session-url</strong></td><td>알림 소켓 URL 발급</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>result.url</td><td>String</td><td>접속 URL. <code>auth</code> 토큰 포함. 민감 정보</td></tr><tr><td>result.app</td><td>String</td><td>앱 식별자. <code>nng@glive</code></td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;content&quot;: {\n    &quot;result&quot;: {\n      &quot;url&quot;: &quot;https://ssio24.nchat.naver.com:443?auth=&lt;token&gt;&quot;,\n      &quot;app&quot;: &quot;nng@glive&quot;\n    }\n  }\n}</code></pre></div>\n<p>URL 전체를 서버가 반환하므로 서버 번호를 계산할 필요가 없습니다. 관측된 번호는 <code>ssio07</code>, <code>ssio09</code>, <code>ssio24</code>, <code>ssio25</code> 이며 임의로 배정됩니다.</p>\n<p><code>auth</code> 토큰으로 개인 알림을 수신할 수 있습니다. 공유하지 않으며 문서에 옮길 때는 플레이스홀더로 치환합니다.</p>\n<hr>\n<h2 id=\"socketio-연결\">Socket.IO 연결<a class=\"anchor\" href=\"#/modules/notification@socketio-연결\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"code\"><pre><code>wss://ssio{N}.nchat.naver.com/socket.io/?auth=&lt;token&gt;&amp;EIO=3&amp;transport=websocket</code></pre></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>auth</td><td>String</td><td>*</td><td><a href=\"#/modules/notification@알림-소켓-url-발급\" data-nav>발급받은 URL</a>에서 추출한 토큰</td></tr><tr><td>EIO</td><td>Int</td><td>*</td><td><code>3</code>. Engine.IO v3</td></tr><tr><td>transport</td><td>String</td><td>*</td><td><code>websocket</code></td></tr></tbody></table></div>\n<h3 id=\"클라이언트-버전\">클라이언트 버전<a class=\"anchor\" href=\"#/modules/notification@클라이언트-버전\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>socket.io-client</code> v4는 기본값이 <code>EIO=4</code> 이므로 그대로 접속하면 실패합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>방법</th><th>내용</th></tr></thead><tbody><tr><td>클라이언트 버전 맞추기</td><td><code>socket.io-client@2.x</code> 사용</td></tr><tr><td>프로토콜 강제</td><td>옵션으로 <code>EIO=3</code> 지정</td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">js</span><pre><code class=\"lang-js\">// socket.io-client v2\nconst io = require(&#x27;socket.io-client&#x27;);\nconst socket = io(&#x27;https://ssio24.nchat.naver.com&#x27;, {\n  query: { auth: &#x27;&lt;token&gt;&#x27; },\n  transports: [&#x27;websocket&#x27;],\n});</code></pre></div>\n<h3 id=\"관측된-프레임\">관측된 프레임<a class=\"anchor\" href=\"#/modules/notification@관측된-프레임\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>프레임</th><th>의미</th></tr></thead><tbody><tr><td><code>0{&quot;sid&quot;:&quot;...&quot;,&quot;upgrades&quot;:[],&quot;pingInterval&quot;:25000,&quot;pingTimeout&quot;:60000}</code></td><td>Engine.IO 핸드셰이크</td></tr><tr><td><code>40</code></td><td>Socket.IO 연결</td></tr><tr><td><code>2</code> / <code>3</code></td><td>ping / pong</td></tr></tbody></table></div>\n<p>이벤트 페이로드는 관측되지 않았습니다. 알림이 실제로 발생해야 확인할 수 있습니다.</p>\n<hr>\n<h2 id=\"이벤트-세션-url-발급\">이벤트 세션 URL 발급<a class=\"anchor\" href=\"#/modules/notification@이벤트-세션-url-발급\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>후원, 구독 등 개별 이벤트 세션의 접속 URL을 발급받을 수 있습니다.<br>이 API를 호출하려면 채널 권한이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /manage/v1/alerts/{sessionIOChannelId}/session-url</strong></td><td>이벤트 세션 URL 발급</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>sessionIOChannelId</td><td>String</td><td>*</td><td><code>{type}@{...}</code> 형식. <a href=\"#/modules/notification@이벤트-세션-9종\" data-nav>아래 9종</a></td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<p>캡처 시점에 <code>url</code> 과 <code>app</code> 이 비어 있었습니다. 실제 알림 소켓 연결이 발생하지 않아서로 추정됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>미확인 항목</th><th>확인 방법</th></tr></thead><tbody><tr><td>url · app 의 실제 값</td><td>후원이나 구독이 실제 발생한 상태에서 재캡처</td></tr><tr><td>각 채널의 이벤트 페이로드 구조</td><td>9종 전량 미확인. 위와 같음</td></tr></tbody></table></div>\n<p>후원 알림 오버레이나 실시간 구독 감지를 구현할 때 사용하는 경로입니다. 현재는 경로만 확인됐고 페이로드 구조는 확인되지 않았습니다.</p>\n<h3 id=\"이벤트-세션-9종\">이벤트 세션 9종<a class=\"anchor\" href=\"#/modules/notification@이벤트-세션-9종\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{channelId}/streaming-info</code> 응답에서 확인할 수 있습니다. (<a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>sessionIOChannelId</th><th>용도</th></tr></thead><tbody><tr><td>donation@…</td><td>후원</td></tr><tr><td>subscription@…</td><td>구독</td></tr><tr><td>gift@…</td><td>선물</td></tr><tr><td>partydonation@…</td><td>파티 후원</td></tr><tr><td>mission@…</td><td>미션 후원</td></tr><tr><td>newsfeed@…</td><td>뉴스피드</td></tr><tr><td>video@…</td><td>영상</td></tr><tr><td>studio@…</td><td>스튜디오</td></tr><tr><td>streamershop@…</td><td>스트리머 상점</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"새-알림-여부-조회\">새 알림 여부 조회<a class=\"anchor\" href=\"#/modules/notification@새-알림-여부-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>읽지 않은 알림의 존재 여부를 조회할 수 있습니다.<br>소켓을 사용하지 않고 폴링으로 확인할 때 사용합니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/notification/new</strong></td><td>새 알림 여부 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/notification@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/manage\" data-nav>Manage</a> · <a href=\"#/modules/user\" data-nav>User</a> · <a href=\"#/modules/commerce\" data-nav>Commerce</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "알림-소켓-url-발급", "text": "알림 소켓 URL 발급"}, {"level": 2, "id": "socketio-연결", "text": "Socket.IO 연결"}, {"level": 3, "id": "클라이언트-버전", "text": "클라이언트 버전"}, {"level": 3, "id": "관측된-프레임", "text": "관측된 프레임"}, {"level": 2, "id": "이벤트-세션-url-발급", "text": "이벤트 세션 URL 발급"}, {"level": 3, "id": "이벤트-세션-9종", "text": "이벤트 세션 9종"}, {"level": 2, "id": "새-알림-여부-조회", "text": "새 알림 여부 조회"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/stats": {"title": "Stats", "html": "<h1 id=\"stats\">Stats<a class=\"anchor\" href=\"#/modules/stats@stats\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>통계 API로 본인 채널의 방송별 통계와 VOD별 통계를 조회할 수 있습니다.<br>이 API를 호출하려면 본인 채널 권한이 필요합니다.<br>타 채널의 통계는 조회할 수 없습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com/manage/v1</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/manage\" data-nav>Manage</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a></td></tr></tbody></table></div>\n<p>치지직 API에는 시계열 데이터가 없어 직접 폴링해서 축적해야 한다고 알려져 있으나, 이는 타 채널에 한한 이야기입니다. 본인 채널은 이 API로 과거 통계를 조회할 수 있습니다. 폴링 수집은 타 채널을 분석할 때만 필요합니다. (<a href=\"#/reference/analytics\" data-nav>채널 애널리틱스 참조</a>)</p>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/stats@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/stats/lives</strong></td><td><a href=\"#/modules/stats@방송별-통계-조회\" data-nav>방송별 통계 조회</a></td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/stats/videos</strong></td><td><a href=\"#/modules/stats@vod별-통계-조회\" data-nav>VOD별 통계 조회</a></td></tr><tr><td>스키마 미상</td><td><strong>GET /channels/{channelId}/stats/recent-live</strong></td><td><a href=\"#/modules/stats@최근-방송-통계-조회\" data-nav>최근 방송 통계 조회</a></td></tr></tbody></table></div>\n<p>경로, 인증, 파라미터는 확정됐으나 배열 항목의 구조는 확인되지 않았습니다. (<a href=\"#/modules/stats@미확인--일별-배열-항목-구조\" data-nav>아래 참조</a>)</p>\n<hr>\n<h2 id=\"방송별-통계-조회\">방송별 통계 조회<a class=\"anchor\" href=\"#/modules/stats@방송별-통계-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>기간 내 방송별 통계를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /channels/{channelId}/stats/lives</strong></td><td>방송별 통계 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>channelId</td><td>String</td><td>*</td><td>본인 채널 식별자</td></tr><tr><td>from</td><td>String</td><td>*</td><td>조회 시작일. <code>YYYY-MM-DD</code></td></tr><tr><td>to</td><td>String</td><td>*</td><td>조회 종료일. <code>YYYY-MM-DD</code></td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>liveStatList</td><td>Object[]</td><td>방송별 통계 목록. 항목 구조 미확인</td></tr><tr><td>summaryLiveStat</td><td>Object</td><td>요약. 스키마 미확인</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"vod별-통계-조회\">VOD별 통계 조회<a class=\"anchor\" href=\"#/modules/stats@vod별-통계-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>기간 내 VOD별 통계를 조회할 수 있습니다.<br>이 모듈에서 요약 스키마가 확정된 유일한 API입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /channels/{channelId}/stats/videos</strong></td><td>VOD별 통계 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<p><a href=\"#/modules/stats@방송별-통계-조회\" data-nav>방송별 통계 조회</a>와 같습니다.</p>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>videoStatList</td><td>Object[]</td><td>VOD별 통계 목록. 항목 구조 미확인</td></tr><tr><td>summaryVideoStat</td><td>Object</td><td>요약. 필드 의미 확정</td></tr></tbody></table></div>\n<p><strong>summaryVideoStat</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>pv</td><td>Int</td><td>조회수</td></tr><tr><td>uv</td><td>Int</td><td>순 방문자 수</td></tr><tr><td>avgCv</td><td>Int</td><td>평균 동시 시청자 수</td></tr><tr><td>peakCv</td><td>Int</td><td>최고 동시 시청자 수</td></tr><tr><td>totalKeepWatchingTime</td><td>Int</td><td>총 시청 지속시간</td></tr><tr><td>avgKeepWatchingTime</td><td>Int</td><td>평균 시청 지속시간</td></tr><tr><td>avgKeepWatchingRate</td><td>Number</td><td>평균 시청 유지율</td></tr><tr><td>duration</td><td>Int</td><td>길이</td></tr><tr><td>date</td><td>String</td><td>날짜</td></tr></tbody></table></div>\n<p><code>avgCv</code>, <code>peakCv</code>, <code>avgKeepWatchingRate</code> 는 공개 API로는 얻을 수 없는 값입니다. 공개 API의 <code>concurrentUserCount</code> 는 특정 시점의 스냅샷이고 <code>livePv</code> 는 누적 조회수이므로 대체할 수 없습니다.</p>\n<hr>\n<h2 id=\"최근-방송-통계-조회\">최근 방송 통계 조회<a class=\"anchor\" href=\"#/modules/stats@최근-방송-통계-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>가장 최근 방송의 통계를 조회할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /channels/{channelId}/stats/recent-live</strong></td><td>최근 방송 통계 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다. 캡처에서 응답 전체가 <code>null</code> 로 관측됐습니다.</p>\n<hr>\n<h2 id=\"미확인--일별-배열-항목-구조\">미확인 — 일별 배열 항목 구조<a class=\"anchor\" href=\"#/modules/stats@미확인--일별-배열-항목-구조\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>캡처한 채널에 방송 이력이 없어 배열이 모두 비어 있었습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>응답 필드</th><th>관측값</th></tr></thead><tbody><tr><td>liveStatList</td><td>빈 배열</td></tr><tr><td>videoStatList</td><td>빈 배열</td></tr><tr><td>summaryLiveStat</td><td><code>null</code></td></tr><tr><td>recent-live 전체</td><td><code>null</code></td></tr></tbody></table></div>\n<p>확인되지 않은 사항은 다음과 같습니다.</p>\n<ul><li><code>liveStatList</code> 항목 하나의 필드 구성</li><li><code>videoStatList</code> 항목이 <code>summaryVideoStat</code> 과 같은 필드를 사용하는지 여부</li><li><code>summaryLiveStat</code> 이 <code>summaryVideoStat</code> 과 같은 스키마인지 여부</li><li>일별 집계인지 방송별 집계인지 여부</li></ul>\n<p>본인 채널로 방송을 진행한 뒤 다음 날 스튜디오를 재캡처하면 일괄 확인할 수 있습니다. 같은 캡처로 <a href=\"#/modules/manage@응답-스키마-미상--11건\" data-nav>Manage의 스키마 미상 11건</a>도 함께 확인됩니다.</p>\n<p>재캡처 시 응답 본문까지 스크럽해야 합니다. 같은 세션에 <code>streaming-info</code> 의 스트림 키가 포함됩니다. (<a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회 참조</a>)</p>\n<hr>\n<h2 id=\"본인-채널-한정\">본인 채널 한정<a class=\"anchor\" href=\"#/modules/stats@본인-채널-한정\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>타 채널의 통계는 이 API로 조회할 수 없습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>대상</th><th>방법</th></tr></thead><tbody><tr><td>본인 채널</td><td>이 문서의 API로 과거 데이터 조회</td></tr><tr><td>타 채널</td><td>공개 지표와 자체 폴링 (<a href=\"#/reference/analytics@트랙-b--타-채널\" data-nav>트랙 B 참조</a>)</td></tr></tbody></table></div>\n<p>시청 지속시간, 유입 경로, 시청자 연령과 성별, 팔로워 증감 상세, 정산과 수익은 모두 스튜디오 전용입니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/stats@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/manage\" data-nav>Manage</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "방송별-통계-조회", "text": "방송별 통계 조회"}, {"level": 2, "id": "vod별-통계-조회", "text": "VOD별 통계 조회"}, {"level": 2, "id": "최근-방송-통계-조회", "text": "최근 방송 통계 조회"}, {"level": 2, "id": "미확인--일별-배열-항목-구조", "text": "미확인 — 일별 배열 항목 구조"}, {"level": 2, "id": "본인-채널-한정", "text": "본인 채널 한정"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/user": {"title": "User", "html": "<h1 id=\"user\">User<a class=\"anchor\" href=\"#/modules/user@user\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>사용자 API로 로그인 상태, 차단 목록, 배지, 닉네임 색상 코드를 조회할 수 있습니다.<br>6건 중 4건이 로그인을 요구합니다.<br>로그인 사용자 본인에 대한 정보를 다루므로 타 채널 분석에는 사용하지 않습니다. (<a href=\"#/reference/analytics\" data-nav>채널 애널리틱스 참조</a>)</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://comm-api.game.naver.com/nng_main</code> · <code>https://api.chzzk.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code> (<a href=\"#/core/conventions@응답-봉투\" data-nav>참조</a>)</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/notification\" data-nav>Notification</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/user@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측 · 인증 필요</td><td><strong>GET /v1/user/getUserStatus</strong></td><td><a href=\"#/modules/user@로그인-상태-조회\" data-nav>로그인 상태 조회</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /v1/privateUserBlocks/allUserIdHash</strong></td><td><a href=\"#/modules/user@차단-목록-조회\" data-nav>차단 목록 조회</a></td></tr><tr><td>경로만 확인 · 인증 필요</td><td><strong>GET /service/v1/personal/personal-data</strong></td><td><a href=\"#/modules/user@개인-설정-데이터-조회\" data-nav>개인 설정 데이터 조회</a></td></tr><tr><td>실측 · 인증 필요</td><td><strong>GET /service/v1/badge-awards/unread</strong></td><td><a href=\"#/modules/user@안-읽은-배지-조회\" data-nav>안 읽은 배지 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/badges/assets/last-updated</strong></td><td><a href=\"#/modules/user@배지-에셋-갱신-시각-조회\" data-nav>배지 에셋 갱신 시각 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v2/nickname/color/codes</strong></td><td><a href=\"#/modules/user@닉네임-색상-코드-조회\" data-nav>닉네임 색상 코드 조회</a></td></tr></tbody></table></div>\n<p>알림 소켓 발급 경로인 <code>personal/session-url</code> 은 이 모듈이 아니라 <a href=\"#/modules/notification\" data-nav>Notification</a>에 있습니다. 경로가 비슷하므로 혼동에 주의합니다.</p>\n<hr>\n<h2 id=\"로그인-상태-조회\">로그인 상태 조회<a class=\"anchor\" href=\"#/modules/user@로그인-상태-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>로그인 여부와 기본 사용자 정보를 조회할 수 있습니다.<br>쿠키의 유효성을 확인하는 가장 가벼운 방법입니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/user/getUserStatus</strong></td><td>로그인 상태 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>userIdHash</td><td>String</td><td>사용자 해시. 32자</td></tr><tr><td>nickname</td><td>String</td><td>닉네임</td></tr><tr><td>profileImageUrl</td><td>String</td><td>프로필 이미지 URL</td></tr><tr><td>loggedIn</td><td>Boolean</td><td>로그인 여부</td></tr></tbody></table></div>\n<p><code>userIdHash</code> 는 <code>channelId</code> 와 형식이 같은 32자 hex입니다. 스트리머 본인은 두 값이 동일합니다. (<a href=\"#/core/conventions@헷갈리는-3쌍\" data-nav>식별자 참조</a>)</p>\n<p><strong>오류</strong></p>\n<p>쿠키가 없거나 만료된 경우 HTTP 401이 아니라 <code>loggedIn: false</code> 로 반환됩니다. 응답 봉투는 성공이므로 <code>loggedIn</code> 값을 직접 확인해야 합니다.</p>\n<hr>\n<h2 id=\"차단-목록-조회\">차단 목록 조회<a class=\"anchor\" href=\"#/modules/user@차단-목록-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>로그인 사용자가 차단한 사용자 목록을 조회할 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://comm-api.game.naver.com/nng_main/v1/privateUserBlocks/allUserIdHash</strong></td><td>차단 목록 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>content</td><td>String[]</td><td>차단한 사용자의 <code>userIdHash</code> 목록</td></tr></tbody></table></div>\n<p>댓글과 채팅 응답의 <code>privateUserBlock</code> 필드와 대응합니다. 클라이언트에서 차단 사용자를 숨길 때 이 목록으로 필터링합니다.</p>\n<hr>\n<h2 id=\"개인-설정-데이터-조회\">개인 설정 데이터 조회<a class=\"anchor\" href=\"#/modules/user@개인-설정-데이터-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>로그인 사용자의 개인 설정 데이터를 조회할 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/personal/personal-data</strong></td><td>개인 설정 데이터 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>fields</td><td>String</td><td>*</td><td>조회할 항목. 콤마로 구분. <a href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav>채널 부가 데이터 조회</a>와 같은 패턴</td></tr></tbody></table></div>\n<p>사용 가능한 <code>fields</code> 값과 응답 스키마는 이번 캡처에서 확인되지 않았습니다.</p>\n<hr>\n<h2 id=\"안-읽은-배지-조회\">안 읽은 배지 조회<a class=\"anchor\" href=\"#/modules/user@안-읽은-배지-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>읽지 않은 배지 획득 알림을 조회할 수 있습니다.<br>이 API를 호출하려면 로그인이 필요합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/badge-awards/unread</strong></td><td>안 읽은 배지 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<p>채널의 업적 배지는 이 모듈이 아니라 <a href=\"#/modules/channel@엔드포인트\" data-nav>Channel</a>의 <code>achievement-badges</code> 에 있습니다.</p>\n<hr>\n<h2 id=\"배지-에셋-갱신-시각-조회\">배지 에셋 갱신 시각 조회<a class=\"anchor\" href=\"#/modules/user@배지-에셋-갱신-시각-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>배지 이미지 에셋의 갱신 시각을 조회할 수 있습니다. 캐시 무효화에 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/badges/assets/last-updated</strong></td><td>배지 에셋 갱신 시각 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>badgeType</td><td>String</td><td>*</td><td>배지 종류</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"닉네임-색상-코드-조회\">닉네임 색상 코드 조회<a class=\"anchor\" href=\"#/modules/user@닉네임-색상-코드-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>채팅에 사용되는 닉네임 색상 코드 목록을 조회할 수 있습니다.</p>\n<p>경로 버전이 <code>v2</code> 입니다. 이 모듈에서 유일합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v2/nickname/color/codes</strong></td><td>닉네임 색상 코드 조회</td></tr></tbody></table></div>\n<p>요청 파라미터가 없습니다.</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/user@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/notification\" data-nav>Notification</a> · <a href=\"#/core/conventions\" data-nav>공통 규칙</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "로그인-상태-조회", "text": "로그인 상태 조회"}, {"level": 2, "id": "차단-목록-조회", "text": "차단 목록 조회"}, {"level": 2, "id": "개인-설정-데이터-조회", "text": "개인 설정 데이터 조회"}, {"level": 2, "id": "안-읽은-배지-조회", "text": "안 읽은 배지 조회"}, {"level": 2, "id": "배지-에셋-갱신-시각-조회", "text": "배지 에셋 갱신 시각 조회"}, {"level": 2, "id": "닉네임-색상-코드-조회", "text": "닉네임 색상 코드 조회"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "modules/video": {"title": "Video", "html": "<h1 id=\"video\">Video<a class=\"anchor\" href=\"#/modules/video@video\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>VOD API로 다시보기 상세 정보, 다시보기 채팅, 재생 매니페스트를 조회할 수 있습니다.<br>인증이 필요하지 않습니다.<br>다시보기 채팅은 WebSocket 없이 HTTP만으로 전량 수집할 수 있어 채널 분석의 주 데이터원이 됩니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>Base URL</td><td><code>https://api.chzzk.naver.com</code>. 매니페스트만 <code>apis.naver.com</code></td></tr><tr><td>응답 봉투</td><td>A형. <code>code == 200</code>. 매니페스트만 XML</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/comment\" data-nav>Comment</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"엔드포인트\">엔드포인트<a class=\"anchor\" href=\"#/modules/video@엔드포인트\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td>실측</td><td><strong>GET /service/v3/videos/{videoNo}</strong></td><td><a href=\"#/modules/video@vod-상세-조회\" data-nav>VOD 상세 조회</a></td></tr><tr><td>실측</td><td><strong>GET /service/v1/videos/{videoNo}/chats</strong></td><td><a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 조회</a></td></tr><tr><td>실측</td><td><strong>GET /neonplayer/vodplay/v3/playback/{videoId}</strong></td><td><a href=\"#/modules/video@재생-매니페스트-조회\" data-nav>재생 매니페스트 조회</a></td></tr></tbody></table></div>\n<p><code>videoNo</code> 와 <code>videoId</code> 는 용도가 다릅니다. (<a href=\"#/core/conventions@식별자\" data-nav>식별자 참조</a>)</p>\n<hr>\n<h2 id=\"vod-객체\">VOD 객체<a class=\"anchor\" href=\"#/modules/video@vod-객체\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/video@vod-상세-조회\" data-nav>VOD 상세 조회</a>가 반환하는 객체입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>videoNo</td><td>Int</td><td>VOD 번호. 댓글과 채팅 API가 사용</td></tr><tr><td>videoId</td><td>String</td><td>재생용 식별자. 36자</td></tr><tr><td>videoTitle</td><td>String</td><td>VOD 제목</td></tr><tr><td>videoType</td><td>String</td><td><code>REPLAY</code> 또는 <code>UPLOAD</code></td></tr><tr><td>duration</td><td>Int</td><td>길이. 단위는 초</td></tr><tr><td>livePv</td><td>Int</td><td>생방송 당시 시청자 수</td></tr><tr><td>readCount</td><td>Int</td><td>VOD 조회수. <code>livePv</code> 와 다른 값</td></tr><tr><td>liveOpenDate</td><td>String</td><td>원래 방송이 시작된 일시</td></tr><tr><td>publishDate</td><td>String</td><td>VOD가 게시된 일시. <code>liveOpenDate</code> 와 다름</td></tr><tr><td>publishDateAt</td><td>Int</td><td>게시 일시. epoch ms</td></tr><tr><td>inKey</td><td>String</td><td>재생 매니페스트의 <code>key</code> 파라미터. 민감 정보</td></tr><tr><td>radioModeInKey</td><td>String</td><td>라디오 모드용 재생 키</td></tr><tr><td>prevVideo</td><td>Object</td><td>이전 VOD 요약</td></tr><tr><td>nextVideo</td><td>Object</td><td>다음 VOD 요약. <a href=\"#/modules/video@vod-체인\" data-nav>VOD 체인</a>에 사용</td></tr><tr><td>videoChatChannelId</td><td>String</td><td>다시보기 채팅용 채팅방 식별자</td></tr><tr><td>videoChatEnabled</td><td>Boolean</td><td>다시보기 채팅 제공 여부</td></tr><tr><td>chapterActive</td><td>Boolean</td><td>챕터 사용 여부</td></tr><tr><td>chapters</td><td>Object[]</td><td>챕터 목록. 빈 배열 사례만 관측</td></tr><tr><td>watchTimeline</td><td>Int</td><td>시청 위치. 단위는 초. 용도 미확인</td></tr><tr><td>vodStatus</td><td>String</td><td><code>ABR_HLS</code></td></tr><tr><td>categoryType</td><td>String</td><td>카테고리 분류 (<a href=\"#/reference/enums\" data-nav>Enum 참조</a>)</td></tr><tr><td>videoCategory</td><td>String</td><td>카테고리 코드</td></tr><tr><td>channel</td><td>Object</td><td><code>channelId</code>, <code>channelName</code>, <code>verifiedMark</code></td></tr><tr><td>streamerShopCatalogTagActive</td><td>Boolean</td><td>상품 태그 여부 (<a href=\"#/modules/commerce@스트리머-상점-조회\" data-nav>스트리머 상점 조회 참조</a>)</td></tr><tr><td>exposure · adult · blindType</td><td></td><td>노출 제한 정보</td></tr></tbody></table></div>\n<p>응답에 재생 키 <code>inKey</code> 가 포함됩니다. 원본을 보관하는 것은 무방하나 로그나 화면에 출력하지 않습니다.</p>\n<h3 id=\"livepv-와-readcount\">livePv 와 readCount<a class=\"anchor\" href=\"#/modules/video@livepv-와-readcount\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>두 값은 모집단이 다릅니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>의미</th></tr></thead><tbody><tr><td>livePv</td><td>생방송 당시 시청자 수</td></tr><tr><td>readCount</td><td>VOD 조회수</td></tr></tbody></table></div>\n<p>서로 다른 지표이므로 합산하면 의미가 없습니다.</p>\n<h3 id=\"liveopendate-와-publishdate\">liveOpenDate 와 publishDate<a class=\"anchor\" href=\"#/modules/video@liveopendate-와-publishdate\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>publishDate</code> 는 VOD가 게시된 시각이며 방송 시작보다 늦습니다. 캡처에서는 18:30에 시작한 방송의 VOD가 19:06에 게시됐습니다. 방송 구간을 계산할 때는 <code>liveOpenDate</code> 를 사용합니다.</p>\n<hr>\n<h2 id=\"vod-상세-조회\">VOD 상세 조회<a class=\"anchor\" href=\"#/modules/video@vod-상세-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>VOD 하나의 상세 정보를 조회할 수 있습니다.</p>\n<p>경로 버전이 <code>v3</code> 입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v3/videos/{videoNo}</strong></td><td>VOD 상세 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>videoNo</td><td>Int</td><td>*</td><td>조회할 VOD 번호</td></tr><tr><td>dt</td><td>String</td><td>optional</td><td>빈 값으로 전달. 용도 미확인</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<p><code>content</code> 가 <a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체</a>입니다.</p>\n<details><summary>응답 예시</summary>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;code&quot;: 200,\n  &quot;content&quot;: {\n    &quot;videoNo&quot;: 14350160,\n    &quot;videoId&quot;: &quot;89FC02148E88ADA8667456C6A3282113CD28&quot;,\n    &quot;videoTitle&quot;: &quot;...&quot;, &quot;videoType&quot;: &quot;REPLAY&quot;,\n    &quot;publishDate&quot;: &quot;2026-07-24 19:06:56&quot;, &quot;publishDateAt&quot;: 1784887616367,\n    &quot;thumbnailImageUrl&quot;: &quot;...&quot;, &quot;trailerUrl&quot;: null,\n    &quot;duration&quot;: 2111, &quot;readCount&quot;: 324, &quot;livePv&quot;: 9806,\n    &quot;categoryType&quot;: &quot;ETC&quot;, &quot;videoCategory&quot;: &quot;talk&quot;, &quot;videoCategoryValue&quot;: &quot;talk&quot;,\n    &quot;exposure&quot;: true, &quot;adult&quot;: false, &quot;clipActive&quot;: true, &quot;commentActive&quot;: true,\n    &quot;tags&quot;: [&quot;...&quot;],\n    &quot;channel&quot;: { &quot;channelId&quot;: &quot;...&quot;, &quot;channelName&quot;: &quot;...&quot;, &quot;verifiedMark&quot;: true,\n                 &quot;activatedChannelBadgeIds&quot;: [] },\n    &quot;blindType&quot;: null, &quot;watchTimeline&quot;: 24,\n    &quot;paidProductId&quot;: null, &quot;tvAppViewingPolicyType&quot;: &quot;ALLOWED&quot;,\n\n    &quot;liveOpenDate&quot;: &quot;2026-07-24 18:30:47&quot;,\n    &quot;chapterActive&quot;: false, &quot;chapters&quot;: [],\n    &quot;inKey&quot;: &quot;&lt;재생 키&gt;&quot;, &quot;radioModeInKey&quot;: &quot;&lt;라디오모드 키&gt;&quot;,\n    &quot;previewUrl&quot;: &quot;...&quot;, &quot;vodStatus&quot;: &quot;ABR_HLS&quot;,\n    &quot;liveRewindPlaybackJson&quot;: null, &quot;encryptionType&quot;: null,\n    &quot;prevVideo&quot;: null,\n    &quot;nextVideo&quot;: { &quot;videoNo&quot;: 14324879, &quot;videoId&quot;: &quot;...&quot;, &quot;videoTitle&quot;: &quot;...&quot;,\n                   &quot;videoType&quot;: &quot;REPLAY&quot;, &quot;publishDate&quot;: &quot;...&quot;, &quot;thumbnailImageUrl&quot;: &quot;...&quot;,\n                   &quot;trailerUrl&quot;: &quot;...&quot; },\n    &quot;videoChatEnabled&quot;: true, &quot;videoChatChannelId&quot;: &quot;&lt;chatChannelId&gt;&quot;,\n    &quot;paidProduct&quot;: null, &quot;membershipBenefitType&quot;: null,\n    &quot;adParameter&quot;: {...}, &quot;dab&quot;: {...},\n    &quot;streamerShopCatalogTagActive&quot;: false, &quot;aiCaptionActive&quot;: false,\n    &quot;paidPromotion&quot;: false, &quot;userAdultStatus&quot;: null\n  }\n}</code></pre></div>\n</details>\n<h3 id=\"vod-체인\">VOD 체인<a class=\"anchor\" href=\"#/modules/video@vod-체인\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>nextVideo.videoNo</code> 를 따라가면 채널의 전체 VOD를 순회할 수 있습니다. <a href=\"#/modules/channel@vod-목록-조회\" data-nav>VOD 목록 조회</a>의 페이지네이션보다 누락이 적습니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def walk_vods(start_video_no, headers):\n    no = start_video_no\n    while no:\n        v = unwrap(requests.get(f&quot;{BASE}/service/v3/videos/{no}&quot;, headers=headers))\n        yield v\n        nxt = v.get(&quot;nextVideo&quot;)\n        no = nxt[&quot;videoNo&quot;] if nxt else None</code></pre></div>\n<p>응답에 고리가 있으면 순회가 끝나지 않습니다. 방문한 <code>videoNo</code> 를 기록해 중복을 확인하는 편이 안전합니다.</p>\n<hr>\n<h2 id=\"다시보기-채팅-조회\">다시보기 채팅 조회<a class=\"anchor\" href=\"#/modules/video@다시보기-채팅-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>VOD에 남은 채팅 로그를 조회할 수 있습니다.<br>WebSocket이나 토큰 발급 없이 HTTP만으로 전량 수집할 수 있습니다.<br>실시간 수신이 필요한 경우에만 <a href=\"#/modules/chat\" data-nav>Chat</a>을 사용합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET /service/v1/videos/{videoNo}/chats</strong></td><td>다시보기 채팅 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>videoNo</td><td>Int</td><td>*</td><td>조회할 VOD 번호</td></tr><tr><td>playerMessageTime</td><td>Int</td><td>*</td><td>재생 위치. 단위는 밀리초. 첫 요청은 0</td></tr><tr><td>previousVideoChatSize</td><td>Int</td><td>*</td><td>함께 반환할 이전 채팅 개수. 50 확인</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>nextPlayerMessageTime</td><td>Int</td><td>다음 요청에 사용할 <code>playerMessageTime</code></td></tr><tr><td>videoChats</td><td>Object[]</td><td>채팅 메시지 목록</td></tr><tr><td>previousVideoChats</td><td>Object[]</td><td>이전 채팅 목록</td></tr></tbody></table></div>\n<p><strong>videoChats</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td>playerMessageTime</td><td>Int</td><td>재생 위치. 단위는 밀리초</td></tr><tr><td>messageTime</td><td>Int</td><td>실제 발생 시각. epoch ms</td></tr><tr><td>content</td><td>String</td><td>채팅 내용</td></tr><tr><td>messageTypeCode</td><td>Int</td><td>메시지 종류. <code>1</code> TEXT, <code>10</code> DONATION, <code>11</code> SUBSCRIPTION, <code>30</code> SYSTEM (<a href=\"#/reference/enums@채팅\" data-nav>Enum 참조</a>)</td></tr><tr><td>messageStatusType</td><td>String</td><td>메시지 상태. <code>NORMAL</code> 등</td></tr><tr><td>userIdHash</td><td>String</td><td>작성자 해시. 시스템 메시지는 <code>SYSTEM_MESSAGE</code> 리터럴</td></tr><tr><td>chatChannelId</td><td>String</td><td>채팅방 식별자</td></tr><tr><td>extras</td><td>String</td><td>문자열로 감싸진 JSON (<a href=\"#/core/conventions@문자열로-감싸진-json\" data-nav>참조</a>)</td></tr><tr><td>profile</td><td>String</td><td>문자열로 감싸진 JSON. 시스템 메시지면 <code>&quot;{}&quot;</code></td></tr></tbody></table></div>\n<div class=\"code\"><span class=\"code-lang\">json</span><pre><code class=\"lang-json\">{\n  &quot;content&quot;: {\n    &quot;nextPlayerMessageTime&quot;: 124168,\n    &quot;previousVideoChats&quot;: [],\n    &quot;videoChats&quot;: [{\n      &quot;chatChannelId&quot;: &quot;N2dboT&quot;,\n      &quot;messageTime&quot;: 1784885547666,\n      &quot;playerMessageTime&quot;: 96666,\n      &quot;userIdHash&quot;: &quot;&lt;hash&gt;&quot;,\n      &quot;content&quot;: &quot;채팅 내용&quot;,\n      &quot;messageTypeCode&quot;: 1,\n      &quot;messageStatusType&quot;: &quot;NORMAL&quot;,\n      &quot;extras&quot;: &quot;{...}&quot;,\n      &quot;profile&quot;: &quot;{...}&quot;\n    }]\n  }\n}</code></pre></div>\n<p><code>playerMessageTime</code> 의 단위는 밀리초입니다. 클립의 <code>currentTime</code> 은 초 단위이므로 두 값을 함께 다룰 때 단위가 다릅니다. (<a href=\"#/modules/clip@클립-뷰어-카드-조회\" data-nav>클립 뷰어 카드 조회 참조</a>)</p>\n<p><strong>예제</strong></p>\n<p><code>nextPlayerMessageTime</code> 을 다음 요청의 <code>playerMessageTime</code> 으로 전달하여 반복합니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">def collect_vod_chats(video_no, headers):\n    t = 0\n    while True:\n        c = unwrap(requests.get(\n            f&quot;{BASE}/service/v1/videos/{video_no}/chats&quot;,\n            params={&quot;playerMessageTime&quot;: t, &quot;previousVideoChatSize&quot;: 50},\n            headers=headers,\n        ))\n        chats = c.get(&quot;videoChats&quot;) or []\n        if not chats:\n            return\n        yield from chats\n        nt = c.get(&quot;nextPlayerMessageTime&quot;)\n        if nt is None or nt &lt;= t:      # 커서가 전진하지 않으면 종료\n            return\n        t = nt</code></pre></div>\n<p>종료 조건은 두 가지입니다. <code>videoChats</code> 가 비었거나 <code>nextPlayerMessageTime</code> 이 전진하지 않는 경우입니다. 두 번째 조건이 없으면 같은 위치를 계속 요청하게 됩니다.</p>\n<hr>\n<h2 id=\"재생-매니페스트-조회\">재생 매니페스트 조회<a class=\"anchor\" href=\"#/modules/video@재생-매니페스트-조회\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>VOD의 재생 매니페스트를 조회할 수 있습니다.<br>응답이 JSON이 아니라 DASH MPD 형식의 XML이며 응답 봉투가 없습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>HTTP Request</th><th>Description</th></tr></thead><tbody><tr><td><strong>GET https://apis.naver.com/neonplayer/vodplay/v3/playback/{videoId}</strong></td><td>재생 매니페스트 조회</td></tr></tbody></table></div>\n<p><strong>Request Param</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>required</th><th>Description</th></tr></thead><tbody><tr><td>videoId</td><td>String</td><td>*</td><td>36자 재생용 식별자. <code>videoNo</code> 가 아님</td></tr><tr><td>key</td><td>String</td><td>*</td><td><a href=\"#/modules/video@vod-상세-조회\" data-nav>VOD 상세 조회</a>의 <code>inKey</code>. 라디오 모드는 <code>radioModeInKey</code></td></tr><tr><td>sid · devt 등</td><td>String</td><td>optional</td><td>미검증</td></tr></tbody></table></div>\n<p><strong>Response Body</strong></p>\n<p><code>urn:naver:vod:2020</code> 네임스페이스로 <code>nvod:Source</code>, <code>nvod:TimeTable</code>, <code>nvod:SeekingThumbnail</code> 등이 포함됩니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>요소</th><th>내용</th></tr></thead><tbody><tr><td><code>MPD/@nvod:serverTime</code> · <code>@expireTime</code></td><td>매니페스트 서명 및 만료. ISO 8601</td></tr><tr><td><code>Period/@duration</code></td><td>길이. <code>PT1M40.224S</code> 형식</td></tr><tr><td><code>nvod:Thumbnail[n]/@targetTime</code></td><td>썸네일 시각</td></tr><tr><td><code>nvod:Tracking/nvod:TimeTable</code></td><td>QoE 전송 시점</td></tr></tbody></table></div>\n<p>화질 트랙은 <code>144p</code>, <code>360p</code>, <code>480p</code>, <code>720p</code>, <code>1080p</code>, <code>alow.stream</code> 이 관측됐습니다.</p>\n<p>클립의 매니페스트에 있는 시간값은 모두 클립 내부 기준입니다. 원본 방송 기준 오프셋이 아닙니다. (<a href=\"#/modules/clip@매니페스트의-시간값\" data-nav>매니페스트의 시간값 참조</a>)</p>\n<hr>\n<h2 id=\"관련-문서\">관련 문서<a class=\"anchor\" href=\"#/modules/video@관련-문서\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p><a href=\"#/modules/channel\" data-nav>Channel</a> · <a href=\"#/modules/chat\" data-nav>Chat</a> · <a href=\"#/modules/comment\" data-nav>Comment</a> · <a href=\"#/modules/clip\" data-nav>Clip</a> · <a href=\"#/reference/analytics\" data-nav>채널 애널리틱스</a> · <a href=\"#/reference/endpoints\" data-nav>엔드포인트 목록</a></p>", "toc": [{"level": 2, "id": "엔드포인트", "text": "엔드포인트"}, {"level": 2, "id": "vod-객체", "text": "VOD 객체"}, {"level": 3, "id": "livepv-와-readcount", "text": "livePv 와 readCount"}, {"level": 3, "id": "liveopendate-와-publishdate", "text": "liveOpenDate 와 publishDate"}, {"level": 2, "id": "vod-상세-조회", "text": "VOD 상세 조회"}, {"level": 3, "id": "vod-체인", "text": "VOD 체인"}, {"level": 2, "id": "다시보기-채팅-조회", "text": "다시보기 채팅 조회"}, {"level": 2, "id": "재생-매니페스트-조회", "text": "재생 매니페스트 조회"}, {"level": 2, "id": "관련-문서", "text": "관련 문서"}]}, "reference/analytics": {"title": "채널 애널리틱스", "html": "<h1 id=\"채널-애널리틱스\">채널 애널리틱스<a class=\"anchor\" href=\"#/reference/analytics@채널-애널리틱스\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>채널 지표를 수집하는 방법을 정리한 문서입니다.<br>본인 채널인지 타 채널인지에 따라 사용할 수 있는 API가 완전히 달라집니다.<br>본인 채널은 API가 과거 데이터를 제공하고, 타 채널은 공개 지표를 직접 축적해야 합니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>트랙 A</td><td>본인 채널. 채널 권한 필요</td></tr><tr><td>트랙 B</td><td>타 채널. 인증 불필요</td></tr><tr><td>관련 문서</td><td><a href=\"#/modules/stats\" data-nav>Stats</a> · <a href=\"#/modules/live\" data-nav>Live</a> · <a href=\"#/modules/video\" data-nav>Video</a></td></tr></tbody></table></div>\n<div class=\"table-wrap\"><table><thead><tr><th>항목</th><th>트랙 A — 본인 채널</th><th>트랙 B — 타 채널</th></tr></thead><tbody><tr><td>과거 데이터</td><td>API가 제공</td><td>직접 축적해야 함</td></tr><tr><td>평균·최고 동시 시청자</td><td><code>avgCv</code>, <code>peakCv</code> 제공</td><td>폴링으로 근사</td></tr><tr><td>시청 유지율</td><td><code>avgKeepWatchingRate</code> 제공</td><td>얻을 수 없음</td></tr><tr><td>필요 조건</td><td>본인 채널 로그인</td><td>없음</td></tr></tbody></table></div>\n<p>치지직에는 시계열 데이터가 없다고 알려져 있으나 이는 타 채널에 한한 이야기입니다.</p>\n<hr>\n<h2 id=\"트랙-a--본인-채널\">트랙 A — 본인 채널<a class=\"anchor\" href=\"#/reference/analytics@트랙-a--본인-채널\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"code\"><pre><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{channelId}/stats/lives?from=YYYY-MM-DD&amp;to=YYYY-MM-DD\nGET /manage/v1/channels/{channelId}/stats/videos?from=YYYY-MM-DD&amp;to=YYYY-MM-DD\nGET /manage/v1/channels/{channelId}/stats/recent-live</code></pre></div>\n<p>쿠키와 본인 채널 권한이 필요합니다. (<a href=\"#/modules/stats\" data-nav>Stats 참조</a>)</p>\n<h3 id=\"얻을-수-있는-지표\">얻을 수 있는 지표<a class=\"anchor\" href=\"#/reference/analytics@얻을-수-있는-지표\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>지표</th><th>Field</th></tr></thead><tbody><tr><td>조회수</td><td>pv</td></tr><tr><td>순 방문자 수</td><td>uv</td></tr><tr><td>평균 동시 시청자 수</td><td>avgCv</td></tr><tr><td>최고 동시 시청자 수</td><td>peakCv</td></tr><tr><td>총 시청 지속시간</td><td>totalKeepWatchingTime</td></tr><tr><td>평균 시청 지속시간</td><td>avgKeepWatchingTime</td></tr><tr><td>평균 시청 유지율</td><td>avgKeepWatchingRate</td></tr></tbody></table></div>\n<p>폴링 없이 과거 데이터를 그대로 조회할 수 있습니다.</p>\n<h3 id=\"함께-사용하는-api\">함께 사용하는 API<a class=\"anchor\" href=\"#/reference/analytics@함께-사용하는-api\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>목적</th><th>엔드포인트</th></tr></thead><tbody><tr><td>팔로워 목록</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/followers</code> (<a href=\"#/modules/manage\" data-nav>Manage 참조</a>)</td></tr><tr><td>구독자 목록</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/subscribers?sortType=RECENT</code></td></tr><tr><td>비공개 포함 VOD 목록</td><td><code><span class=\"method m-get\">GET</span> /manage/v1/channels/{id}/videos</code></td></tr></tbody></table></div>\n<h3 id=\"현재-한계\">현재 한계<a class=\"anchor\" href=\"#/reference/analytics@현재-한계\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>liveStatList</code> 와 <code>videoStatList</code> 의 항목 구조가 확인되지 않았습니다. 방송 이력이 없는 채널에서 캡처하여 배열이 비어 있었습니다. (<a href=\"#/modules/stats@미확인--일별-배열-항목-구조\" data-nav>미확인 항목 참조</a>)</p>\n<hr>\n<h2 id=\"트랙-b--타-채널\">트랙 B — 타 채널<a class=\"anchor\" href=\"#/reference/analytics@트랙-b--타-채널\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>공개 지표를 조회하고 시계열은 직접 축적합니다.</p>\n<h3 id=\"인증-없이-얻을-수-있는-지표\">인증 없이 얻을 수 있는 지표<a class=\"anchor\" href=\"#/reference/analytics@인증-없이-얻을-수-있는-지표\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>지표</th><th>엔드포인트</th><th>Field</th></tr></thead><tbody><tr><td>현재 팔로워 수</td><td><a href=\"#/modules/channel@채널-기본-정보-조회\" data-nav>채널 기본 정보 조회</a></td><td>followerCount</td></tr><tr><td>채널 개설일</td><td><a href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav>채널 부가 데이터 조회</a></td><td>channelHistory.firstLiveDate</td></tr><tr><td>누적 방송시간</td><td><a href=\"#/modules/channel@채널-부가-데이터-조회\" data-nav>채널 부가 데이터 조회</a></td><td>channelHistory.totalLiveHours</td></tr><tr><td>현재 동시 시청자 수</td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td><td>concurrentUserCount</td></tr><tr><td>방송 제목·카테고리·태그</td><td><a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a></td><td>liveTitle, liveCategory, tags</td></tr><tr><td>VOD 목록</td><td><a href=\"#/modules/channel@vod-목록-조회\" data-nav>VOD 목록 조회</a></td><td></td></tr><tr><td>VOD별 생방송 시청자 수</td><td><a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체</a></td><td>livePv</td></tr><tr><td>VOD별 다시보기 조회수</td><td><a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체</a></td><td>readCount</td></tr><tr><td>방송 실제 시작 시각</td><td><a href=\"#/modules/video@vod-객체\" data-nav>VOD 객체</a></td><td>liveOpenDate</td></tr><tr><td>클립 목록과 조회수</td><td><a href=\"#/modules/clip@채널-클립-목록-조회\" data-nav>채널 클립 목록 조회</a></td><td>readCount</td></tr><tr><td>채팅 로그 전량</td><td><a href=\"#/modules/video@다시보기-채팅-조회\" data-nav>다시보기 채팅 조회</a></td><td></td></tr><tr><td>댓글 전량</td><td><a href=\"#/modules/comment\" data-nav>Comment</a></td><td></td></tr></tbody></table></div>\n<h3 id=\"시계열-축적\">시계열 축적<a class=\"anchor\" href=\"#/reference/analytics@시계열-축적\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"code\"><pre><code>팔로워 추이  → GET /service/v1/channels/{id}                 1시간 주기 폴링 → followerCount 적재\n시청자 추이  → GET /polling/v3.1/channels/{id}/live-status   방송 중 10초 주기 → concurrentUserCount 적재</code></pre></div>\n<p>폴링 주기는 응답의 <code>livePollingStatusJson.callPeriodMilliSecond</code> 를 따릅니다. 관측값은 10000ms입니다. 이보다 자주 호출하면 IP 차단으로 이어질 수 있습니다.</p>\n<div class=\"code\"><span class=\"code-lang\">python</span><pre><code class=\"lang-python\">import json, time\n\ndef track_viewers(channel_id, headers, sink):\n    while True:\n        c = unwrap(requests.get(\n            f&quot;{BASE}/polling/v3.1/channels/{channel_id}/live-status&quot;,\n            params={&quot;includePlayerRecommendContent&quot;: &quot;false&quot;}, headers=headers))\n        if c[&quot;status&quot;] != &quot;OPEN&quot;:\n            return\n        sink(time.time(), c[&quot;concurrentUserCount&quot;])\n        time.sleep(json.loads(c[&quot;livePollingStatusJson&quot;])[&quot;callPeriodMilliSecond&quot;] / 1000)</code></pre></div>\n<h3 id=\"vod-전수-수집\">VOD 전수 수집<a class=\"anchor\" href=\"#/reference/analytics@vod-전수-수집\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>nextVideo.videoNo</code> 를 따라가면 채널의 모든 VOD를 순회할 수 있습니다. 목록 API의 페이지네이션보다 누락이 적습니다. (<a href=\"#/modules/video@vod-체인\" data-nav>VOD 체인 참조</a>)</p>\n<hr>\n<h2 id=\"수집-시-주의할-필드\">수집 시 주의할 필드<a class=\"anchor\" href=\"#/reference/analytics@수집-시-주의할-필드\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<h3 id=\"accumulatecount-는-항상-0입니다\">accumulateCount 는 항상 0입니다<a class=\"anchor\" href=\"#/reference/analytics@accumulatecount-는-항상-0입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>live-status</code> 와 <code>live-detail</code> 양쪽 모두 0으로 관측됐습니다. 필드 자체가 채워지지 않습니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>필요한 값</th><th>대체</th></tr></thead><tbody><tr><td>방송 종료 후 누적 시청자</td><td>VOD의 <code>livePv</code></td></tr><tr><td>방송 중 누적 시청자</td><td><code>concurrentUserCount</code> 를 직접 집계</td></tr></tbody></table></div>\n<h3 id=\"concurrentusercount-가-api마다-다릅니다\">concurrentUserCount 가 API마다 다릅니다<a class=\"anchor\" href=\"#/reference/analytics@concurrentusercount-가-api마다-다릅니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>엔드포인트</th><th>관측값</th></tr></thead><tbody><tr><td><code>polling/v3.1/.../live-status</code></td><td>1926</td></tr><tr><td><code>service/v3.3/.../live-detail</code></td><td>4866</td></tr></tbody></table></div>\n<p>캡처 시점 차이일 가능성이 있으나 확인되지 않았습니다. 시계열로 축적할 때는 한쪽 API로 통일합니다. 폴링 비용이 낮은 <code>live-status</code> 를 권장합니다.</p>\n<h3 id=\"livepv-와-readcount-는-다른-값입니다\">livePv 와 readCount 는 다른 값입니다<a class=\"anchor\" href=\"#/reference/analytics@livepv-와-readcount-는-다른-값입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>의미</th></tr></thead><tbody><tr><td>livePv</td><td>생방송 당시 시청자 수</td></tr><tr><td>readCount</td><td>VOD 다시보기 조회수</td></tr></tbody></table></div>\n<p>모집단이 다르므로 합산하거나 혼용하지 않습니다.</p>\n<hr>\n<h2 id=\"타-채널에서-얻을-수-없는-지표\">타 채널에서 얻을 수 없는 지표<a class=\"anchor\" href=\"#/reference/analytics@타-채널에서-얻을-수-없는-지표\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>아래 지표는 스튜디오 전용이며 타 채널에서는 어떤 방법으로도 조회할 수 없습니다.</p>\n<p>시청 지속시간, 유입 경로, 시청자 연령과 성별, 팔로워 증감 상세, 정산과 수익입니다.</p>\n<p>타 채널 분석은 위에 정리한 공개 지표와 자체 폴링이 한계입니다.</p>\n<hr>\n<h2 id=\"수집-시-주의\">수집 시 주의<a class=\"anchor\" href=\"#/reference/analytics@수집-시-주의\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>댓글과 채팅 응답에는 다른 이용자의 닉네임과 <code>userIdHash</code> 가 포함됩니다. 개인정보 취급에 유의합니다.</p>\n<p>요청 사이에 간격을 둡니다. 과도한 폴링은 IP 차단으로 이어집니다.</p>\n<p>스튜디오를 캡처하는 경우 <code>streaming-info</code> 의 스트림 키가 응답에 포함됩니다. (<a href=\"#/modules/manage@스트리밍-정보-조회\" data-nav>스트리밍 정보 조회 참조</a>)</p>", "toc": [{"level": 2, "id": "트랙-a--본인-채널", "text": "트랙 A — 본인 채널"}, {"level": 3, "id": "얻을-수-있는-지표", "text": "얻을 수 있는 지표"}, {"level": 3, "id": "함께-사용하는-api", "text": "함께 사용하는 API"}, {"level": 3, "id": "현재-한계", "text": "현재 한계"}, {"level": 2, "id": "트랙-b--타-채널", "text": "트랙 B — 타 채널"}, {"level": 3, "id": "인증-없이-얻을-수-있는-지표", "text": "인증 없이 얻을 수 있는 지표"}, {"level": 3, "id": "시계열-축적", "text": "시계열 축적"}, {"level": 3, "id": "vod-전수-수집", "text": "VOD 전수 수집"}, {"level": 2, "id": "수집-시-주의할-필드", "text": "수집 시 주의할 필드"}, {"level": 3, "id": "accumulatecount-는-항상-0입니다", "text": "accumulateCount 는 항상 0입니다"}, {"level": 3, "id": "concurrentusercount-가-api마다-다릅니다", "text": "concurrentUserCount 가 API마다 다릅니다"}, {"level": 3, "id": "livepv-와-readcount-는-다른-값입니다", "text": "livePv 와 readCount 는 다른 값입니다"}, {"level": 2, "id": "타-채널에서-얻을-수-없는-지표", "text": "타 채널에서 얻을 수 없는 지표"}, {"level": 2, "id": "수집-시-주의", "text": "수집 시 주의"}]}, "reference/deprecated": {"title": "제외된 API · 정정된 사실", "html": "<h1 id=\"제외된-api--정정된-사실\">제외된 API · 정정된 사실<a class=\"anchor\" href=\"#/reference/deprecated@제외된-api--정정된-사실\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>이 문서에 수록하지 않은 API와, 기존 라이브러리나 구 문서에 잘못 알려져 있던 사실을 정리합니다.<br>다른 자료를 보고 온 경우 특정 API가 없는 이유를 여기에서 확인할 수 있습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>관련 문서</td><td><a href=\"#/reference/endpoints\" data-nav>엔드포인트 전체 목록</a> · <a href=\"#/CONTRIBUTING\" data-nav>문서 규약</a></td></tr></tbody></table></div>\n<div class=\"table-wrap\"><table><thead><tr><th>분류</th><th>건수</th></tr></thead><tbody><tr><td><a href=\"#/reference/deprecated@읽기-전용-규칙으로-제외된-것\" data-nav>읽기 전용 규칙으로 제외</a></td><td>12</td></tr><tr><td><a href=\"#/reference/deprecated@구버전--경로-변경\" data-nav>구버전 · 경로 변경</a></td><td>4</td></tr><tr><td><a href=\"#/reference/deprecated@잘못-알려져-있던-사실\" data-nav>잘못 알려져 있던 사실</a></td><td>7</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"읽기-전용-규칙으로-제외된-것\">읽기 전용 규칙으로 제외된 것<a class=\"anchor\" href=\"#/reference/deprecated@읽기-전용-규칙으로-제외된-것\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>이 문서는 서버 상태를 변경하는 요청을 수록하지 않습니다. 그 결과 스트림 키나 채널 설정 변경 사고, 시청자 수 조작 경로가 문서에 포함되지 않습니다.</p>\n<h3 id=\"시청-이벤트--3건\">시청 이벤트 — 3건<a class=\"anchor\" href=\"#/reference/deprecated@시청-이벤트--3건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>사유</th></tr></thead><tbody><tr><td><code><span class=\"method m-post\">POST</span> /polling/v1/watch-event/live</code></td><td>시청 시간 집계 전용. 시청자 수 조작에 사용될 수 있음</td></tr><tr><td><code><span class=\"method m-post\">POST</span> /polling/v1/watch-event/video</code></td><td>위와 같음</td></tr><tr><td><code><span class=\"method m-post\">POST</span> /polling/v1/watch-event/clip</code></td><td>위와 같음</td></tr></tbody></table></div>\n<p>응답 본문이 없으며 요청에 <code>live-status</code> 의 <code>liveTokenList</code> 값이 필요합니다. 조회 목적으로는 호출할 필요가 없습니다.</p>\n<h3 id=\"스튜디오-쓰기--9건\">스튜디오 쓰기 — 9건<a class=\"anchor\" href=\"#/reference/deprecated@스튜디오-쓰기--9건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>Method</th></tr></thead><tbody><tr><td><code>/manage/v1/channels/{id}/live-setting/*</code></td><td>PUT</td></tr><tr><td><code>/manage/v1/channels/{id}/chats/prohibit-words</code></td><td>POST</td></tr><tr><td><code>/manage/v1/channels/{id}/chats/prohibit-words/{no}</code></td><td>DELETE · PUT</td></tr><tr><td><code>/manage/v1/channels/{id}/restrict-users</code></td><td>POST</td></tr><tr><td><code>/manage/v1/channels/{id}/restrict-users/{targetId}</code></td><td>DELETE</td></tr><tr><td><code>/manage/v1/channels/{id}/restrict-users/{targetId}/validate</code></td><td>POST</td></tr><tr><td><code>/manage/v1/channels/{id}/temporary-restrict-users</code></td><td>POST</td></tr><tr><td><code>/manage/v1/channels/{id}/restrict-release-requests/{no}/reject</code></td><td>POST</td></tr><tr><td><code>/manage/v1/channels/{id}/streaming-roles[/{targetId}]</code></td><td>PUT · DELETE</td></tr><tr><td><code>/manage/v1/channels/{id}/donations/mission/{approve,reject}</code></td><td>POST</td></tr></tbody></table></div>\n<p>위 목록은 라이브러리 소스를 기준으로 정리한 것이며, 스튜디오 실측 캡처(GET 47건)에는 포함되지 않았습니다. 따라서 이 규칙으로 누락된 검증 경로는 없습니다.</p>\n<p>GET이 함께 존재하는 경로(<code>chat-rules</code>, <code>prohibit-words</code>, <code>restrict-users</code>, <code>streaming-roles</code>, <code>live-setting/*</code>)는 GET만 <a href=\"#/modules/manage\" data-nav>Manage</a>에 수록했습니다.</p>\n<h3 id=\"채팅-송신--1건\">채팅 송신 — 1건<a class=\"anchor\" href=\"#/reference/deprecated@채팅-송신--1건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>cmd</th><th>이름</th></tr></thead><tbody><tr><td>3101</td><td>SEND_CHAT</td></tr></tbody></table></div>\n<p>수신 cmd는 <a href=\"#/modules/chat@cmd-코드\" data-nav>cmd 코드</a>에 있습니다.</p>\n<h3 id=\"예외--조회용-post-1건\">예외 — 조회용 POST 1건<a class=\"anchor\" href=\"#/reference/deprecated@예외--조회용-post-1건\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead><tr><th>경로</th><th>사유</th></tr></thead><tbody><tr><td><code><span class=\"method m-post\">POST</span> /service/v1/clips/detail-bulk</code></td><td>메서드는 POST이나 서버 상태를 변경하지 않음. 요청 본문에 <code>clipUIDList</code> 를 담아야 하므로 GET을 사용할 수 없음</td></tr></tbody></table></div>\n<p>수록 여부의 기준은 메서드가 아니라 서버 상태를 변경하는지 여부입니다. (<a href=\"#/modules/clip@클립-벌크-조회\" data-nav>클립 벌크 조회 참조</a>)</p>\n<hr>\n<h2 id=\"구버전--경로-변경\">구버전 · 경로 변경<a class=\"anchor\" href=\"#/reference/deprecated@구버전--경로-변경\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>기존 라이브러리를 사용하는 경우 아래 경로를 확인합니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>구버전</th><th>현행</th><th>비고</th></tr></thead><tbody><tr><td><code><span class=\"method m-get\">GET</span> /service/v2/channels/{id}/live-detail</code></td><td><code>/service/v3.3/...</code></td><td>v1과 v2 모두 구버전 (<a href=\"#/modules/live@라이브-상세-조회\" data-nav>라이브 상세 조회</a>)</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{id}/donations/missions</code></td><td><code>/service/v2/...</code></td><td>v1과 v2가 공존 (<a href=\"#/modules/commerce@미션-목록-조회\" data-nav>미션 목록 조회</a>)</td></tr><tr><td><code><span class=\"method m-get\">GET</span> /v1/chats/{cid}/users/{uid}/profile-card</code></td><td><code>.../profile</code></td><td><code>streamingChannelId</code> 파라미터가 추가로 필요 (<a href=\"#/modules/chat@프로필-조회\" data-nav>프로필 조회</a>)</td></tr><tr><td><code><span class=\"method m-post\">POST</span> /service/live-status</code></td><td><code><span class=\"method m-get\">GET</span> /polling/v3.1/.../live-status</code></td><td><a href=\"#/reference/deprecated@1-post-servicelive-status-는-라이브-상태-api가-아닙니다\" data-nav>아래 참조</a></td></tr></tbody></table></div>\n<hr>\n<h2 id=\"잘못-알려져-있던-사실\">잘못 알려져 있던 사실<a class=\"anchor\" href=\"#/reference/deprecated@잘못-알려져-있던-사실\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>구 문서나 공개 라이브러리에 기재된 내용과 실측 결과가 다른 항목입니다.</p>\n<h3 id=\"1-post-servicelive-status-는-라이브-상태-api가-아닙니다\">1. POST /service/live-status 는 라이브 상태 API가 아닙니다<a class=\"anchor\" href=\"#/reference/deprecated@1-post-servicelive-status-는-라이브-상태-api가-아닙니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>알려진 내용</td><td>라이브 상태 조회</td></tr><tr><td>실측 결과</td><td>행동 로그 수집기. 캡처 1,056건 중 113건이 이 요청</td></tr></tbody></table></div>\n<p>요청 본문에 <code>scene_id</code>, <code>action_id</code>, <code>event_context.referrer</code> 같은 분석용 필드가 포함됩니다. 데이터 수집용이므로 호출할 필요가 없습니다.</p>\n<p>라이브 상태는 <a href=\"#/modules/live@라이브-상태-조회\" data-nav>라이브 상태 조회</a>에서 제공합니다.</p>\n<h3 id=\"2-get-pollinglive-detail-은-라이브-상세가-아닙니다\">2. GET /polling/live-detail 은 라이브 상세가 아닙니다<a class=\"anchor\" href=\"#/reference/deprecated@2-get-pollinglive-detail-은-라이브-상세가-아닙니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>A/B 테스트 배정을 조회하는 API이며 <code>abTestNoList</code> 와 <code>entityId</code> 를 파라미터로 받습니다. 이름이 혼동을 유발하므로 근거로만 <a href=\"#/modules/live@ab-테스트-배정-조회\" data-nav>A/B 테스트 배정 조회</a>에 수록했습니다.</p>\n<h3 id=\"3-채팅-시스템은-하나입니다\">3. 채팅 시스템은 하나입니다<a class=\"anchor\" href=\"#/reference/deprecated@3-채팅-시스템은-하나입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>알려진 내용</td><td>구 방식 <code>kr-ss{N}</code> 과 신 방식 <code>ssio{N}</code> Socket.IO가 병존</td></tr><tr><td>실측 결과</td><td><code>ssio{N}</code> 은 채팅이 아니라 개인 알림 채널</td></tr></tbody></table></div>\n<p>관측된 WebSocket 프레임 8개가 모두 핸드셰이크와 하트비트였고 채팅 페이로드는 없었습니다. 앱 식별자는 <code>nng@glive</code> 입니다.</p>\n<p>채팅은 <a href=\"#/modules/chat\" data-nav>Chat</a>, 알림은 <a href=\"#/modules/notification\" data-nav>Notification</a>에 있습니다.</p>\n<h3 id=\"4-채팅-서버-번호-공식은-전제가-다릅니다\">4. 채팅 서버 번호 공식은 전제가 다릅니다<a class=\"anchor\" href=\"#/reference/deprecated@4-채팅-서버-번호-공식은-전제가-다릅니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>알려진 내용</td><td><code>sum(charCodes) % 9 + 1</code> 공식이 있었으나 <code>kr-ss24</code>, <code>kr-ss35</code> 가 관측되어 modulus가 변경된 것으로 추정</td></tr><tr><td>실측 결과</td><td>modulus 문제가 아니라 <code>cid</code> 에서 서버를 유도하는 방식 자체가 아님</td></tr></tbody></table></div>\n<p>동일한 <code>chatChannelId</code>(<code>N2dc9q</code>)가 <code>kr-ss24</code> 와 <code>kr-ss35</code> 양쪽에 접속해 모두 <code>retCode 0</code> 으로 성공했고, 양쪽 모두 <code>messageList</code> 를 정상 수신했습니다.</p>\n<p>풀 내의 임의 서버에 접속하면 됩니다. (<a href=\"#/modules/chat@서버-번호는-클라이언트가-정하지-않습니다\" data-nav>서버 번호는 클라이언트가 정하지 않습니다</a>)</p>\n<h3 id=\"5-채팅-connect-의-ver-은-3입니다\">5. 채팅 CONNECT 의 ver 은 3입니다<a class=\"anchor\" href=\"#/reference/deprecated@5-채팅-connect-의-ver-은-3입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p><code>ver</code> 값이 <code>2</code> 로 알려져 있으나 실제 값은 <code>3</code> 이며 <code>bdy</code> 구성도 확장됐습니다. <code>libVer</code>, <code>windowId</code>, <code>timezone</code>, <code>devName</code>, <code>locale</code> 이 추가됐습니다.</p>\n<p>응답 <code>cmd: 10100</code> 의 <code>bdy.sid</code> 를 이후 모든 요청에 포함해야 합니다. (<a href=\"#/modules/chat@connect-프레임\" data-nav>CONNECT 프레임</a>)</p>\n<h3 id=\"6-본인-채널은-시계열-데이터를-조회할-수-있습니다\">6. 본인 채널은 시계열 데이터를 조회할 수 있습니다<a class=\"anchor\" href=\"#/reference/deprecated@6-본인-채널은-시계열-데이터를-조회할-수-있습니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>알려진 내용</td><td>모든 조회 API가 현재 시점의 스냅샷만 제공하므로 직접 폴링해서 축적해야 함</td></tr><tr><td>실측 결과</td><td>본인 채널은 <code>manage/v1/.../stats/*</code> 로 과거 데이터를 조회할 수 있음</td></tr></tbody></table></div>\n<p><code>avgCv</code>(평균 동시 시청자), <code>peakCv</code>(최고 동시 시청자), <code>avgKeepWatchingRate</code>(평균 시청 유지율) 등 공개 API로는 얻을 수 없는 지표가 포함됩니다. (<a href=\"#/modules/stats\" data-nav>Stats 참조</a>)</p>\n<p>타 채널은 여전히 폴링이 유일한 방법입니다. 이 정정은 본인 채널에만 해당합니다. (<a href=\"#/reference/analytics\" data-nav>채널 애널리틱스 참조</a>)</p>\n<h3 id=\"7-대댓글-경로는-replycomments-입니다\">7. 대댓글 경로는 replyComments 입니다<a class=\"anchor\" href=\"#/reference/deprecated@7-대댓글-경로는-replycomments-입니다\" data-nav aria-label=\"이 절 링크\">#</a></h3>\n<p>추정 경로로 <code>.../comments/{commentId}/replies</code> 가 기재되어 있었으나 실제 경로는 <code>replyComments</code> 입니다. <code>limit</code> 없이 <code>offset</code> 만 받습니다. (<a href=\"#/modules/comment@대댓글-조회\" data-nav>대댓글 조회</a>)</p>\n<hr>\n<h2 id=\"무효-필드\">무효 필드<a class=\"anchor\" href=\"#/reference/deprecated@무효-필드\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<p>경로는 유효하지만 값이 채워지지 않는 필드입니다.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>위치</th><th>상태</th></tr></thead><tbody><tr><td>accumulateCount</td><td><code>live-status</code> · <code>live-detail</code></td><td>양쪽 모두 항상 0. 엔드포인트 차이가 아님</td></tr></tbody></table></div>\n<p>누적 시청자 수가 필요하면 VOD의 <code>livePv</code> 를 사용하거나 직접 집계합니다. (<a href=\"#/modules/live@accumulatecount-는-무효-필드입니다\" data-nav>accumulateCount 참조</a>)</p>\n<hr>\n<h2 id=\"강등된-항목\">강등된 항목<a class=\"anchor\" href=\"#/reference/deprecated@강등된-항목\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>항목</th><th>이전 기재</th><th>현재</th></tr></thead><tbody><tr><td>scene 헤더</td><td>필수</td><td>선택. 통계용이며 없어도 동작 (<a href=\"#/core/headers@scene\" data-nav>scene 참조</a>)</td></tr><tr><td>trackingParams</td><td>응답 필드로 설명</td><td>통계용. 조회 결과에 영향 없음</td></tr><tr><td>recId</td><td>응답 필드로 설명</td><td>추천 맥락 전달용. 문자열로 감싸진 JSON</td></tr></tbody></table></div>", "toc": [{"level": 2, "id": "읽기-전용-규칙으로-제외된-것", "text": "읽기 전용 규칙으로 제외된 것"}, {"level": 3, "id": "시청-이벤트--3건", "text": "시청 이벤트 — 3건"}, {"level": 3, "id": "스튜디오-쓰기--9건", "text": "스튜디오 쓰기 — 9건"}, {"level": 3, "id": "채팅-송신--1건", "text": "채팅 송신 — 1건"}, {"level": 3, "id": "예외--조회용-post-1건", "text": "예외 — 조회용 POST 1건"}, {"level": 2, "id": "구버전--경로-변경", "text": "구버전 · 경로 변경"}, {"level": 2, "id": "잘못-알려져-있던-사실", "text": "잘못 알려져 있던 사실"}, {"level": 3, "id": "1-post-servicelive-status-는-라이브-상태-api가-아닙니다", "text": "1. POST /service/live-status 는 라이브 상태 API가 아닙니다"}, {"level": 3, "id": "2-get-pollinglive-detail-은-라이브-상세가-아닙니다", "text": "2. GET /polling/live-detail 은 라이브 상세가 아닙니다"}, {"level": 3, "id": "3-채팅-시스템은-하나입니다", "text": "3. 채팅 시스템은 하나입니다"}, {"level": 3, "id": "4-채팅-서버-번호-공식은-전제가-다릅니다", "text": "4. 채팅 서버 번호 공식은 전제가 다릅니다"}, {"level": 3, "id": "5-채팅-connect-의-ver-은-3입니다", "text": "5. 채팅 CONNECT 의 ver 은 3입니다"}, {"level": 3, "id": "6-본인-채널은-시계열-데이터를-조회할-수-있습니다", "text": "6. 본인 채널은 시계열 데이터를 조회할 수 있습니다"}, {"level": 3, "id": "7-대댓글-경로는-replycomments-입니다", "text": "7. 대댓글 경로는 replyComments 입니다"}, {"level": 2, "id": "무효-필드", "text": "무효 필드"}, {"level": 2, "id": "강등된-항목", "text": "강등된 항목"}]}, "reference/endpoints": {"title": "엔드포인트 전체 목록", "html": "<h1 id=\"엔드포인트-전체-목록\">엔드포인트 전체 목록<a class=\"anchor\" href=\"#/reference/endpoints@엔드포인트-전체-목록\" data-nav aria-label=\"이 절 링크\">#</a></h1>\n<p>경로로 찾는 평면 인덱스입니다.파라미터와 응답 구조는 각 모듈 문서에 있습니다.</p>\n<div class=\"table-wrap\"><table><thead class=\"th-empty\"><tr><th></th><th></th></tr></thead><tbody><tr><td>수록</td><td>115건. 이름 확인 95건 + <a href=\"#/modules/manage@미수록-경로\" data-nav>미확보 20건</a></td></tr><tr><td>범위</td><td>읽기 전용. 제외된 쓰기 API는 <a href=\"#/reference/deprecated\" data-nav>제외된 API</a>에 있습니다</td></tr><tr><td>상태 표기</td><td>실측 · 스키마 미상 · 경로만 확인 · 추정 · 조회용 POST</td></tr><tr><td>부가 표기</td><td>인증 필요 · 민감 정보 · 애널리틱스 핵심</td></tr><tr><td>갱신</td><td>엔드포인트를 추가하면 <a href=\"#/reference/endpoints@집계\" data-nav>집계</a>의 건수도 함께 수정합니다</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"apichzzknavercom--service-43\"><code>api.chzzk.naver.com</code> — <code>/service</code> (43)<a class=\"anchor\" href=\"#/reference/endpoints@apichzzknavercom--service-43\" data-nav aria-label=\"이 절 링크\">#</a></h2>\n<div class=\"table-wrap\"><table><thead><tr><th>상태</th><th>경로</th><th>모듈</th></tr></thead><tbody><tr><td>경로만 확인</td><td><code><span class=\"method m-get\">GET</span> /service/v1/ad/display-status</code></td><td><a href=\"#/modules/commerce\" data-nav>commerce</a> — 광고 노출 상태 (pgId, pgType — 파라미터 미검증)</td></tr><tr><td>실측 · 인증 필요</td><td><code><span class=\"method m-get\">GET</span> /service/v1/badge-awards/unread</code></td><td><a href=\"#/modules/user\" data-nav>user</a> — 안 읽은 배지 획득 알림</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/badges/assets/last-updated</code></td><td><a href=\"#/modules/user\" data-nav>user</a> — 배지 이미지 에셋 갱신 시각 (badgeType)</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/banners</code></td><td><a href=\"#/modules/discovery\" data-nav>discovery</a> — 배너 목록 (deviceType, positionsIn)</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/categories/live</code></td><td><a href=\"#/modules/discovery\" data-nav>discovery</a> — 카테고리별 라이브 (size, 커서 페이지네이션)</td></tr><tr><td>실측 · 인증 필요</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/followings</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 팔로잉 목록 (page, size, sortType)</td></tr><tr><td>실측 · 인증 필요</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/followings/live</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 방송 중인 팔로잉만</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 채널 기본 정보</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/achievement-badges</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 업적 배지</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/announcements</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 채널 공지</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/cafe-connection</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 카페 연동 정보</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/chat-rules</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 채팅 규칙 (읽기, 공개)</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/clips</code></td><td><a href=\"#/modules/clip\" data-nav>clip</a> — 채널 클립 목록 (filterType, orderType, size, clipUID 커서)</td></tr><tr><td>실측 · 애널리틱스 핵심</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/data</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 채널 부가 데이터 — 개설일·누적 방송시간 (fields)</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/donations/chat-setting</code></td><td><a href=\"#/modules/commerce\" data-nav>commerce</a> — 채팅 후원 설정</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/donations/mission-setting</code></td><td><a href=\"#/modules/commerce\" data-nav>commerce</a> — 미션 후원 설정</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/donations/video-setting</code></td><td><a href=\"#/modules/commerce\" data-nav>commerce</a> — 영상 후원 설정</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/follow</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 팔로우 정보</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/live-recommended</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 추천 라이브</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/live-schedule</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 방송 예정 일정</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/log-power/prediction</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 로그파워 예측</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/party-donation-info</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — 파티 후원 정보</td></tr><tr><td>실측</td><td><code><span class=\"method m-get\">GET</span> /service/v1/channels/{channelId}/videos</code></td><td><a href=\"#/modules/channel\" data-nav>channel</a> — VOD 목록 — 공개분만 (page, size)</td></tr><tr><td>실측</td><td><code><span class=\"metho
